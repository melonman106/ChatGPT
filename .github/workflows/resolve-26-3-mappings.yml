name: Resolve 26.3 to 26.2 block and blockstate mappings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download mapping files
        run: |
          curl -L --fail -o mapping.nbt https://raw.githubusercontent.com/melonman106/ChatGPT/main/viabackwards-extracted/assets/viabackwards/data/mappings-26.3to26.2.nbt
          curl -L --fail -o identifiers.nbt https://raw.githubusercontent.com/ViaVersion/ViaVersion/master/common/src/main/resources/assets/viaversion/data/identifier-table.nbt

      - name: Install NBT parser
        run: pip install nbtlib

      - name: Inspect mappings
        run: |
          cat > inspect.py <<'PY'
          import nbtlib

          m = nbtlib.load("mapping.nbt", gzipped=False)
          ids = nbtlib.load("identifiers.nbt", gzipped=False)

          def show(tag, depth=0, maxdepth=4):
              if depth > maxdepth:
                  return "<...>"
              if isinstance(tag, nbtlib.tag.Compound):
                  return {str(k): show(v, depth+1, maxdepth) for k,v in tag.items()}
              if isinstance(tag, nbtlib.tag.List):
                  return [show(v, depth+1, maxdepth) for v in tag]
              if isinstance(tag, nbtlib.tag.ByteArray):
                  return f"<ByteArray {len(tag)} bytes>"
              if isinstance(tag, nbtlib.tag.IntArray):
                  return [int(x) for x in tag]
              if isinstance(tag, nbtlib.tag.LongArray):
                  return [int(x) for x in tag]
              return int(tag) if isinstance(tag, (nbtlib.tag.Byte, nbtlib.tag.Short, nbtlib.tag.Int, nbtlib.tag.Long)) else str(tag)

          lines=[]
          lines.append("ViaBackwards 5.12.0 — 26.3 -> 26.2 mapping inspection")
          lines.append("")

          # First dump the structure of blockstates so we know its exact format.
          bs=m["blockstates"]
          lines.append("BLOCKSTATES STRUCTURE:")
          lines.append(str(show(bs, maxdepth=3)))
          lines.append("")

          # Dump the raw relevant identifier names. Depending on Via's format,
          # blockstate identifiers may be represented separately from block IDs.
          for key in ("blocks","blockstates","items"):
              if key in ids:
                  lines.append(f"IDENTIFIER TABLE: {key}")
                  vals=[str(x) for x in ids[key]]
                  for i,n in enumerate(vals):
                      if any(x in n for x in ("wool_stair","wool_slab","straw_bed","poplar","cushion")):
                          lines.append(f"{i}: {n}")
                  lines.append("")

          # Print every mapping compound's immediate keys/types and values,
          # plus compact array sizes. This is intentionally diagnostic rather
          # than assuming a strategy format.
          for key in ("blocks","blockstates","items"):
              tag=m[key]
              lines.append(f"MAPPING {key}:")
              if isinstance(tag, nbtlib.tag.Compound):
                  for k,v in tag.items():
                      if isinstance(v, nbtlib.tag.Compound):
                          lines.append(f"  {k}: Compound keys={list(v.keys())}")
                          for kk,vv in v.items():
                              if isinstance(vv,(nbtlib.tag.ByteArray,nbtlib.tag.IntArray,nbtlib.tag.LongArray,nbtlib.tag.List)):
                                  lines.append(f"    {kk}: {type(vv).__name__} length={len(vv)}")
                              else:
                                  lines.append(f"    {kk}: {vv}")
                      elif isinstance(v,(nbtlib.tag.ByteArray,nbtlib.tag.IntArray,nbtlib.tag.LongArray,nbtlib.tag.List)):
                          lines.append(f"  {k}: {type(v).__name__} length={len(v)}")
                      else:
                          lines.append(f"  {k}: {v}")
              else:
                  lines.append(str(show(tag,maxdepth=2)))
              lines.append("")

          open("mapping-results.txt","w").write("\n".join(lines)+"\n")
          print("\n".join(lines))
          PY
          python inspect.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapping-results.txt
          git commit -m "Inspect 26.3 blockstate mappings" || exit 0
          git push
