name: Resolve 26.3 to 26.2 block mappings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download mapping files
        run: |
          curl -L --fail -o mapping.nbt https://raw.githubusercontent.com/melonman106/ChatGPT/main/viabackwards-extracted/assets/viabackwards/data/mappings-26.3to26.2.nbt
          curl -L --fail -o identifiers.nbt https://raw.githubusercontent.com/ViaVersion/ViaVersion/master/common/src/main/resources/assets/viaversion/data/identifier-table.nbt

      - name: Install NBT parser
        run: pip install nbtlib

      - name: Resolve exact block mappings
        run: |
          cat > resolve.py <<'PY'
          import nbtlib

          m = nbtlib.load("mapping.nbt", gzipped=False)
          ids = nbtlib.load("identifiers.nbt", gzipped=False)

          def varint(data, pos):
              value = 0
              shift = 0
              while True:
                  b = data[pos]; pos += 1
                  value |= (b & 0x7f) << shift
                  if not b & 0x80:
                      return value, pos
                  shift += 7

          def zigzag(data, pos):
              v, pos = varint(data, pos)
              return (v >> 1) ^ -(v & 1), pos

          def decode(tag):
              strategy = int(tag["id"])
              size = int(tag["size"])
              raw = bytes(tag["val"])
              out = [-1] * size
              pos = 0

              if strategy == 1:
                  if len(raw) != size * 4:
                      raise RuntimeError(f"strategy 1 length {len(raw)} != {size*4}")
                  for i in range(size):
                      n = i * 4
                      out[i] = int.from_bytes(raw[n:n+4], "big", signed=True)
                  return out

              if strategy == 0:
                  prev = 0
                  for i in range(size):
                      delta, pos = zigzag(raw, pos)
                      prev += delta
                      out[i] = prev
                  return out

              if strategy == 2:
                  index = -1
                  value = 0
                  while pos < len(raw):
                      di, pos = varint(raw, pos)
                      dv, pos = zigzag(raw, pos)
                      index += 1 + di
                      value += dv
                      if index >= size:
                          raise RuntimeError("sparse mapping index out of range")
                      out[index] = value
                  return out

              raise RuntimeError(f"unsupported strategy {strategy}")

          block_map = decode(m["blocks"])

          block_names = [str(x) for x in ids["blocks"]]

          targets = ["white_wool_stairs", "white_wool_slab", "straw_bed"]

          lookup = {}
          for i, n in enumerate(block_names):
              lookup[n] = i
              lookup["minecraft:" + n] = i

          lines = ["ViaBackwards 5.12.0 — exact 26.3 -> 26.2 block mappings", ""]

          for target in targets:
              if target not in lookup:
                  lines.append(f"{target}: NOT FOUND in identifier table")
                  continue
              src = lookup[target]
              dst = block_map[src]
              dst_name = block_names[dst] if 0 <= dst < len(block_names) else "UNKNOWN"
              lines.append(f"{target}: source block id {src} -> target block id {dst} -> {dst_name}")

          lines.append("")
          lines.append("Relevant identifier entries:")
          for i, n in enumerate(block_names):
              if any(x in n for x in ("wool_stair", "wool_slab", "straw_bed", "cushion", "poplar")):
                  dst = block_map[i] if i < len(block_map) else -1
                  dn = block_names[dst] if 0 <= dst < len(block_names) else "UNKNOWN"
                  lines.append(f"{i}: {n} -> {dst}: {dn}")

          result = "\n".join(lines) + "\n"
          print(result)
          open("mapping-results.txt", "w").write(result)
          PY
          python resolve.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapping-results.txt
          git commit -m "Resolve exact 26.3 to 26.2 block mappings" || exit 0
          git push
