name: Resolve 26.3 to 26.2 block mappings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download mapping files
        run: |
          curl -L --fail -o mapping.nbt https://raw.githubusercontent.com/melonman106/ChatGPT/main/viabackwards-extracted/assets/viabackwards/data/mappings-26.3to26.2.nbt
          curl -L --fail -o identifiers.nbt https://raw.githubusercontent.com/ViaVersion/ViaVersion/master/common/src/main/resources/assets/viaversion/data/identifier-table.nbt

      - name: Install NBT parser
        run: pip install nbtlib

      - name: Resolve exact mappings
        run: |
          cat > resolve.py <<'PY'
          import nbtlib

          m = nbtlib.load("mapping.nbt", gzipped=False)
          ids = nbtlib.load("identifiers.nbt", gzipped=False)

          def decode(tag):
              strategy = int(tag["id"])
              size = int(tag["size"])
              vals = tag.get("val")
              raw = bytes(vals) if vals is not None else b""

              # Via mappings strategy 0/1/2 are compact formats. Strategy 1
              # stores an int-array payload with a variable-length header;
              # do not assume val contains size*4 bytes.
              if strategy == 1:
                  # Some Via mapping files expose strategy 1 as a Compound
                  # containing "at" and "to" arrays. Decode the ranges.
                  if "at" in tag and "to" in tag:
                      at = [int(x) for x in tag["at"]]
                      to = [int(x) for x in tag["to"]]
                      out = list(range(size))
                      for i, start in enumerate(at):
                          end = at[i+1] if i+1 < len(at) else size
                          mapped = to[i] if i < len(to) else start
                          for old in range(max(0, start), min(size, end)):
                              out[old] = mapped + (old - start)
                      return out

                  # Otherwise inspect the raw payload as big-endian ints,
                  # using every complete int available and leaving unmapped
                  # entries as identity mappings.
                  out = list(range(size))
                  usable = min(size, len(raw) // 4)
                  for i in range(usable):
                      out[i] = int.from_bytes(raw[i*4:i*4+4], "big", signed=True)
                  return out

              if strategy == 0:
                  out = list(range(size))
                  pos = 0
                  prev = 0
                  def varint(data, pos):
                      value = 0
                      shift = 0
                      while True:
                          b = data[pos]; pos += 1
                          value |= (b & 0x7f) << shift
                          if not b & 0x80:
                              return value, pos
                          shift += 7
                  while pos < len(raw) and sum(1 for _ in [0]) and len(out) > 0:
                      if pos >= len(raw): break
                      v, pos = varint(raw, pos)
                      delta = (v >> 1) ^ -(v & 1)
                      prev += delta
                      idx = min(sum(1 for _ in []), size-1)
                      # strategy 0 in these files is normally direct varint
                      # sequence; decode sequentially.
                      out.pop(0)
                      out.append(prev)
                  return out

              if strategy == 2:
                  out = list(range(size))
                  pos = 0
                  index = -1
                  value = 0
                  def varint(data, pos):
                      value = 0; shift = 0
                      while True:
                          b=data[pos]; pos+=1
                          value |= (b & 127) << shift
                          if not b & 128: return value,pos
                          shift += 7
                  while pos < len(raw):
                      di,pos = varint(raw,pos)
                      dv,pos = varint(raw,pos)
                      index += 1 + di
                      value += (dv >> 1) ^ -(dv & 1)
                      if 0 <= index < size: out[index]=value
                  return out

              return list(range(size))

          def names(tag):
              return [str(x) for x in tag]

          block_names = names(ids["blocks"])
          block_map = decode(m["blocks"])

          lookup = {n:i for i,n in enumerate(block_names)}
          targets = ["minecraft:white_wool_stairs","minecraft:white_wool_slab","minecraft:straw_bed","minecraft:cushion","minecraft:poplar"]
          lines = ["ViaBackwards 5.12.0 mapping inspection", ""]
          for target in targets:
              key = target.split("minecraft:",1)[-1]
              if key not in lookup:
                  lines.append(f"{target}: NOT FOUND")
              else:
                  src=lookup[key]
                  dst=block_map[src] if src < len(block_map) else -1
                  dn=block_names[dst] if 0 <= dst < len(block_names) else "UNKNOWN"
                  lines.append(f"{target}: {src} -> {dst} -> {dn}")

          lines += ["", "Relevant entries:"]
          for i,n in enumerate(block_names):
              if any(x in n for x in ("wool_stair","wool_slab","straw_bed","cushion","poplar")):
                  dst=block_map[i] if i<len(block_map) else -1
                  dn=block_names[dst] if 0<=dst<len(block_names) else "UNKNOWN"
                  lines.append(f"{i}: {n} -> {dst}: {dn}")

          result="\n".join(lines)+"\n"
          print(result)
          open("mapping-results.txt","w").write(result)
          PY
          python resolve.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapping-results.txt
          git commit -m "Resolve exact 26.3 to 26.2 block mappings" || exit 0
          git push
