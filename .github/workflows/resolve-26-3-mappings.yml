name: Resolve 26.3 to 26.2 block and blockstate mappings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Via mapping data
        run: |
          curl -L --fail -o mapping.nbt https://raw.githubusercontent.com/melonman106/ChatGPT/main/viabackwards-extracted/assets/viabackwards/data/mappings-26.3to26.2.nbt
          curl -L --fail -o identifiers.nbt https://raw.githubusercontent.com/ViaVersion/ViaVersion/master/common/src/main/resources/assets/viaversion/data/identifier-table.nbt

          curl -L --fail -o mapping-26.3.json https://raw.githubusercontent.com/ViaVersion/Mappings/main/mappings/mapping-26.3.json
          curl -L --fail -o mapping-26.2.json https://raw.githubusercontent.com/ViaVersion/Mappings/main/mappings/mapping-26.2.json
          curl -L --fail -o diff-26.3to26.2.json https://raw.githubusercontent.com/ViaVersion/Mappings/main/mappings/diff/mapping-26.3to26.2.json

      - name: Install NBT parser
        run: pip install nbtlib

      - name: Resolve exact blockstates
        run: |
          cat > resolve_blockstates.py <<'PY'
          import json
          import nbtlib

          old = json.load(open("mapping-26.3.json"))
          new = json.load(open("mapping-26.2.json"))
          diff = json.load(open("diff-26.3to26.2.json"))

          old_states = old["blockstates"]
          new_states = new["blockstates"]
          old_index = {name: i for i, name in enumerate(old_states)}
          new_index = {name: i for i, name in enumerate(new_states)}

          targets = [
              "white_wool_stairs", "orange_wool_stairs", "magenta_wool_stairs",
              "light_blue_wool_stairs", "yellow_wool_stairs", "lime_wool_stairs",
              "pink_wool_stairs", "gray_wool_stairs", "light_gray_wool_stairs",
              "cyan_wool_stairs", "purple_wool_stairs", "blue_wool_stairs",
              "brown_wool_stairs", "green_wool_stairs", "red_wool_stairs",
              "black_wool_stairs",
              "white_wool_slab", "orange_wool_slab", "magenta_wool_slab",
              "light_blue_wool_slab", "yellow_wool_slab", "lime_wool_slab",
              "pink_wool_slab", "gray_wool_slab", "light_gray_wool_slab",
              "cyan_wool_slab", "purple_wool_slab", "blue_wool_slab",
              "brown_wool_slab", "green_wool_slab", "red_wool_slab",
              "black_wool_slab",
              "straw_bed"
          ]

          lines = []
          lines.append("ViaBackwards 5.12.0 — EXACT 26.3 -> 26.2 BLOCKSTATE RESOLUTION")
          lines.append("")
          lines.append("This uses the human-readable ViaVersion mapping/diff source to resolve every state.")
          lines.append("A trailing '[' in the diff means blockstate properties are copied to the target block.")
          lines.append("")

          missing = []

          for base in targets:
              rule = diff.get("blockstates", {}).get(base)
              lines.append(f"=== {base} ===")
              if rule is None:
                  lines.append("NO BLOCKSTATE DIFF RULE")
                  lines.append("")
                  continue

              lines.append(f"ViaBackwards rule: {base} -> {rule}")

              source_states = [
                  (i, name) for i, name in enumerate(old_states)
                  if name == base or name.startswith(base + "[")
              ]

              for src_id, src_name in source_states:
                  if rule.endswith("["):
                      suffix = src_name[len(base):]
                      dst_name = rule[:-1] + suffix
                  else:
                      dst_name = rule

                  dst_id = new_index.get(dst_name)
                  if dst_id is None:
                      lines.append(f"  {src_id:5d}  {src_name}  ->  MISSING: {dst_name}")
                      missing.append((src_name, dst_name))
                  else:
                      lines.append(f"  {src_id:5d}  {src_name}  ->  {dst_id:5d}  {dst_name}")

              lines.append("")

          lines.append("=== BLOCK REGISTRY DIFF ===")
          for name in targets:
              rule = diff.get("blocks", {}).get(name)
              if rule:
                  lines.append(f"{name} -> {rule}")
              else:
                  lines.append(f"{name} -> <no explicit block diff>")

          lines.append("")
          lines.append("=== ITEM REGISTRY DIFF ===")
          for name in targets:
              rule = diff.get("items", {}).get(name)
              if rule:
                  lines.append(f"{name} -> {rule}")
              else:
                  lines.append(f"{name} -> <no explicit item diff>")

          lines.append("")
          lines.append("=== ENTITY DIFF ===")
          for name, rule in diff.get("entities", {}).items():
              if "cushion" in name:
                  lines.append(f"{name} -> {rule}")

          lines.append("")
          lines.append(f"Missing exact destination blockstates: {len(missing)}")
          for src, dst in missing:
              lines.append(f"MISSING: {src} -> {dst}")

          result = "\n".join(lines) + "\n"
          open("mapping-results.txt", "w").write(result)
          print(result)

          if missing:
              raise SystemExit("Some destination blockstates could not be resolved.")
          PY

          python resolve_blockstates.py

      - name: Also inspect compact NBT structure
        run: |
          cat > vb_state_dump.py <<'PY'
          import nbtlib

          m = nbtlib.load("mapping.nbt", gzipped=False)
          ids = nbtlib.load("identifiers.nbt", gzipped=False)

          def show(tag, depth=0, maxdepth=4):
              if depth > maxdepth:
                  return "<...>"
              if isinstance(tag, nbtlib.tag.Compound):
                  return {str(k): show(v, depth+1, maxdepth) for k,v in tag.items()}
              if isinstance(tag, nbtlib.tag.List):
                  return [show(v, depth+1, maxdepth) for v in tag]
              if isinstance(tag, nbtlib.tag.ByteArray):
                  return f"<ByteArray {len(tag)} bytes>"
              if isinstance(tag, nbtlib.tag.IntArray):
                  return [int(x) for x in tag]
              if isinstance(tag, nbtlib.tag.LongArray):
                  return [int(x) for x in tag]
              return int(tag) if isinstance(tag, (nbtlib.tag.Byte, nbtlib.tag.Short, nbtlib.tag.Int, nbtlib.tag.Long)) else str(tag)

          lines = []
          lines.append("")
          lines.append("=== COMPACT NBT STRUCTURE ===")
          lines.append(f"blockstates: {show(m['blockstates'], maxdepth=3)}")
          lines.append(f"blocks: {show(m['blocks'], maxdepth=3)}")
          lines.append(f"items: {show(m['items'], maxdepth=3)}")
          lines.append(f"entities: {show(m['entities'], maxdepth=3)}")
          lines.append("")
          lines.append("=== IDENTIFIER TABLE ENTITY CHECK ===")
          for i, n in enumerate([str(x) for x in ids["entities"]]):
              if "cushion" in n:
                  lines.append(f"{i}: {n}")

          with open("mapping-results.txt", "a") as f:
              f.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
          python vb_state_dump.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapping-results.txt
          git commit -m "Resolve exact 26.3 blockstates to 26.2" || exit 0
          git push
