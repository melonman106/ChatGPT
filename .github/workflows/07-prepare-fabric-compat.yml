name: Prepare Fabric 26.2 Compatibility Inputs

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MC_VERSION: "26.2"
  MC_CLIENT_SHA256: "40896ee9f1e2bec3c934daac7e93d41e9e3d9c2f8ae0ca366d52ffbfd1afa290"
  FABRIC_LOADER_VERSION: "0.19.3"
  FABRIC_INSTALLER_VERSION: "1.1.2"
  FABRIC_API_VERSION_ID: "3kB7XVBv"
  FABRIC_API_VERSION: "0.152.1+26.2"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Eaglercraft-26.2-u1-Extracted
            ViaBackport26.2-ClientSide
            ModsPack
            .github

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download Fabric Installer 1.1.2
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            "https://maven.fabricmc.net/net/fabricmc/fabric-installer/${FABRIC_INSTALLER_VERSION}/fabric-installer-${FABRIC_INSTALLER_VERSION}.jar" \
            -o fabric-installer.jar
          test -s fabric-installer.jar
          stat -c 'Fabric installer bytes: %s' fabric-installer.jar
          sha256sum fabric-installer.jar | tee fabric-installer.sha256
          java -jar fabric-installer.jar help | tee fabric-installer-help.txt

      - name: Download and verify the complete Minecraft 26.2 client JAR
        run: |
          set -euo pipefail
          mkdir -p minecraft-input
          curl -fL --retry 5 --retry-all-errors \
            "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json" \
            -o minecraft-input/version-manifest.json
          VERSION_URL="$(python3 - <<'PY'
          import json
          with open('minecraft-input/version-manifest.json', encoding='utf-8') as f:
              data = json.load(f)
          matches = [v['url'] for v in data['versions'] if v['id'] == '26.2']
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one Minecraft 26.2 version entry, found {len(matches)}')
          print(matches[0])
          PY
          )"
          curl -fL --retry 5 --retry-all-errors "$VERSION_URL" -o minecraft-input/26.2-version.json
          CLIENT_URL="$(python3 - <<'PY'
          import json
          with open('minecraft-input/26.2-version.json', encoding='utf-8') as f:
              print(json.load(f)['downloads']['client']['url'])
          PY
          )"
          curl -fL --retry 5 --retry-all-errors "$CLIENT_URL" -o minecraft-input/minecraft-26.2-client.jar
          test -s minecraft-input/minecraft-26.2-client.jar
          ACTUAL_SHA="$(sha256sum minecraft-input/minecraft-26.2-client.jar | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$MC_CLIENT_SHA256"
          CLIENT_BYTES="$(stat -c '%s' minecraft-input/minecraft-26.2-client.jar)"
          echo "Minecraft 26.2 client bytes: $CLIENT_BYTES"
          test "$CLIENT_BYTES" -ge 30000000
          sha256sum minecraft-input/minecraft-26.2-client.jar | tee minecraft-input/minecraft-26.2-client.sha256

      - name: Install Fabric 26.2 client profile
        run: |
          set -euo pipefail
          rm -rf fabric-client
          mkdir -p fabric-client
          java -jar fabric-installer.jar client \
            -dir "$GITHUB_WORKSPACE/fabric-client" \
            -mcversion "$MC_VERSION" \
            -loader "$FABRIC_LOADER_VERSION" \
            -noprofile
          test -d fabric-client/versions
          find fabric-client -type f -print | sort | tee fabric-client-files-before-seeding.txt

      - name: Ensure the complete verified Minecraft JAR is in the Fabric version directory
        run: |
          set -euo pipefail
          mkdir -p "fabric-client/versions/$MC_VERSION"
          FOUND_MATCH=0
          while IFS= read -r jar; do
            [ -f "$jar" ] || continue
            sha="$(sha256sum "$jar" | awk '{print $1}')"
            if [ "$sha" = "$MC_CLIENT_SHA256" ]; then
              echo "Verified Minecraft client already present: $jar"
              FOUND_MATCH=1
              break
            fi
          done < <(find fabric-client -type f -name '*.jar' -print)
          if [ "$FOUND_MATCH" -eq 0 ]; then
            echo "Fabric installer did not place the complete Minecraft client JAR; seeding the verified Mojang JAR."
            cp minecraft-input/minecraft-26.2-client.jar "fabric-client/versions/$MC_VERSION/$MC_VERSION.jar"
          fi
          test -f "fabric-client/versions/$MC_VERSION/$MC_VERSION.jar"
          INSTALLED_SHA="$(sha256sum "fabric-client/versions/$MC_VERSION/$MC_VERSION.jar" | awk '{print $1}')"
          test "$INSTALLED_SHA" = "$MC_CLIENT_SHA256"
          INSTALLED_BYTES="$(stat -c '%s' "fabric-client/versions/$MC_VERSION/$MC_VERSION.jar")"
          echo "Installed Minecraft client bytes: $INSTALLED_BYTES"
          test "$INSTALLED_BYTES" -ge 30000000

      - name: Verify the complete Fabric client runtime
        run: |
          set -euo pipefail
          test -d fabric-client/libraries
          test -d fabric-client/versions
          test -d fabric-client/assets
          test -f "fabric-client/versions/$MC_VERSION/$MC_VERSION.jar"
          INSTALLED_SHA="$(sha256sum "fabric-client/versions/$MC_VERSION/$MC_VERSION.jar" | awk '{print $1}')"
          test "$INSTALLED_SHA" = "$MC_CLIENT_SHA256"
          INSTALLED_BYTES="$(stat -c '%s' "fabric-client/versions/$MC_VERSION/$MC_VERSION.jar")"
          echo "Complete Minecraft client: $INSTALLED_BYTES bytes"
          test "$INSTALLED_BYTES" -ge 30000000
          echo "Fabric client directories:"
          du -sh fabric-client/* 2>/dev/null || true
          find fabric-client -type f -print | sort | tee fabric-client-files.txt
          echo "JAR inventory:"
          find fabric-client -type f -name '*.jar' -printf '%s %p\n' | sort -nr | tee fabric-client-jars.txt

      - name: Verify Fabric API is present and non-truncated
        run: |
          set -euo pipefail
          mkdir -p fabric-libs
          curl -fL --retry 5 --retry-all-errors \
            "https://api.modrinth.com/maven/maven/modrinth/P7dR8mSH/$FABRIC_API_VERSION_ID/P7dR8mSH-$FABRIC_API_VERSION_ID.jar" \
            -o "fabric-libs/fabric-api-$FABRIC_API_VERSION.jar"
          test -s "fabric-libs/fabric-api-$FABRIC_API_VERSION.jar"
          API_BYTES="$(stat -c '%s' "fabric-libs/fabric-api-$FABRIC_API_VERSION.jar")"
          echo "Fabric API bytes: $API_BYTES"
          test "$API_BYTES" -ge 2000000
          sha256sum "fabric-libs/fabric-api-$FABRIC_API_VERSION.jar" | tee fabric-libs/fabric-api.sha256
          unzip -t "fabric-libs/fabric-api-$FABRIC_API_VERSION.jar" >/dev/null

      - name: Verify the existing Eagler production input remains separate
        run: |
          set -euo pipefail
          test -f Eaglercraft-26.2-u1-Extracted/eagler-patcher
          echo "Eagler u1 patcher remains the production source pipeline."
          echo "Fabric is compatibility/development input only; Fabric Loader is not injected into Eagler."

      - name: Write complete compatibility manifest and size audit
        run: |
          set -euo pipefail
          mkdir -p fabric-compatibility
          {
            echo "=== COMPLETE FABRIC 26.2 INPUT AUDIT ==="
            echo "Minecraft: $MC_VERSION"
            echo "Expected Minecraft client SHA256: $MC_CLIENT_SHA256"
            sha256sum minecraft-input/minecraft-26.2-client.jar
            stat -c 'Minecraft client bytes: %s' minecraft-input/minecraft-26.2-client.jar
            echo
            echo "Installed Fabric Minecraft client:"
            sha256sum "fabric-client/versions/$MC_VERSION/$MC_VERSION.jar"
            stat -c 'Installed client bytes: %s' "fabric-client/versions/$MC_VERSION/$MC_VERSION.jar"
            echo
            echo "Fabric Installer: $FABRIC_INSTALLER_VERSION"
            sha256sum fabric-installer.jar
            stat -c 'Fabric installer bytes: %s' fabric-installer.jar
            echo
            echo "Fabric Loader: $FABRIC_LOADER_VERSION"
            echo "Fabric API: $FABRIC_API_VERSION"
            sha256sum "fabric-libs/fabric-api-$FABRIC_API_VERSION.jar"
            stat -c 'Fabric API bytes: %s' "fabric-libs/fabric-api-$FABRIC_API_VERSION.jar"
            echo
            echo "Fabric client total bytes:"
            find fabric-client -type f -printf '%s\n' | awk '{s+=$1} END {print s}'
            echo "Fabric client file count: $(find fabric-client -type f | wc -l)"
            echo
            echo "Largest Fabric client files:"
            find fabric-client -type f -printf '%s %p\n' | sort -nr | head -25
          } | tee fabric-compatibility/size-audit.txt

          cat > fabric-compatibility/manifest.json <<EOF
          {
            "minecraft": "$MC_VERSION",
            "minecraftClientSha256": "$MC_CLIENT_SHA256",
            "fabricLoader": "$FABRIC_LOADER_VERSION",
            "fabricInstaller": "$FABRIC_INSTALLER_VERSION",
            "fabricApi": "$FABRIC_API_VERSION",
            "purpose": "complete Fabric reference client plus compile-time compatibility inputs",
            "runtimeLoader": "eagler",
            "fabricLoaderRuntime": false,
            "fabricApiRuntime": false,
            "integrityChecks": {
              "minecraftClientSha256Verified": true,
              "minecraftClientAtLeast30MB": true,
              "installedClientSha256Verified": true,
              "fabricApiAtLeast2MB": true,
              "fabricClientHasLibraries": true,
              "fabricClientHasVersions": true,
              "fabricClientHasAssets": true
            }
          }
          EOF
          cat fabric-compatibility/manifest.json

      - name: Upload complete Fabric compatibility inputs and audit
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.2-complete-compatibility-inputs
          path: |
            fabric-installer.jar
            fabric-installer.sha256
            fabric-installer-help.txt
            minecraft-input/
            fabric-client/
            fabric-client-files.txt
            fabric-client-files-before-seeding.txt
            fabric-client-jars.txt
            fabric-libs/
            fabric-compatibility/manifest.json
            fabric-compatibility/size-audit.txt
          if-no-files-found: error
          retention-days: 14
