name: Fix Eaglercraft 26.2 u1 VBV Client

on:
  workflow_dispatch:
  push:
    paths:
      - "ViaBackport26.2-ClientSide/**"
      - "ModsPack/**"
      - "sounds.epk"
      - "u1-1-source/**"
      - "U1-Patcher/**"
      - ".github/workflows/01-fix-eagler-vbv.yml"

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.8"

      - name: Repair missing client files
        shell: bash
        run: |
          set -euo pipefail

          restore_from_history() {
            local path="$1"
            local commit=""
            if [ -s "$path" ]; then
              echo "Already present: $path"
              return 0
            fi
            commit="$(git rev-list --all -- "$path" | head -1 || true)"
            if [ -n "$commit" ]; then
              mkdir -p "$(dirname "$path")"
              git show "$commit:$path" > "$path"
            fi
            [ -s "$path" ]
          }

          restore_from_history ViaBackport26.2-ClientSide/patch/zipfile.py
          restore_from_history ViaBackport26.2-ClientSide/pack.png
          restore_from_history sounds.epk || true
          restore_from_history u1-1-source/patcher/java-cli/eagler-patcher

          # portable-kit.zip is a large binary release asset. Download the
          # authoritative pinned copy instead of relying on the text contents API.
          if [ ! -s U1-Patcher/portable-kit.zip ] || [ "$(wc -c < U1-Patcher/portable-kit.zip)" -lt 1000000 ]; then
            mkdir -p U1-Patcher
            curl -fL --retry 3 --retry-delay 2               "https://github.com/melonman106/ChatGPT/releases/download/Cleit/portable-kit.zip"               -o U1-Patcher/portable-kit.zip
          fi

          chmod +x u1-1-source/patcher/java-cli/eagler-patcher
          echo "Client repair inputs prepared."

      - name: Verify required client files
        shell: bash
        run: |
          set -euo pipefail

          check_file() {
            local path="$1"
            if [ ! -e "$path" ]; then
              echo "::error file=$path::Required file is missing."
              return 1
            fi
            if [ ! -f "$path" ]; then
              echo "::error file=$path::Required path is not a regular file."
              return 1
            fi
            if [ ! -s "$path" ]; then
              echo "::error file=$path::Required file is empty."
              return 1
            fi
            echo "OK: $path ($(stat -c '%s bytes' "$path"))"
          }

          check_file ViaBackport26.2-ClientSide/patch/apply_vbv_patch.py
          check_file ViaBackport26.2-ClientSide/patch/zipfile.py
          check_file ViaBackport26.2-ClientSide/pack.png
          check_file sounds.epk
          check_file U1-Patcher/portable-kit.zip
          check_file u1-1-source/patcher/java-cli/eagler-patcher

          echo "=== Git LFS status ==="
          git lfs ls-files 2>/dev/null || true

          echo "=== Required binary hashes ==="
          sha256sum ViaBackport26.2-ClientSide/pack.png sounds.epk U1-Patcher/portable-kit.zip

          echo "Required VBV/Eagler inputs are present and non-empty."

      - name: Validate VBV fix scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             ViaBackport26.2-ClientSide/patch/apply_vbv_patch.py             ViaBackport26.2-ClientSide/patch/zipfile.py
          echo "VBV patch scripts compile successfully."

      - name: Verify native Netty source-fix logic
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NioIoHandler.newFactory()' ViaBackport26.2-ClientSide/patch/apply_vbv_patch.py
          grep -q 'EpollSocketChannel.class' ViaBackport26.2-ClientSide/patch/apply_vbv_patch.py
          grep -q 'KQueueSocketChannel.class' ViaBackport26.2-ClientSide/patch/apply_vbv_patch.py
          echo "Native Netty -> NIO fix logic is present."

      - name: Verify U1.1 patcher and portable kit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x u1-1-source/patcher/java-cli/eagler-patcher
          test -x u1-1-source/patcher/java-cli/eagler-patcher
          unzip -l U1-Patcher/portable-kit.zip | grep -q 'eagler-patcher'
          echo "U1.1 source patcher and U1 portable fallback are valid."

      - name: Verify resource overlay pin
        shell: bash
        run: |
          set -euo pipefail
          overlay="legacy-u1-kit/inputs/resource-overlay-normal.zip"
          if [ -f "$overlay" ]; then
            echo "Resource overlay already checked in."
          else
            echo "Resource overlay is resolved by the compile workflow from the pinned U1 inputs."
          fi
          echo "Fix/preflight checks passed."
