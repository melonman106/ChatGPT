name: Eaglercraft Visual Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eagler-visual-desktop
  cancel-in-progress: false

jobs:
  visual-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Check desktop and Discord profile secrets
        env:
          DESKTOP_PASSWORD: ${{ secrets.DESKTOP_PASSWORD }}
          DISCORD_PROFILE_PASSPHRASE: ${{ secrets.DISCORD_PROFILE_PASSPHRASE }}
        run: |
          if [ -z "$DESKTOP_PASSWORD" ] || [ "${#DESKTOP_PASSWORD}" -lt 12 ]; then
            echo "::error::Add DESKTOP_PASSWORD as a repository Actions secret with at least 12 characters."
            exit 1
          fi
          if [ -z "$DISCORD_PROFILE_PASSPHRASE" ] || [ "${#DISCORD_PROFILE_PASSPHRASE}" -lt 20 ]; then
            echo "::error::Add DISCORD_PROFILE_PASSPHRASE as a repository Actions secret with at least 20 characters."
            exit 1
          fi

      - name: Check out the patch source
        uses: actions/checkout@v4
        with:
          sparse-checkout: U1-Patcher
          sparse-checkout-cone-mode: true

      - name: Restore encrypted Discord profile
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/discord-profile.tar.gpg
          key: discord-profile-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            discord-profile-

      - name: Install desktop and web access dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openjdk-21-jre plasma-desktop plasma-workspace systemsettings kwin-x11 dolphin dolphin-plugins kio-extras konsole kate ark \
            breeze breeze-gtk-theme breeze-icon-theme oxygen-icon-theme hicolor-icon-theme kde-config-gtk-style kde-spectacle plasma-systemmonitor plasma-nm plasma-pa kscreen \
            xdg-utils desktop-file-utils shared-mime-info gvfs gvfs-backends policykit-1 polkit-kde-agent-1 \
            nginx apache2-utils dbus-x11 xauth fonts-dejavu-core curl zip python3 git ffmpeg xz-utils gnupg openssl \
            mesa-utils mesa-utils-extra libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers flatpak \
            kdesdk-thumbnailers filelight fonts-noto-color-emoji fonts-hack build-essential cmake ninja-build jq ripgrep tree \
            okular gwenview kcalc xclip htop unzip p7zip-full iproute2
          curl --fail --location --retry 3 "https://discord.com/api/download?platform=linux&format=deb" --output /tmp/discord.deb
          sudo apt-get install -y /tmp/discord.deb
          curl --fail --location --retry 3 \
            https://github.com/kasmtech/KasmVNC/releases/download/v1.5.0/kasmvncserver_noble_1.5.0_amd64.deb \
            --output /tmp/kasmvncserver.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/kasmvncserver.deb
          command -v vncserver
          command -v vncpasswd
          curl --fail --location --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            --output /tmp/cloudflared
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared

      - name: Restore Discord login profile
        env:
          DISCORD_PROFILE_PASSPHRASE: ${{ secrets.DISCORD_PROFILE_PASSPHRASE }}
        run: |
          set -euo pipefail
          PROFILE_ARCHIVE="${{ runner.temp }}/discord-profile.tar.gpg"
          if [ -f "$PROFILE_ARCHIVE" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$DISCORD_PROFILE_PASSPHRASE" \
              --decrypt "$PROFILE_ARCHIVE" | tar -xzf - -C "$HOME"
          fi

      - name: Prepare installer, upload inbox, and authenticated gateway
        env:
          DESKTOP_PASSWORD: ${{ secrets.DESKTOP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/eagler-visual-session/workspace" "$HOME/eagler-visual-session/inbox" "$HOME/.vnc" "$HOME/Desktop" "$HOME/.config"
          cat > "$HOME/.config/kwalletrc" <<'EOF'
          [Wallet]
          Enabled=false
          First Use=false
          Launch Manager=false
          EOF
          cat > "$HOME/.config/kscreenlockerrc" <<'EOF'
          [Daemon]
          Autolock=false
          LockOnResume=false
          LockOnStartup=false
          EOF
          cat > "$HOME/.config/powerdevilrc" <<'EOF'
          [AC][DPMSControl]
          idleTime=0
          [AC][SuspendAndShutdown]
          AutoSuspendAction=0
          EOF
          cd "$HOME/eagler-visual-session"
          curl --fail --location --retry 3 \
            https://github.com/melonman106/ChatGPT/releases/download/Modded/Eaglercraft-26.2-u1-Setup.jar \
            --output Eaglercraft-26.2-u1-Setup.jar
          printf '%s\n' "$DESKTOP_PASSWORD" | sudo htpasswd -i -c -B /etc/nginx/eagler.htpasswd eagler
          KIT_DIR="$HOME/eagler-visual-session/eaglercraft-26.2-patcher"
          java -jar "$HOME/eagler-visual-session/Eaglercraft-26.2-u1-Setup.jar" --install-dir "$KIT_DIR"
          test -x "$KIT_DIR/bootstrap/bootstrap-linux-x86_64.sh"
          test -x "$KIT_DIR/bootstrap/launch-gui-linux-x86_64.sh"
          "$KIT_DIR/bootstrap/bootstrap-linux-x86_64.sh" --app-dir "$KIT_DIR"
          test -f "$KIT_DIR/toolchain.properties"
          sudo chmod 640 /etc/nginx/eagler.htpasswd
          sudo chown root:www-data /etc/nginx/eagler.htpasswd

          cat > /tmp/eagler-upload-server.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import os, re
          DEST = Path.home() / "eagler-visual-session" / "inbox"
          MAX_UPLOAD = 1024 * 1024 * 1024
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  page = b"""<!doctype html><meta charset=utf-8><title>Eagler file upload</title><h2>Upload a file to the remote desktop</h2><form method=post enctype=multipart/form-data><input type=file name=file required><button>Upload</button></form>"""
                  self.send_response(200); self.send_header("Content-Type","text/html; charset=utf-8"); self.send_header("Content-Length",str(len(page))); self.end_headers(); self.wfile.write(page)
              def do_POST(self):
                  length = int(self.headers.get("Content-Length","0"))
                  if length <= 0 or length > MAX_UPLOAD:
                      self.send_error(413); return
                  body = self.rfile.read(length)
                  mime = BytesParser(policy=default).parsebytes(("Content-Type: "+self.headers.get("Content-Type","")+"\r\nMIME-Version: 1.0\r\n\r\n").encode()+body)
                  saved = []
                  for part in mime.iter_parts():
                      name = part.get_filename()
                      if not name: continue
                      safe = re.sub(r"[^A-Za-z0-9._-]+","_",os.path.basename(name))[:180] or "upload.bin"
                      (DEST / safe).write_bytes(part.get_payload(decode=True) or b"")
                      saved.append(safe)
                  msg = ("Uploaded: "+", ".join(saved) if saved else "No file selected").encode()
                  self.send_response(200); self.send_header("Content-Type","text/plain; charset=utf-8"); self.send_header("Content-Length",str(len(msg))); self.end_headers(); self.wfile.write(msg)
              def log_message(self, fmt, *args): pass
          HTTPServer(("127.0.0.1",8090), Handler).serve_forever()
          PY

          sudo tee /etc/nginx/sites-available/eagler-desktop >/dev/null <<'NGINX'
          server {
              listen 127.0.0.1:6081;
              server_name _;
              client_max_body_size 1024m;
              auth_basic "Eaglercraft private desktop";
              auth_basic_user_file /etc/nginx/eagler.htpasswd;
              location = /upload { proxy_pass http://127.0.0.1:8090/; }
              location = /upload/ { proxy_pass http://127.0.0.1:8090/; }
              location /upload-api/ { proxy_pass http://127.0.0.1:8090/; }
              location / {
                  proxy_pass https://10.200.0.2:8444/;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-Proto https;
                  proxy_ssl_verify off;
                  proxy_buffering off;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }
          }
          NGINX
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo ln -sf /etc/nginx/sites-available/eagler-desktop /etc/nginx/sites-enabled/eagler-desktop
          sudo nginx -t
          sudo systemctl restart nginx
          STATUS=""
          for i in $(seq 1 15); do
            STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:6081/ || true)
            if [ "$STATUS" = "401" ] || [ "$STATUS" = "200" ]; then break; fi
            sleep 2
          done
          if [ "$STATUS" != "401" ] && [ "$STATUS" != "200" ]; then exit 1; fi

          cat > "$HOME/eagler-visual-session/README-FIRST.txt" <<'EOF'
          Eaglercraft visual desktop
          Setup JAR: ~/eagler-visual-session/Eaglercraft-26.2-u1-Setup.jar
          Patch source: checked-out repository folder U1-Patcher
          Upload files at the authenticated desktop URL plus /upload.
          Uploaded files appear in ~/eagler-visual-session/inbox.
          Save output under ~/eagler-visual-session/workspace.
          Click Finish and Save Session to end the session.
          EOF

          cat > "$HOME/Desktop/Launch Eaglercraft Setup.desktop" <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Launch Eaglercraft Setup
          Exec=$HOME/eagler-visual-session/eaglercraft-26.2-patcher/bootstrap/launch-gui-linux-x86_64.sh --app-dir $HOME/eagler-visual-session/eaglercraft-26.2-patcher
          Terminal=false
          Categories=Development;
          EOF
          chmod +x "$HOME/Desktop/Launch Eaglercraft Setup.desktop"
          cat > "$HOME/Desktop/Discord.desktop" <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Discord
          Exec=discord
          Terminal=false
          Categories=Network;InstantMessaging;
          EOF
          chmod +x "$HOME/Desktop/Discord.desktop"
          cat > "$HOME/Desktop/Finish and Save Session.desktop" <<EOF
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Finish and Save Session
          Exec=bash -lc 'cd "$HOME/eagler-visual-session" && zip -qr eagler-session.zip workspace inbox && touch /tmp/eagler-finish'
          Terminal=true
          Categories=Development;
          EOF
          chmod +x "$HOME/Desktop/Finish and Save Session.desktop"

      - name: Start KasmVNC desktop and secure access tunnel
        env:
          DESKTOP_PASSWORD: ${{ secrets.DESKTOP_PASSWORD }}
        run: |
          set -euo pipefail
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8
          mkdir -p "$HOME/.vnc" "$HOME/.config" "$HOME/Desktop"
          sudo tee /etc/kasmvnc/kasmvnc.yaml >/dev/null <<'KASMVNC'
          desktop:
            resolution:
              width: 1280
              height: 720
            allow_resize: true
            pixel_depth: 24
          network:
            protocol: http
            interface: 10.200.0.2
            websocket_port: 8444
            use_ipv4: true
            use_ipv6: false
            udp:
              public_ip: 127.0.0.1
            ssl:
              require_ssl: true
          encoding:
            max_frame_rate: 30
            rect_encoding_mode:
              min_quality: 6
              max_quality: 8
              consider_lossless_quality: 9
              rectangle_compress_threads: auto
            video_encoding_mode:
              enter_video_encoding_mode:
                time_threshold: 2
                area_threshold: 35%
              exit_video_encoding_mode:
                time_threshold: 2
            video_streaming_mode:
              codec: auto
              quality: 17
              gop: 24
          command_line:
            prompt: false
          KASMVNC
          sudo install -d -m 0755 /etc/ssl/certs /etc/ssl/private
          if [ ! -s /etc/ssl/certs/ssl-cert-snakeoil.pem ] || [ ! -s /etc/ssl/private/ssl-cert-snakeoil.key ]; then
            sudo openssl req -x509 -nodes -newkey rsa:2048 -days 2 \
              -keyout /etc/ssl/private/ssl-cert-snakeoil.key \
              -out /etc/ssl/certs/ssl-cert-snakeoil.pem \
              -subj "/CN=localhost"
          fi
          sudo getent group ssl-cert >/dev/null || sudo groupadd --system ssl-cert
          sudo chown root:ssl-cert /etc/ssl/private/ssl-cert-snakeoil.key
          sudo chmod 640 /etc/ssl/private/ssl-cert-snakeoil.key
          sudo chmod 644 /etc/ssl/certs/ssl-cert-snakeoil.pem
          sudo usermod -aG ssl-cert "$USER"
          printf '%s\n%s\n' "$DESKTOP_PASSWORD" "$DESKTOP_PASSWORD" | vncpasswd -u eagler -w -r
          cat > "$HOME/.vnc/xstartup" <<'XSTART'
          #!/usr/bin/env bash
          set -e
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_CURRENT_DESKTOP=KDE
          export KDE_FULL_SESSION=true
          startplasma-x11 >/tmp/eagler-plasma.log 2>&1 &
          for i in $(seq 1 45); do
            if pgrep -u "$USER" -x plasmashell >/dev/null 2>&1; then break; fi
            sleep 2
          done
          if ! pgrep -u "$USER" -x plasmashell >/dev/null 2>&1; then cat /tmp/eagler-plasma.log; exit 1; fi
          qdbus6 org.kde.KWin /Compositor suspend >/dev/null 2>&1 || true
          WALLPAPER="$HOME/eagler-visual-session/Rimuru.jpg"
          WALLPAPER_URI="file://$WALLPAPER"
          cat > /tmp/eagler-set-wallpaper.js <<EOF
          var allDesktops = desktops();
          for (var i = 0; i < allDesktops.length; i++) {
              var d = allDesktops[i];
              d.wallpaperPlugin = "org.kde.image";
              d.currentConfigGroup = ["Wallpaper", "org.kde.image", "General"];
              d.writeConfig("Image", "$WALLPAPER_URI");
          }
          EOF
          gdbus call --session --dest org.kde.plasmashell --object-path /PlasmaShell \
            --method org.kde.PlasmaShell.evaluateScript "$(cat /tmp/eagler-set-wallpaper.js)" >/tmp/eagler-wallpaper-result.log 2>&1 || true
          wait
          XSTART
          chmod +x "$HOME/.vnc/xstartup"
          sudo ip netns del eagler-kasm >/dev/null 2>&1 || true
          sudo ip netns add eagler-kasm
          sudo ip link add eagler-kasm-host type veth peer name eagler-kasm-peer
          sudo ip link set eagler-kasm-peer netns eagler-kasm
          sudo ip addr add 10.200.0.1/24 dev eagler-kasm-host
          sudo ip link set eagler-kasm-host up
          sudo ip netns exec eagler-kasm ip link set lo up
          sudo ip netns exec eagler-kasm ip addr add 10.200.0.2/24 dev eagler-kasm-peer
          sudo ip netns exec eagler-kasm ip link set eagler-kasm-peer up
          rm -f /tmp/.X2-lock /tmp/.X11-unix/X2 "$HOME/.vnc/"*":2.pid" "$HOME/.vnc/"*":2.pid.lock"
          echo "Starting KasmVNC inside isolated network namespace eagler-kasm."
          sg ssl-cert -c 'ip netns exec eagler-kasm vncserver :2 -geometry 1280x720 -depth 24 -localhost no -rfbport -1 -websocketPort 8444 -httpd /usr/share/kasmvnc/www -sslOnly -interface 10.200.0.2 -select-de manual'
          for i in $(seq 1 45); do
            if curl --insecure --silent --output /dev/null https://10.200.0.2:8444/; then break; fi
            sleep 2
          done
          if ! curl --insecure --silent --output /dev/null https://10.200.0.2:8444/; then
            sudo ip netns exec eagler-kasm cat "$HOME"/.vnc/*.log 2>/dev/null || true
            ss -ltnp 2>/dev/null || true
            sudo ip netns exec eagler-kasm ss -ltnp 2>/dev/null || true
            echo "::error::KasmVNC did not start its browser client on port 8444."
            exit 1
          fi
          python3 /tmp/eagler-upload-server.py >/tmp/eagler-upload.log 2>&1 &
          echo $! >/tmp/eagler-upload.pid
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6081 >/tmp/eagler-cloudflared.log 2>&1 &
          echo $! >/tmp/eagler-cloudflared.pid
          URL=""
          for i in $(seq 1 90); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/eagler-cloudflared.log | head -n1 || true)
            if [ -n "$URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$URL" ]; then cat /tmp/eagler-cloudflared.log; exit 1; fi
          echo "::add-mask::$DESKTOP_PASSWORD"
          {
            echo "## Eaglercraft visual desktop (KasmVNC)"
            echo
            echo "**Desktop URL:** $URL/"
            echo
            echo "**Username:** eagler"
            echo
            echo "Use DESKTOP_PASSWORD at the gateway and KasmVNC login."
            echo
            echo "Upload a local client JAR at **$URL/upload**."
            echo
            echo "Save output under ~/eagler-visual-session/workspace; click Finish and Save Session to publish an artifact."
            echo
            echo "KasmVNC replaces x11vnc/noVNC. The temporary URL expires when the job ends."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "KasmVNC desktop: $URL/"
          echo "Upload URL: $URL/upload"
          echo "Username: eagler"
          echo "Password: use the DESKTOP_PASSWORD repository secret"

      - name: Keep desktop running until finished or timeout
        run: |
          for i in $(seq 1 1980); do
            if [ -f /tmp/eagler-finish ]; then
              echo "Finish signal received."
              exit 0
            fi
            sleep 10
          done
          echo "Desktop session reached its planned time limit; packaging current files."

      - name: Encrypt Discord profile for next session
        if: always()
        env:
          DISCORD_PROFILE_PASSPHRASE: ${{ secrets.DISCORD_PROFILE_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -n "$DISCORD_PROFILE_PASSPHRASE" ] && [ -d "$HOME/.config/discord" ]; then
            pkill -TERM -x Discord 2>/dev/null || true
            pkill -TERM -x discord 2>/dev/null || true
            sleep 3
            tar -czf - -C "$HOME" .config/discord |
              gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
                --passphrase "$DISCORD_PROFILE_PASSPHRASE" \
                --output "${{ runner.temp }}/discord-profile.tar.gpg"
          fi

      - name: Save encrypted Discord profile
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/discord-profile.tar.gpg
          key: discord-profile-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package session files
        if: always()
        run: |
          cd "$HOME/eagler-visual-session"
          zip -qr eagler-session.zip workspace inbox || true
          mkdir -p "$GITHUB_WORKSPACE/session-output"
          cp -f eagler-session.zip "$GITHUB_WORKSPACE/session-output/" 2>/dev/null || true
          cp -f README-FIRST.txt "$GITHUB_WORKSPACE/session-output/" 2>/dev/null || true
          cp -a workspace inbox "$GITHUB_WORKSPACE/session-output/" 2>/dev/null || true

      - name: Upload Eaglercraft session artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-visual-session
          path: session-output/
          if-no-files-found: warn
          retention-days: 7
