name: Extract embedded Eaglercraft WASM

on:
  workflow_dispatch:
    inputs:
      html_url:
        description: "Direct URL to the Eaglercraft single-HTML build"
        required: true
        default: "https://github.com/melonman106/ChatGPT/releases/download/1/eaglercraft-26.2-modded-2026-10-05-1523.html"
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download single-HTML client
        run: |
          set -euo pipefail
          mkdir -p work extracted
          curl -fL --retry 5 --retry-all-errors "${{ inputs.html_url }}" -o work/client.html
          test -s work/client.html
          ls -lh work/client.html

      - name: Extract embedded payloads
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import pathlib
          import re
          from html.parser import HTMLParser

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.current_id = None
                  self.parts = []
                  self.payloads = {}
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "script":
                      return
                  attrs = dict(attrs)
                  ident = attrs.get("id")
                  if ident and ident.startswith("eag-inline-"):
                      self.current_id = ident
                      self.parts = []
                  else:
                      self.current_id = None
              def handle_data(self, data):
                  if self.current_id:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current_id:
                      self.payloads[self.current_id] = "".join(self.parts)
                      self.current_id = None
                      self.parts = []

          src = pathlib.Path("work/client.html").read_text(encoding="utf-8")
          parser = ScriptParser()
          parser.feed(src)

          out = pathlib.Path("extracted")
          out.mkdir(exist_ok=True)

          names = {
              "eag-inline-decoder": "decoder.wasm",
              "eag-inline-wasm-br": "client.wasm.br",
              "eag-inline-mesh-wasm-br": "mesh.wasm.br",
              "eag-inline-server-wasm-br": "server.wasm.br",
              "eag-inline-assets": "assets.epk",
              "eag-inline-sounds": "sounds.epk",
          }

          found = 0
          for ident, fn in names.items():
              if ident not in parser.payloads:
                  print(f"WARNING: missing {ident}")
                  continue
              clean = re.sub(r"\s+", "", parser.payloads[ident])
              raw = base64.b64decode(clean, validate=True)
              (out / fn).write_bytes(raw)
              found += 1
              print(f"extracted {fn}: {len(raw):,} bytes")

          if found < 4:
              print("Available eag-inline scripts:", sorted(parser.payloads))
              raise SystemExit(f"Expected at least 4 embedded Eagler payloads, found {found}")
          PY

      - name: Decompress Brotli WASM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y brotli
          brotli -d -f extracted/client.wasm.br -o extracted/client.wasm
          brotli -d -f extracted/mesh.wasm.br -o extracted/mesh.wasm
          brotli -d -f extracted/server.wasm.br -o extracted/server.wasm
          file extracted/*.wasm
          ls -lh extracted

      - name: Map Litematica, MaLiLib and Mod Menu
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          wasm = pathlib.Path("extracted/client.wasm").read_bytes()
          strings = [
              s.decode("utf-8", "replace")
              for s in re.findall(rb"[ -~]{4,}", wasm)
          ]

          prefixes = {
              "Litematica": "fi.dy.masa.litematica",
              "MaLiLib": "fi.dy.masa.malilib",
              "Mod Menu": "com.terraformersmc.modmenu",
          }

          report = [
              "# Embedded Eaglercraft 26.2 client mod map",
              "",
              f"client.wasm size: {len(wasm):,} bytes",
              "",
          ]

          for name, prefix in prefixes.items():
              vals = sorted({s for s in strings if prefix in s})
              report += [f"## {name}", "", f"Recovered strings/types: {len(vals)}", ""]
              report += [f"- {v}" for v in vals]
              report.append("")

          needles = (
              "Litematica", "litematica", "MaLiLib", "malilib",
              "Mod Menu", "modmenu", "fabric.mod.json",
              "onInitializeClient", "ModMenuApi"
          )
          vals = sorted({s for s in strings if any(n in s for n in needles)})
          report += ["## Relevant metadata/runtime strings", ""]
          report += [f"- {v}" for v in vals]

          pathlib.Path("extracted/mod-map.md").write_text("\n".join(report), encoding="utf-8")
          PY

      - name: Write checksums and archive
        run: |
          set -euo pipefail
          sha256sum extracted/* > extracted/SHA256SUMS.txt
          tar -czf eaglercraft-wasm-extracted.tar.gz extracted
          ls -lh eaglercraft-wasm-extracted.tar.gz

      - name: Upload extracted WASM and map
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-wasm-extracted
          path: |
            extracted/client.wasm
            extracted/client.wasm.br
            extracted/mesh.wasm
            extracted/mesh.wasm.br
            extracted/server.wasm
            extracted/server.wasm.br
            extracted/decoder.wasm
            extracted/assets.epk
            extracted/sounds.epk
            extracted/mod-map.md
            extracted/SHA256SUMS.txt
            eaglercraft-wasm-extracted.tar.gz
          compression-level: 0
          retention-days: 14
