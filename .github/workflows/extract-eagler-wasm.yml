name: Extract embedded Eaglercraft WASM

on:
  workflow_dispatch:
    inputs:
      html_url:
        description: "Direct URL to the Eaglercraft single-HTML build"
        required: true
        default: "https://github.com/melonman106/ChatGPT/releases/download/1/eaglercraft-26.2-modded-2026-10-05-1523.html"
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download single-HTML client
        run: |
          set -euo pipefail
          mkdir -p work extracted
          curl -fL --retry 5 --retry-all-errors "${{ inputs.html_url }}" -o work/client.html
          test -s work/client.html
          ls -lh work/client.html

      - name: Extract embedded payloads
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import pathlib
          import re
          from html.parser import HTMLParser

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.current_id = None
                  self.parts = []
                  self.payloads = {}
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "script":
                      return
                  attrs = dict(attrs)
                  ident = attrs.get("id")
                  if ident and ident.startswith("eag-inline-"):
                      self.current_id = ident
                      self.parts = []
                  else:
                      self.current_id = None
              def handle_data(self, data):
                  if self.current_id:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current_id:
                      self.payloads[self.current_id] = "".join(self.parts)
                      self.current_id = None
                      self.parts = []

          src = pathlib.Path("work/client.html").read_text(encoding="utf-8")
          parser = ScriptParser()
          parser.feed(src)

          out = pathlib.Path("extracted")
          out.mkdir(exist_ok=True)

          names = {
              "eag-inline-decoder": "decoder.wasm",
              "eag-inline-wasm-br": "client.wasm.br",
              "eag-inline-mesh-wasm-br": "mesh.wasm.br",
              "eag-inline-server-wasm-br": "server.wasm.br",
              "eag-inline-assets": "assets.epk",
              "eag-inline-sounds": "sounds.epk",
          }

          found = 0
          for ident, fn in names.items():
              if ident not in parser.payloads:
                  print(f"WARNING: missing {ident}")
                  continue
              clean = re.sub(r"\s+", "", parser.payloads[ident])
              raw = base64.b64decode(clean, validate=True)
              (out / fn).write_bytes(raw)
              found += 1
              print(f"extracted {fn}: {len(raw):,} bytes")

          if found < 4:
              print("Available eag-inline scripts:", sorted(parser.payloads))
              raise SystemExit(f"Expected at least 4 embedded Eagler payloads, found {found}")
          PY

      - name: Decompress Brotli WASM
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y brotli
          brotli -d -f extracted/client.wasm.br -o extracted/client.wasm
          brotli -d -f extracted/mesh.wasm.br -o extracted/mesh.wasm
          brotli -d -f extracted/server.wasm.br -o extracted/server.wasm
          file extracted/*.wasm
          ls -lh extracted

      - name: Run WABT WebAssembly reverse-engineering tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wabt
          mkdir -p extracted/wabt
          wabt_version="$(wasm2wat --version 2>&1 || true)"
          printf '%s\\n' "$wabt_version" | tee extracted/wabt/VERSION.txt

          for tool in wasm-objdump wasm-stats wasm-validate wasm2wat wasm-decompile wasm2c; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "=== $tool ===" | tee "extracted/wabt/$tool.txt"
              "$tool" --version 2>&1 | tee -a "extracted/wabt/$tool.txt" || true
            fi
          done

          # Structural inspection should survive even if full validation fails.
          wasm-objdump -h -x extracted/client.wasm > extracted/wabt/client-objdump.txt 2>&1 || true
          wasm-stats extracted/client.wasm > extracted/wabt/client-stats.txt 2>&1 || true
          wasm-validate extracted/client.wasm > extracted/wabt/client-validate.txt 2>&1 || true

          # Try the full feature set. Keep every result, including parser failures,
          # because the failing byte offset is useful to the custom TeaVM parser.
          wasm2wat --enable-all extracted/client.wasm -o extracted/wabt/client.wat > extracted/wabt/wasm2wat.log 2>&1 || true
          wasm-decompile --enable-all extracted/client.wasm -o extracted/wabt/client.dcmp > extracted/wabt/wasm-decompile.log 2>&1 || true
          wasm2c --enable-all extracted/client.wasm -o extracted/wabt/client.c > extracted/wabt/wasm2c.log 2>&1 || true

          # Repeat without custom-section processing where supported by this WABT build.
          wasm2wat --enable-all --ignore-custom-section-errors extracted/client.wasm \
            -o extracted/wabt/client-ignore-custom.wat > extracted/wabt/wasm2wat-ignore-custom.log 2>&1 || true

          find extracted/wabt -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort

      - name: Map Litematica, MaLiLib and Mod Menu
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          wasm = pathlib.Path("extracted/client.wasm").read_bytes()
          strings = [
              s.decode("utf-8", "replace")
              for s in re.findall(rb"[ -~]{4,}", wasm)
          ]

          prefixes = {
              "Litematica": "fi.dy.masa.litematica",
              "MaLiLib": "fi.dy.masa.malilib",
              "Mod Menu": "com.terraformersmc.modmenu",
          }

          report = [
              "# Embedded Eaglercraft 26.2 client mod map",
              "",
              f"client.wasm size: {len(wasm):,} bytes",
              "",
          ]

          for name, prefix in prefixes.items():
              vals = sorted({s for s in strings if prefix in s})
              report += [f"## {name}", "", f"Recovered strings/types: {len(vals)}", ""]
              report += [f"- {v}" for v in vals]
              report.append("")

          needles = (
              "Litematica", "litematica", "MaLiLib", "malilib",
              "Mod Menu", "modmenu", "fabric.mod.json",
              "onInitializeClient", "ModMenuApi"
          )
          vals = sorted({s for s in strings if any(n in s for n in needles)})
          report += ["## Relevant metadata/runtime strings", ""]
          report += [f"- {v}" for v in vals]

          pathlib.Path("extracted/mod-map.md").write_text("\n".join(report), encoding="utf-8")
          PY

      - name: Copy extracted WASM to repository
        run: |
          set -euo pipefail
          rm -rf Eaglercraft-26.2-u1-ExtractedWASM
          cp -a extracted Eaglercraft-26.2-u1-ExtractedWASM
          find Eaglercraft-26.2-u1-ExtractedWASM -type f | sort > Eaglercraft-26.2-u1-ExtractedWASM/FILE-LIST.txt
          printf 'Extracted from: %s\n' "${{ inputs.html_url }}" > Eaglercraft-26.2-u1-ExtractedWASM/EXTRACTION-INFO.txt
          printf 'Extracted at: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> Eaglercraft-26.2-u1-ExtractedWASM/EXTRACTION-INFO.txt
      - name: Write checksums and archive
        run: |
          set -euo pipefail
          find extracted -type f -print0 | sort -z | xargs -0 sha256sum > extracted/SHA256SUMS.txt
          tar -czf eaglercraft-wasm-extracted.tar.gz extracted
          ls -lh eaglercraft-wasm-extracted.tar.gz

      - name: Commit extracted WASM to repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Eaglercraft-26.2-u1-ExtractedWASM
          if git diff --cached --quiet; then
            echo "No extracted WASM changes to commit."
          else
            git commit -m "Update Eaglercraft 26.2 extracted WASM"
            git push
          fi

      - name: Upload extracted WASM and map
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-wasm-extracted
          path: |
            extracted/client.wasm
            extracted/client.wasm.br
            extracted/mesh.wasm
            extracted/mesh.wasm.br
            extracted/server.wasm
            extracted/server.wasm.br
            extracted/decoder.wasm
            extracted/assets.epk
            extracted/sounds.epk
            extracted/mod-map.md
            extracted/wabt/**
            extracted/SHA256SUMS.txt
            eaglercraft-wasm-extracted.tar.gz
          compression-level: 0
          retention-days: 14
