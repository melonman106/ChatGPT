name: Inspect Enchantment Outlines Pack

on:
  workflow_dispatch:
  push:
    paths:
      - "Enchantment Outlines.zip"
      - ".github/workflows/inspect-enchantment-outlines.yml"
      - "porting/README.md"

permissions:
  contents: read

jobs:
  inspect-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect the relevant 26.x implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, zipfile
          p = pathlib.Path("Enchantment Outlines.zip")
          with zipfile.ZipFile(p) as z:
              entries = [x for x in z.infolist() if not x.is_dir() and not x.filename.startswith("__MACOSX/")]
              print(f"ZIP bytes={p.stat().st_size}; entries={len(entries)}")
              print("\n=== RELEVANT PATHS ===")
              for x in entries:
                  n=x.filename.lower()
                  if (n.startswith("26-3/") or n.startswith("26-1/") or
                      n in ("pack.mcmeta",) or
                      ("/shaders/" in n and n.endswith((".vsh",".fsh",".json"))) or
                      ("assets/minecraft/items/" in n and n.endswith(".json"))):
                      print(f"{x.file_size:>7} {x.filename}")
              wanted = [
                  "pack.mcmeta",
                  "26-3/assets/minecraft/shaders/core/item.vsh",
                  "26-3/assets/minecraft/shaders/core/item.fsh",
                  "26-1/assets/minecraft/shaders/core/item.vsh",
                  "26-1/assets/minecraft/shaders/core/item.fsh",
                  "assets/minecraft/shaders/core/rendertype_entity_translucent_cull.vsh",
                  "assets/minecraft/shaders/core/rendertype_entity_translucent_cull.fsh",
              ]
              print("\n=== PACK METADATA AND SHADER SOURCES ===")
              for name in wanted:
                  try:
                      data=z.read(name)
                  except KeyError:
                      print(f"\n--- {name}: NOT PRESENT ---")
                      continue
                  print(f"\n--- {name} ({len(data)} bytes) ---")
                  print(data.decode("utf-8","replace"))
              print("\n=== ITEM DEFINITION EXAMPLES ===")
              for name in ("assets/minecraft/items/enchanted_book.json",
                           "assets/minecraft/items/enchanted_golden_apple.json"):
                  try: data=z.read(name)
                  except KeyError: continue
                  print(f"\n--- {name} ---")
                  print(data.decode("utf-8","replace"))
          PY
