name: Build Eaglercraft 26.2 u1 VBV Client

on:
  push:
    paths:
      - "ViaBackport26.2-ClientSide/**"
      - "eaglercraft-26.2-patcher-main.tar.gz"
      - ".github/workflows/build-eagler-vbv-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download pinned Eaglercraft 26.2 u1 Setup
        run: |
          set -euo pipefail
          mkdir -p build-input
          curl -fL --retry 3 \
            -o build-input/Eaglercraft-26.2-u1-Setup.jar \
            "https://github.com/melonman106/ChatGPT/releases/download/Modded/Eaglercraft-26.2-u1-Setup.jar"

          echo "57bfcacdf24310d48f462a9a508fe2a59acad8487a8de34bb40963c46183c1bd  build-input/Eaglercraft-26.2-u1-Setup.jar" \
            | sha256sum -c -

      - name: Install complete Eaglercraft patcher kit
        run: |
          set -euo pipefail
          rm -rf Eaglercraft-26.2-u1
          java -jar build-input/Eaglercraft-26.2-u1-Setup.jar \
            --install-dir Eaglercraft-26.2-u1

          test -f Eaglercraft-26.2-u1/patcher/java-cli/eagler-patcher
          test -f Eaglercraft-26.2-u1/patcher/java-cli/eaglercraft-26.2-java-cli.jar

      - name: Download official Minecraft 26.2 client
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o build-input/minecraft-26.2-client.jar \
            "https://piston-data.mojang.com/v1/objects/2dc72797acbc1b63fc16a11c4ac393605f453754/client.jar"

          echo "2dc72797acbc1b63fc16a11c4ac393605f453754  build-input/minecraft-26.2-client.jar" \
            | sha1sum -c -

      - name: Inspect patcher CLI
        run: |
          set -euo pipefail
          cd Eaglercraft-26.2-u1/patcher/java-cli
          chmod +x ./eagler-patcher
          ./eagler-patcher --help 2>&1 || true
          ./eagler-patcher create-dev --help 2>&1 || true

      - name: Create editable Eaglercraft source project
        run: |
          set -euo pipefail
          cd Eaglercraft-26.2-u1/patcher/java-cli

          chmod +x ./eagler-patcher

          # The complete Setup kit contains the pinned Java CLI and all required
          # Eaglercraft inputs. The source-only tarball does not, which is why
          # the previous workflow could never create a project.
          #
          # Try the CLI forms used by patcher builds across revisions. Every
          # attempt gets a fresh output directory and is accepted only when it
          # actually produces a Gradle source tree.
          rm -rf "$GITHUB_WORKSPACE/generated-client"

          attempts=(
            "create-dev --minecraft-jar $GITHUB_WORKSPACE/build-input/minecraft-26.2-client.jar --output $GITHUB_WORKSPACE/generated-client"
            "create-dev --client-jar $GITHUB_WORKSPACE/build-input/minecraft-26.2-client.jar --output $GITHUB_WORKSPACE/generated-client"
            "create-dev --input $GITHUB_WORKSPACE/build-input/minecraft-26.2-client.jar --output $GITHUB_WORKSPACE/generated-client"
            "create-dev $GITHUB_WORKSPACE/build-input/minecraft-26.2-client.jar $GITHUB_WORKSPACE/generated-client"
            "create-dev $GITHUB_WORKSPACE/build-input/minecraft-26.2-client.jar --output $GITHUB_WORKSPACE/generated-client"
          )

          for command in "${attempts[@]}"; do
            echo "=== Trying: ./eagler-patcher $command ==="
            rm -rf "$GITHUB_WORKSPACE/generated-client"
            set +e
            ./eagler-patcher $command
            status=$?
            set -e

            if [ "$status" -eq 0 ] && find "$GITHUB_WORKSPACE/generated-client" -type f \
                \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) \
                -print -quit | grep -q .; then
              echo "Eaglercraft source project created successfully."
              exit 0
            fi
          done

          echo "::error::create-dev did not produce a Gradle source project."
          echo "::error::The exact CLI usage is printed by the Inspect patcher CLI step."
          exit 1

      - name: Apply native VBV patch
        run: |
          set -euo pipefail
          python3 ViaBackport26.2-ClientSide/patch/apply_vbv_patch.py generated-client

      - name: Setup Java 25 for Eaglercraft build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Build generated Eaglercraft client
        run: |
          set -euo pipefail
          build_root=$(find generated-client -type f \
            \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) \
            -print -quit | xargs -r dirname)

          if [ -z "$build_root" ]; then
            echo "::error::No generated Gradle client exists after create-dev."
            exit 1
          fi

          cd "$build_root"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload patched client source and build
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackport26.2-ClientSide
          path: |
            generated-client
