name: Build Eaglercraft 26.2 u1 VBV Client

on:
  push:
    paths:
      - "ViaBackport26.2-ClientSide/**"
      - "eaglercraft-26.2-patcher-main.tar.gz"
      - ".github/workflows/build-eagler-vbv-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download and extract U1 portable-kit.zip
        run: |
          set -euo pipefail
          mkdir -p build-input/u1-portable-kit
          curl -fL --retry 3 -o build-input/portable-kit.zip "https://github.com/melonman106/ChatGPT/releases/download/Cleit/portable-kit.zip"
          expected="974c88e396dabebced363aa30bc518e159b0a06d4f430dde8a06525154328d19"
          actual="$(sha256sum build-input/portable-kit.zip | awk '{print $1}')"
          echo "Expected SHA-256: $expected"
          echo "Actual SHA-256:   $actual"
          test "$actual" = "$expected"
          unzip -q build-input/portable-kit.zip -d build-input/u1-portable-kit
          echo "=== Extracted U1 portable kit ==="
          find build-input/u1-portable-kit -type f -print | sort
          patcher="$(find build-input/u1-portable-kit -type f -name 'eagler-patcher' -print -quit || true)"
          cli_jar="$(find build-input/u1-portable-kit -type f -name 'eaglercraft-26.2-java-cli.jar' -print -quit || true)"
          if [ -z "$patcher" ]; then
            echo "::error::portable-kit.zip does not contain eagler-patcher."
            exit 1
          fi
          if [ -z "$cli_jar" ]; then
            echo "::error::portable-kit.zip does not contain eaglercraft-26.2-java-cli.jar."
            exit 1
          fi
          patcher="$(realpath "$patcher")"
          cli_jar="$(realpath "$cli_jar")"
          patcher_root="$(dirname "$patcher")"
          chmod +x "$patcher"
          echo "EAGLER_PATCHER_ROOT=$patcher_root" >> "$GITHUB_ENV"
          echo "EAGLER_PATCHER=$patcher" >> "$GITHUB_ENV"
          echo "EAGLER_JAVA_CLI=$cli_jar" >> "$GITHUB_ENV"
          echo "Using portable-kit patcher:"
          echo "  root=$patcher_root"
          echo "  patcher=$patcher"
          echo "  java-cli=$cli_jar"

      - name: Download official Minecraft 26.2 client
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o build-input/minecraft-26.2-client.jar "https://piston-data.mojang.com/v1/objects/2dc72797acbc1b63fc16a11c4ac393605f453754/client.jar"
          echo "2dc72797acbc1b63fc16a11c4ac393605f453754  build-input/minecraft-26.2-client.jar" | sha1sum -c -

      - name: Inspect extracted U1 patcher
        run: |
          set -euo pipefail
          echo "=== Portable kit root ==="
          find "$EAGLER_PATCHER_ROOT" -maxdepth 3 -type f | sort
          echo "=== Patcher help ==="
          "$EAGLER_PATCHER" --help 2>&1 || true
          echo "=== create-dev help ==="
          "$EAGLER_PATCHER" create-dev --help 2>&1 || true

      - name: Create editable Eaglercraft source project
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/generated-client"
          cd "$EAGLER_PATCHER_ROOT"
          chmod +x "$EAGLER_PATCHER"
          "$EAGLER_PATCHER" create-dev             --jar "$GITHUB_WORKSPACE/build-input/minecraft-26.2-client.jar"             --output "$GITHUB_WORKSPACE/generated-client"             --vineflower "$EAGLER_PATCHER_ROOT/inputs/vineflower-1.12.0.jar"             --java17 "$JAVA_HOME/bin/java"             --patch-bundle "$EAGLER_PATCHER_ROOT/source-patch-bundle.zip"             --expected-bundle-sha256 fd944e9cabbebbf4bddce8a39e1b233b3c7d0cd4f860f9cae37550a3fcfa8b02             --project-skeleton "$EAGLER_PATCHER_ROOT/project-skeleton-v5-teavm-runtime-verified.zip"             --expected-skeleton-sha256 3656a83ed8187e2d859612c566f3aa73e242bf1e4633990c5bb4929e0a846c94
          if ! find "$GITHUB_WORKSPACE/generated-client" -type f \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit | grep -q .; then
            echo "::error::create-dev completed but did not produce a Gradle source project."
            find "$GITHUB_WORKSPACE/generated-client" -maxdepth 5 -type f | sort | head -1000
            exit 1
          fi

      - name: Apply native VBV patch
        run: |
          set -euo pipefail
          python3 ViaBackport26.2-ClientSide/patch/apply_vbv_patch.py generated-client

      - name: Restore Minecraft runtime resources
        run: |
          set -euo pipefail
          game_dir="$(find generated-client -type f \( -path "*/game/build.gradle" -o -path "*/game/build.gradle.kts" \) -print -quit | xargs -r dirname)"
          if [ -z "$game_dir" ]; then
            echo "::error::Could not locate the generated game module."
            exit 1
          fi
          resources="$game_dir/src/main/resources"
          # Preserve Eagler-specific skeleton resources (especially pack.png).
          # Only overlay the official Minecraft runtime resources below.
          mkdir -p "$resources"
          temp_resources="$(mktemp -d)"
          trap 'rm -rf "$temp_resources"' EXIT
          unzip -q build-input/minecraft-26.2-client.jar -d "$temp_resources"
          for path in version.json assets; do
            if [ ! -e "$temp_resources/$path" ]; then
              echo "::error::Official client JAR is missing required runtime resource: $path"
              exit 1
            fi
          done
          if [ -e "$temp_resources/pack.mcmeta" ]; then
            echo "Official client JAR contains pack.mcmeta."
          else
            echo "Official client JAR has no pack.mcmeta; creating a minimal 26.2 header."
            printf '%s\n' '{' '  "pack": {' '    "description": "Minecraft 26.2",' '    "min_format": 88,' '    "max_format": 88' '  }' '}' > "$temp_resources/pack.mcmeta"
          fi
          echo "=== Restoring runtime resources ==="
          cp -a "$temp_resources/version.json" "$resources/"
          cp -a "$temp_resources/pack.mcmeta" "$resources/"
          cp -a "$temp_resources/assets" "$resources/"
          if [ -e "$temp_resources/data" ]; then
            cp -a "$temp_resources/data" "$resources/"
          else
            echo "Official client JAR has no data/ directory; skipping it."
          fi
          echo "=== Restored runtime resources ==="
          printf 'game module: %s\nresources: %s\n' "$game_dir" "$resources"
          test -f "$resources/version.json"
          test -f "$resources/pack.mcmeta"
          test -f "$resources/assets/minecraft/lang/en_us.json"
          test -f "$resources/pack.png"
          echo "Preserved Eagler skeleton pack.png:"
          ls -lh "$resources/pack.png"
          du -sh "$resources"
          find "$resources" -type f | wc -l

      - name: Setup Java 25 for Eaglercraft build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Build generated Eaglercraft client
        run: |
          set -euo pipefail
          build_root="$(find generated-client -type f -name 'gradlew' -print -quit | xargs -r dirname)"
          if [ -z "$build_root" ]; then
            echo "::error::No generated Gradle client root (gradlew) exists after create-dev."
            find generated-client -maxdepth 4 -type f \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print | sort
            exit 1
          fi
          cd "$build_root"
          chmod +x ./gradlew
          ./gradlew assemble --no-daemon

      - name: Inject Minecraft runtime resources into game JAR
        run: |
          set -euo pipefail
          build_root="$(find generated-client -type f -name 'gradlew' -print -quit | xargs -r dirname)"
          if [ -z "$build_root" ]; then
            echo "::error::Could not locate the generated Eaglercraft build root (gradlew)."
            exit 1
          fi
          game_libs="$build_root/game/build/libs"
          if [ ! -d "$game_libs" ]; then
            echo "::error::Game build output directory does not exist: $game_libs"
            find "$build_root" -maxdepth 5 -type d -path '*/game/build/*' -print | sort || true
            exit 1
          fi
          game_jar="$(find "$game_libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          if [ -z "$game_jar" ]; then
            echo "::error::Could not locate the assembled game JAR in: $game_libs"
            find "$game_libs" -maxdepth 1 -type f -print | sort || true
            exit 1
          fi
          temp_resources="$(mktemp -d)"
          trap 'rm -rf "$temp_resources"' EXIT
          unzip -q build-input/minecraft-26.2-client.jar -d "$temp_resources"

          for path in version.json assets; do
            if [ ! -e "$temp_resources/$path" ]; then
              echo "::error::Official client JAR is missing required runtime resource: $path"
              exit 1
            fi
          done
          if [ -e "$temp_resources/pack.mcmeta" ]; then
            echo "Official client JAR contains pack.mcmeta."
          else
            echo "Official client JAR has no pack.mcmeta; recreating the same minimal 26.2 header used for game resources."
            printf '%s\n' '{' '  "pack": {' '    "description": "Minecraft 26.2",' '    "min_format": 88,' '    "max_format": 88' '  }' '}' > "$temp_resources/pack.mcmeta"
          fi

          echo "Injecting runtime resources into: $game_jar"
          jar --update --file "$game_jar"             -C "$temp_resources" version.json             -C "$temp_resources" pack.mcmeta             -C "$temp_resources" assets
          if [ -e "$temp_resources/data" ]; then
            echo "Injecting official 26.2 data/ directory too."
            jar --update --file "$game_jar" -C "$temp_resources" data
          else
            echo "No data/ directory in client JAR; skipping it."
          fi

          echo "=== Required resources in game.jar ==="
          jar_contents="$temp_resources/game-jar-contents.txt"
          jar --list --file "$game_jar" > "$jar_contents"
          grep -E '^(version.json|pack.mcmeta|assets/minecraft/lang/en_us.json|assets/)' "$jar_contents" | head -30 || true
          grep -qx 'version.json' "$jar_contents"
          grep -qx 'pack.mcmeta' "$jar_contents"
          grep -qx 'assets/minecraft/lang/en_us.json' "$jar_contents"
          echo "=== game.jar size ==="
          ls -lh "$game_jar"

      - name: Setup Node.js for single-HTML packaging
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare ModdedClientSource
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/ModdedClientSource"

          build_root="$(find "$GITHUB_WORKSPACE/generated-client" -type f -name 'gradlew' -print -quit | xargs -r dirname)"
          if [ -z "$build_root" ]; then
            echo "::error::Could not locate the generated Eaglercraft Gradle root."
            find "$GITHUB_WORKSPACE/generated-client" -maxdepth 6 -type f \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print | sort || true
            exit 1
          fi
          build_root="$(realpath "$build_root")"

          mkdir -p "$GITHUB_WORKSPACE/ModdedClientSource"
          cp -a "$build_root"/. "$GITHUB_WORKSPACE/ModdedClientSource/"

          modded_root="$GITHUB_WORKSPACE/ModdedClientSource"
          game_dir="$(find "$modded_root" -type f \( -path "*/game/build.gradle" -o -path "*/game/build.gradle.kts" \) -print -quit | xargs -r dirname)"
          if [ -z "$game_dir" ]; then
            echo "::error::Could not locate the copied Gradle game module."
            find "$modded_root" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print | sort | head -300
            exit 1
          fi
          game_dir="$(realpath "$game_dir")"
          resources="$game_dir/src/main/resources"

          echo "=== Generated client paths ==="
          echo "Gradle root: $build_root"
          echo "Copied root: $modded_root"
          echo "Game module: $game_dir"
          echo "Resources:   $resources"

          # Preserve Eagler-specific skeleton resources, especially pack.png.
          # Only overlay the official Minecraft runtime resources.
          mkdir -p "$resources"

          temp_resources="$(mktemp -d)"
          trap 'rm -rf "$temp_resources"' EXIT
          unzip -q "$GITHUB_WORKSPACE/build-input/minecraft-26.2-client.jar" -d "$temp_resources"

          test -f "$temp_resources/version.json"
          test -f "$temp_resources/assets/minecraft/lang/en_us.json"

          if [ -e "$temp_resources/pack.mcmeta" ]; then
            cp -a "$temp_resources/pack.mcmeta" "$resources/"
          else
            printf '%s\n' '{' '  "pack": {' '    "description": "Minecraft 26.2",' '    "min_format": 88,' '    "max_format": 88' '  }' '}' > "$resources/pack.mcmeta"
          fi

          cp -a "$temp_resources/version.json" "$resources/"
          cp -a "$temp_resources/assets" "$resources/"
          if [ -e "$temp_resources/data" ]; then
            cp -a "$temp_resources/data" "$resources/"
          fi

          test -f "$resources/version.json"
          test -f "$resources/pack.mcmeta"
          test -f "$resources/assets/minecraft/lang/en_us.json"
          test -f "$resources/pack.png"

          game_classes="$game_dir/build/classes/java/main"
          mkdir -p "$game_classes"
          cp -a "$resources"/. "$game_classes"/

          test -f "$game_classes/version.json"
          test -f "$game_classes/pack.mcmeta"
          test -f "$game_classes/assets/minecraft/lang/en_us.json"
          test -f "$game_classes/pack.png"

          echo "=== TeaVM resource classpath verified ==="
          ls -lh "$game_classes/version.json" "$game_classes/pack.png"

          single_html_script="$modded_root/wasm-toolchain/build-single-html.js"
          if [ ! -f "$single_html_script" ]; then
            echo "::error::The generated client does not contain wasm-toolchain/build-single-html.js."
            find "$modded_root" -path '*/wasm-toolchain/*' -type f -print | sort || true
            exit 1
          fi

          echo "Found single-HTML builder: $single_html_script"
          node --version

      # This is the expensive-build checkpoint. If the packaging job fails,
      # GitHub can rerun only that failed job instead of rebuilding TeaVM.
      - name: Upload packaging checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: vbv-single-html-input
          path: ModdedClientSource
          retention-days: 7
          compression-level: 1
          if-no-files-found: error

  package:
    name: Package single-file HTML
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download packaging checkpoint
        uses: actions/download-artifact@v5
        with:
          name: vbv-single-html-input
          path: .

      - name: Verify packaging checkpoint
        run: |
          set -euo pipefail
          test -f ModdedClientSource/wasm-toolchain/build-single-html.js
          test -f ModdedClientSource/game/src/main/resources/pack.png
          test -f ModdedClientSource/game/build/classes/java/main/pack.png
          echo "Packaging checkpoint restored successfully."
          du -sh ModdedClientSource

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build single-file HTML client
        working-directory: ModdedClientSource
        run: |
          set -euo pipefail
          echo "=== Running single-HTML builder ==="
          node wasm-toolchain/build-single-html.js
          echo "=== Generated HTML files ==="
          find . -type f -name '*.html' -printf '%s %p\n' | sort -nr | head -50
          html_count="$(find . -type f -name '*.html' | wc -l)"
          if [ "$html_count" -eq 0 ]; then
            echo "::error::build-single-html.js completed but produced no HTML file."
            exit 1
          fi

      - name: Select final single HTML
        run: |
          set -euo pipefail
          mkdir -p final-client
          candidate="$(find ModdedClientSource -type f -name '*.html' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -z "$candidate" ]; then
            echo "::error::No HTML output was found."
            exit 1
          fi
          cp "$candidate" final-client/Eaglercraft-26.2-VBV-Modded.html
          echo "Final single HTML:"
          ls -lh final-client/Eaglercraft-26.2-VBV-Modded.html

      - name: Upload final client
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackport26.2-ClientSide
          path: final-client
          retention-days: 7
          if-no-files-found: error
