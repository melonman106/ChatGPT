name: Build Eaglercraft 26.2 u1 VBV Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Java 17 and Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download pinned u1 Setup JAR
        run: |
          set -euo pipefail
          mkdir -p build-input
          curl -fL --retry 3 \
            "https://github.com/melonman106/ChatGPT/releases/download/Modded/Eaglercraft-26.2-u1-Setup.jar" \
            -o build-input/Eaglercraft-26.2-u1-Setup.jar

          expected="57bfcacdf24310d48f462a9a508fe2a59acad8487a8de34bb40963c46183c1bd"
          actual="$(sha256sum build-input/Eaglercraft-26.2-u1-Setup.jar | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Prepare u1 patcher
        run: |
          set -euo pipefail

          rm -rf U1-Patcher
          mkdir -p U1-Patcher
          unzip -q build-input/Eaglercraft-26.2-u1-Setup.jar -d U1-Patcher

          echo "=== U1-Patcher files ==="
          find U1-Patcher -type f | sort | head -500

          echo "=== Candidate patcher JARs ==="
          find U1-Patcher -type f -name '*.jar' -print | sort

      - name: Try generating the editable 26.2 u1 client source
        shell: bash
        run: |
          set -euo pipefail

          SETUP_JAR="$PWD/build-input/Eaglercraft-26.2-u1-Setup.jar"
          OUT="$PWD/Eaglercraft-26.2-u1"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          echo "Trying the documented create-dev operation..."

          set +e
          java -jar "$SETUP_JAR" create-dev "$OUT" 2>&1 | tee create-dev.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo ""
            echo "create-dev did not accept this invocation."
            echo "Setup JAR help follows:"
            java -jar "$SETUP_JAR" --help 2>&1 || true
            echo ""
            echo "create-dev help follows:"
            java -jar "$SETUP_JAR" create-dev --help 2>&1 || true
            exit "$status"
          fi

          echo "=== Generated project ==="
          find "$OUT" -maxdepth 4 -type f | sort | head -500

      - name: Try compiling the generated client
        run: |
          set -euo pipefail

          if [ ! -d Eaglercraft-26.2-u1 ]; then
            echo "::error::No generated Eaglercraft-26.2-u1 project exists."
            exit 1
          fi

          if [ -f Eaglercraft-26.2-u1/gradlew ]; then
            cd Eaglercraft-26.2-u1
            chmod +x gradlew
            ./gradlew build --no-daemon
          elif [ -f Eaglercraft-26.2-u1/build.gradle ]; then
            cd Eaglercraft-26.2-u1
            gradle build --no-daemon
          else
            echo "::error::Generated project does not contain a Gradle build yet."
            find Eaglercraft-26.2-u1 -maxdepth 3 -type f | sort
            exit 1
          fi

      - name: Commit generated client source
        run: |
          set -euo pipefail

          rm -rf build-input
          rm -f create-dev.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A Eaglercraft-26.2-u1 U1-Patcher
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
            exit 0
          fi

          git commit -m "Generate Eaglercraft 26.2 u1 client source"
          git push origin HEAD:main
