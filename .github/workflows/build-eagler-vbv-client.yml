name: Build Eaglercraft 26.2 u1 VBV Client

on:
  push:
    paths:
      - "ViaBackport26.2-ClientSide/**"
      - "eaglercraft-26.2-patcher-main.tar.gz"
      - ".github/workflows/build-eagler-vbv-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download pinned Eaglercraft 26.2 u1 Setup
        run: |
          set -euo pipefail
          mkdir -p build-input
          curl -fL --retry 3 \
            -o build-input/Eaglercraft-26.2-u1-Setup.jar \
            "https://github.com/melonman106/ChatGPT/releases/download/Modded/Eaglercraft-26.2-u1-Setup.jar"

          echo "57bfcacdf24310d48f462a9a508fe2a59acad8487a8de34bb40963c46183c1bd  build-input/Eaglercraft-26.2-u1-Setup.jar" \
            | sha256sum -c -

      - name: Prepare U1-Patcher launcher
        run: |
          set -euo pipefail

          # U1-Patcher is NOT a directory containing an eagler-patcher
          # executable. It is the extracted contents of the single-file
          # Java patcher JAR. The manifest explicitly names:
          # com.eaglercraft.patcher.SingleFileLauncher
          test -f U1-Patcher/META-INF/MANIFEST.MF
          test -f U1-Patcher/com/eaglercraft/patcher/SingleFileLauncher.class
          test -f U1-Patcher/com/eaglercraft/patcher/SingleFileLauncher\$1.class
          test -f U1-Patcher/portable-kit.zip
          test -f U1-Patcher/portable-kit.sha256

          expected="$(tr -d '[:space:]' < U1-Patcher/portable-kit.sha256)"
          actual="$(sha256sum U1-Patcher/portable-kit.zip | awk '{print $1}')"
          echo "portable-kit expected: $expected"
          echo "portable-kit actual:   $actual"
          test "$actual" = "$expected"

          grep -q '^Main-Class: com.eaglercraft.patcher.SingleFileLauncher'             U1-Patcher/META-INF/MANIFEST.MF

          rm -rf Eaglercraft-26.2-u1
          mkdir -p Eaglercraft-26.2-u1

          # Reassemble the exact single-file launcher from U1-Patcher.
          # This is the required executable form of the files in U1-Patcher.
          (cd U1-Patcher && jar cfm             "$GITHUB_WORKSPACE/Eaglercraft-26.2-u1/Eaglercraft-26.2-u1-Setup.jar"             META-INF/MANIFEST.MF .)

          test -s Eaglercraft-26.2-u1/Eaglercraft-26.2-u1-Setup.jar

          echo "=== U1-Patcher files ==="
          find U1-Patcher -maxdepth 6 -type f -print | sort

          echo "=== Reassembled launcher ==="
          java -jar Eaglercraft-26.2-u1/Eaglercraft-26.2-u1-Setup.jar --help 2>&1 | head -100 || true

          # The launcher itself installs the portable patcher kit.
          java -jar Eaglercraft-26.2-u1/Eaglercraft-26.2-u1-Setup.jar             --install-dir "$GITHUB_WORKSPACE/Eaglercraft-26.2-u1/installed"

          test -d Eaglercraft-26.2-u1/installed

          patcher="$(find Eaglercraft-26.2-u1/installed -type f -name 'eagler-patcher' -print -quit || true)"
          cli_jar="$(find Eaglercraft-26.2-u1/installed -type f -name 'eaglercraft-26.2-java-cli.jar' -print -quit || true)"

          if [ -z "$patcher" ]; then
            echo "::error::The reassembled U1-Patcher launcher did not install an eagler-patcher executable."
            find Eaglercraft-26.2-u1/installed -type f -print | sort
            exit 1
          fi
          if [ -z "$cli_jar" ]; then
            echo "::error::The reassembled U1-Patcher launcher did not install the Java CLI."
            find Eaglercraft-26.2-u1/installed -type f -print | sort
            exit 1
          fi

          chmod +x "$patcher"
          echo "EAGLER_PATCHER_ROOT=$(dirname "$patcher")" >> "$GITHUB_ENV"
          echo "EAGLER_PATCHER=$patcher" >> "$GITHUB_ENV"
          echo "EAGLER_JAVA_CLI=$cli_jar" >> "$GITHUB_ENV"
          echo "Using actual U1-Patcher launcher output:"
          echo "  patcher=$patcher"
          echo "  java-cli=$cli_jar"

      - name: Download official Minecraft 26.2 client
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            -o build-input/minecraft-26.2-client.jar \
            "https://piston-data.mojang.com/v1/objects/2dc72797acbc1b63fc16a11c4ac393605f453754/client.jar"

          echo "2dc72797acbc1b63fc16a11c4ac393605f453754  build-input/minecraft-26.2-client.jar" \
            | sha1sum -c -

      - name: Inspect installed patcher
        run: |
          set -euo pipefail
          cd "$EAGLER_PATCHER_ROOT"
          chmod +x "$EAGLER_PATCHER"
          echo "=== Installed patcher files ==="
          find "$EAGLER_PATCHER_ROOT" -maxdepth 3 -type f | sort
          echo "=== Patcher help ==="
          "$EAGLER_PATCHER" --help 2>&1 || true
          echo "=== create-dev help ==="
          "$EAGLER_PATCHER" create-dev --help 2>&1 || true

      - name: Create editable Eaglercraft source project
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/generated-client"

          # Use the installed patcher's documented CLI rather than treating
          # the patcher distribution itself as a Gradle project.
          cd "$EAGLER_PATCHER_ROOT"
          chmod +x "$EAGLER_PATCHER"

          "$EAGLER_PATCHER" create-dev \
            --minecraft-jar "$GITHUB_WORKSPACE/build-input/minecraft-26.2-client.jar" \
            --output "$GITHUB_WORKSPACE/generated-client"

          if ! find "$GITHUB_WORKSPACE/generated-client" -type f \
              \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) \
              -print -quit | grep -q .; then
            echo "::error::create-dev completed but did not produce a Gradle source project."
            find "$GITHUB_WORKSPACE/generated-client" -maxdepth 5 -type f | sort | head -1000
            exit 1
          fi

      - name: Apply native VBV patch
        run: |
          set -euo pipefail
          python3 ViaBackport26.2-ClientSide/patch/apply_vbv_patch.py generated-client

      - name: Setup Java 25 for Eaglercraft build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Build generated Eaglercraft client
        run: |
          set -euo pipefail
          build_root=$(find generated-client -type f \
            \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) \
            -print -quit | xargs -r dirname)

          if [ -z "$build_root" ]; then
            echo "::error::No generated Gradle client exists after create-dev."
            exit 1
          fi

          cd "$build_root"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload patched client source and build
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackport26.2-ClientSide
          path: |
            generated-client
