name: Build Eaglercraft 26.2 u1 VBV Client

on:
  push:
    paths:
      - "ViaBackport26.2-ClientSide/**"
      - "ModsPack/**"
      - "sounds.epk"
      - "eaglercraft-26.2-patcher-main.tar.gz"
      - "eaglercraft-26.2-patcher-main (1).tar.gz"
      - "u1-1-source/**"
      - "U1-Patcher/**"
      - ".github/workflows/build-eagler-vbv-client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eagler-vbv-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore root checkpoint
        id: root_checkpoint
        uses: actions/cache@v4
        with:
          path: checkpoint
          key: eagler-vbv-root-checkpoint-v5-u1-1-${{ hashFiles('ViaBackport26.2-ClientSide/src/main/java/**/*.java', 'ViaBackport26.2-ClientSide/src/main/resources/**/*.json', 'ViaBackport26.2-ClientSide/patch/**', 'ModsPack/**/*.zip', 'eaglercraft-26.2-patcher-main (1).tar.gz', 'u1-1-source/**', 'U1-Patcher/portable-kit.zip') }}

      - name: Restore repository checkpoint if present
        id: repo_checkpoint
        run: |
          set -euo pipefail
          checkpoint_dir="$GITHUB_WORKSPACE/checkpoint"
          if [ -d "$checkpoint_dir" ] && [ -f "$checkpoint_dir/wasm-toolchain/build-single-html.js" ] && [ -f "$checkpoint_dir/game/build/libs/game.jar" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Repository checkpoint found; skipping create-dev, patching, Gradle build, and resource reconstruction."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No complete repository checkpoint found; performing the normal build."
          fi
      - name: Use root checkpoint as ModdedClientSource
        if: steps.repo_checkpoint.outputs.found == 'true'
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/ModdedClientSource"
          cp -a "$GITHUB_WORKSPACE/checkpoint" "$GITHUB_WORKSPACE/ModdedClientSource"
          test -f "$GITHUB_WORKSPACE/ModdedClientSource/wasm-toolchain/build-single-html.js"
          test -f "$GITHUB_WORKSPACE/ModdedClientSource/game/build/libs/game.jar"
          test -f "$GITHUB_WORKSPACE/ModdedClientSource/game/src/main/resources/pack.png"
          echo "Root checkpoint restored directly."
          du -sh "$GITHUB_WORKSPACE/ModdedClientSource"
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare checked-in U1.1 patcher source
        if: steps.repo_checkpoint.outputs.found != 'true'
        run: |
          set -euo pipefail

          source_root="$GITHUB_WORKSPACE/u1-1-source"
          if [ ! -f "$source_root/patcher/java-cli/eagler-patcher" ]; then
            echo "::error::Checked-in U1.1 source is missing."
            echo "Run the 'Inspect Eaglercraft U1.1 patcher' workflow once. It now extracts the tarball and commits u1-1-source/ to the repository."
            exit 1
          fi

          patcher_root="$source_root/patcher/java-cli"
          chmod +x "$patcher_root/eagler-patcher"

          echo "=== Checked-in U1.1 source ==="
          du -sh "$source_root"
          echo "Patcher: $patcher_root/eagler-patcher"

          echo "=== U1.1 patcher build inputs ==="
          find "$source_root/patcher" -maxdepth 4 -type f \
            \( -name '*.zip' -o -name '*.jar' -o -name 'build.sh' -o -name 'eagler-patcher' \) \
            -printf '%p\n' | sort | head -500

          echo "=== Building U1.1 Java CLI patcher ==="
          cd "$patcher_root"
          ./build.sh

          cli_jar="$patcher_root/build/eaglercraft-26.2-java-cli.jar"
          test -s "$cli_jar"

          # U1.1's source archive is the authoritative patcher workspace.
          # Do not run make-portable.sh here: that packaging step expects
          # the separate iwa/ tree, which is intentionally not present in
          # the checked-in patcher source archive.
          echo "Using the U1.1 source workspace directly; skipping make-portable.sh."

          patcher="$(realpath "$patcher_root/eagler-patcher")"
          cli_jar="$(realpath "$cli_jar")"

          echo "EAGLER_PATCHER_ROOT=$patcher_root" >> "$GITHUB_ENV"
          echo "EAGLER_PATCHER=$patcher" >> "$GITHUB_ENV"
          echo "EAGLER_JAVA_CLI=$cli_jar" >> "$GITHUB_ENV"

          echo "=== U1.1 source inputs after build ==="
          find "$source_root/patcher" -maxdepth 6 -type f \
            \( -name '*.zip' -o -name '*.jar' \) -printf '%s %p\n' | sort -nr | head -500

      - name: Resolve U1.1 inputs with legacy U1 fallback
        if: steps.repo_checkpoint.outputs.found != 'true'
        run: |
          set -euo pipefail

          source_root="$GITHUB_WORKSPACE/u1-1-source"
          legacy_zip="$GITHUB_WORKSPACE/U1-Patcher/portable-kit.zip"
          legacy_root="$GITHUB_WORKSPACE/legacy-u1-kit"
          resolved_root="$GITHUB_WORKSPACE/resolved-u1-inputs"

          rm -rf "$legacy_root" "$resolved_root"
          mkdir -p "$legacy_root" "$resolved_root"
          test -s "$legacy_zip"
          unzip -q -o "$legacy_zip" -d "$legacy_root"

          u11_bundle_sha="fd944e9cabbebbf4bddce8a39e1b233b3c7d0cd4f860f9cae37550a3fcfa8b02"
          u11_skeleton_sha="a9172bdd903ea65afd4c87cdb29b500c237c823fdd94789c2e90561b1b049469"
          legacy_skeleton_sha="3656a83ed8187e2d859612c566f3aa73e242bf1e4633990c5bb4929e0a846c94"

          find_sha() {
            local root="$1"
            local expected="$2"
            local candidate sha
            while IFS= read -r -d '' candidate; do
              [ -f "$candidate" ] || continue
              sha="$(sha256sum "$candidate" | cut -d' ' -f1)"
              if [ "$sha" = "$expected" ]; then
                printf '%s' "$candidate"
                return 0
              fi
            done < <(find "$root" -type f -name '*.zip' -print0 | sort -z)
            return 1
          }

          echo "=== U1.1/legacy input inventory ==="
          find "$source_root" "$legacy_root" -type f \
            \( -name '*.zip' -o -name 'eagler-patcher' \) \
            -printf '%p\n' | sort || true

          u11_bundle="$(find_sha "$source_root" "$u11_bundle_sha" || true)"
          u11_skeleton="$(find_sha "$source_root" "$u11_skeleton_sha" || true)"

          if [ -n "$u11_bundle" ] && [ -n "$u11_skeleton" ]; then
            # Full U1.1 input set is present: use the U1.1 patcher and its
            # Netty-fix skeleton.
            resolved_patcher="$source_root/patcher/java-cli/eagler-patcher"
            resolved_bundle="$resolved_root/source-patch-bundle.zip"
            resolved_skeleton="$resolved_root/project-skeleton-u1-nettyfix.zip"
            resolved_bundle_sha="$u11_bundle_sha"
            resolved_skeleton_sha="$u11_skeleton_sha"
            resolved_mode="u1.1"
            cp -Lf "$u11_bundle" "$resolved_bundle"
            cp -Lf "$u11_skeleton" "$resolved_skeleton"

  
            echo "U1.1 complete input set found."
          else
            # The U1.1 source archive does not contain its binary sidecars.
            # If the new accepted skeleton is unavailable, do NOT feed an old
            # skeleton to the U1.1 CLI. Instead fall back as a matched set to
            # the original U1 portable patcher + its own skeleton.
            legacy_patcher="$(find "$legacy_root" -type f -name 'eagler-patcher' -print -quit || true)"
            legacy_bundle="$(find_sha "$legacy_root" "$u11_bundle_sha" || true)"
            legacy_skeleton="$(find_sha "$legacy_root" "$legacy_skeleton_sha" || true)"

            if [ -z "$legacy_patcher" ]; then
              echo "::error::Legacy U1 eagler-patcher was not found inside portable-kit.zip."
              exit 1
            fi
            if [ -z "$legacy_bundle" ]; then
              echo "::error::Legacy U1 source-patch-bundle.zip with SHA $u11_bundle_sha was not found."
              exit 1
            fi
            if [ -z "$legacy_skeleton" ]; then
              echo "::error::Legacy U1 project skeleton with SHA $legacy_skeleton_sha was not found."
              echo "=== Legacy skeleton candidates and hashes ==="
              find "$legacy_root" -type f -name '*.zip' -print0 |
                while IFS= read -r -d '' f; do
                  printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$f"
                done | sort || true
              exit 1
            fi

            resolved_patcher="$legacy_patcher"
            resolved_bundle="$resolved_root/source-patch-bundle.zip"
            resolved_skeleton="$resolved_root/project-skeleton-v5-teavm-runtime-verified.zip"
            resolved_bundle_sha="$u11_bundle_sha"
            resolved_skeleton_sha="$legacy_skeleton_sha"
            resolved_mode="legacy-u1"
            cp -Lf "$legacy_bundle" "$resolved_bundle"
            cp -Lf "$legacy_skeleton" "$resolved_skeleton"

            chmod +x "$resolved_patcher"
  
            echo "U1.1 sidecars incomplete; falling back to the complete legacy U1 patcher/input set."
            echo "Legacy patcher:  $legacy_patcher"
            echo "Legacy bundle:   $resolved_root/source-patch-bundle.zip"
            echo "Legacy skeleton: $resolved_root/project-skeleton-v5-teavm-runtime-verified.zip"
          fi

          # GITHUB_ENV only affects subsequent workflow steps, so keep local
          # resolved_* variables for validation in this step.
          test -f "$resolved_patcher"
          test -f "$resolved_bundle"
          test -f "$resolved_skeleton"
          test "$(sha256sum "$resolved_bundle" | cut -d' ' -f1)" = "$resolved_bundle_sha"
          test "$(sha256sum "$resolved_skeleton" | cut -d' ' -f1)" = "$resolved_skeleton_sha"

          {
            echo "EAGLER_PATCHER=$resolved_patcher"
            echo "EAGLER_PATCH_BUNDLE=$resolved_bundle"
            echo "EAGLER_PROJECT_SKELETON=$resolved_skeleton"
            echo "EAGLER_PATCH_BUNDLE_SHA256=$resolved_bundle_sha"
            echo "EAGLER_PROJECT_SKELETON_SHA256=$resolved_skeleton_sha"
            echo "EAGLER_EXPECTED_SKELETON_SHA256=$resolved_skeleton_sha"
            echo "EAGLER_PATCHER_MODE=$resolved_mode"
          } >> "$GITHUB_ENV"

          echo "=== Final resolved input map ==="
          printf 'mode=%s
patcher=%s
patch_bundle=%s
project_skeleton=%s
'             "$resolved_mode" "$resolved_patcher" "$resolved_bundle" "$resolved_skeleton"
          printf 'patch_bundle_sha256=%s
skeleton_sha256=%s
'             "$resolved_bundle_sha" "$resolved_skeleton_sha"
          ls -lh "$resolved_bundle" "$resolved_skeleton" "$resolved_patcher"
          file "$resolved_bundle" "$resolved_skeleton" "$resolved_patcher"

      - name: Download official Minecraft 26.2 client
        if: steps.repo_checkpoint.outputs.found != 'true'
        run: |
          set -euo pipefail
          # curl does not create its parent directory.
          mkdir -p "$GITHUB_WORKSPACE/build-input"
          curl -fL --retry 3 -o "$GITHUB_WORKSPACE/build-input/minecraft-26.2-client.jar" "https://piston-data.mojang.com/v1/objects/2dc72797acbc1b63fc16a11c4ac393605f453754/client.jar"
          echo "2dc72797acbc1b63fc16a11c4ac393605f453754  build-input/minecraft-26.2-client.jar" | sha1sum -c -
      - name: Prepare Vineflower 1.12.0
        if: steps.repo_checkpoint.outputs.found != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build-input"
          vineflower="$GITHUB_WORKSPACE/build-input/vineflower-1.12.0.jar"
          curl -fL --retry 3 -o "$vineflower" "https://github.com/Vineflower/vineflower/releases/download/1.12.0/vineflower-1.12.0.jar"
          echo "1dfcfe974395734fa467ce620661c7623d05ba83670de0529b1fbd63ff548b9d  $vineflower" | sha256sum -c -
          test -s "$vineflower"
      - name: Inspect extracted U1.1 patcher
        if: steps.repo_checkpoint.outputs.found != 'true'
        run: |
          set -euo pipefail
          echo "=== U1.1 portable kit root ==="
          find "$EAGLER_PATCHER_ROOT" -maxdepth 3 -type f | sort
          echo "=== Patcher help ==="
          "$EAGLER_PATCHER" --help 2>&1 || true
          echo "=== create-dev help ==="
          "$EAGLER_PATCHER" create-dev --help 2>&1 || true
      - name: Create editable Eaglercraft source project
        if: steps.repo_checkpoint.outputs.found != 'true'
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/generated-client"
          cd "$EAGLER_PATCHER_ROOT"
          chmod +x "$EAGLER_PATCHER"
          "$EAGLER_PATCHER" create-dev             --jar "$GITHUB_WORKSPACE/build-input/minecraft-26.2-client.jar"             --output "$GITHUB_WORKSPACE/generated-client"             --vineflower "$GITHUB_WORKSPACE/build-input/vineflower-1.12.0.jar"             --java17 "$JAVA_HOME/bin/java"             --patch-bundle "$EAGLER_PATCH_BUNDLE"             --expected-bundle-sha256 "$EAGLER_PATCH_BUNDLE_SHA256"             --project-skeleton "$EAGLER_PROJECT_SKELETON"             --expected-skeleton-sha256 "$EAGLER_EXPECTED_SKELETON_SHA256"
          if ! find "$GITHUB_WORKSPACE/generated-client" -type f \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit | grep -q .; then
            echo "::error::create-dev completed but did not produce a Gradle source project."
            find "$GITHUB_WORKSPACE/generated-client" -maxdepth 5 -type f | sort | head -1000
            exit 1
          fi
      - name: Verify Eagler u1 rendering patch inputs
        if: steps.repo_checkpoint.outputs.found != 'true'
        run: |
          set -euo pipefail
          patch_bundle="$EAGLER_PATCH_BUNDLE"
          skeleton="$EAGLER_PROJECT_SKELETON"
          test -f "$patch_bundle"
          test -f "$skeleton"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          unzip -q "$patch_bundle" -d "$work/patch"
          unzip -q "$skeleton" -d "$work/skeleton"
          echo "=== Eagler rendering patch files ==="
          find "$work/patch" -type f \( -iname '*RenderPipeline*' -o -iname '*RenderTarget*' -o -iname '*WebGL2*' \) -print | sort | head -200
          if ! find "$work/patch" -type f -name 'RenderPipelines.java.delta' -print -quit | grep -q .; then
            echo "::error::The verified u1 patch bundle does not contain RenderPipelines.java.delta."
            exit 1
          fi
          if ! find "$work/skeleton" -type f -name 'WebGL2RenderPipeline.java' -print -quit | grep -q .; then
            echo "::error::The verified u1 skeleton does not contain WebGL2RenderPipeline.java."
            exit 1
          fi
          echo "Verified U1.1 rendering implementation and RenderPipelines patch."
          echo "Vanilla 26.2 shader source files are intentionally retained below:"
          echo "Eagler u1 consumes the Minecraft shader resource tree through its patched rendering pipeline."
      - name: Apply native VBV patch
        if: steps.repo_checkpoint.outputs.found != 'true'
        run: |
          set -euo pipefail
          python3 ViaBackport26.2-ClientSide/patch/apply_vbv_patch.py generated-client
      - name: Restore Minecraft runtime resources
        if: steps.repo_checkpoint.outputs.found != 'true'
        run: |
          set -euo pipefail
          game_dir="$(find generated-client -type f \( -path "*/game/build.gradle" -o -path "*/game/build.gradle.kts" \) -print -quit | xargs -r dirname)"
          if [ -z "$game_dir" ]; then
            echo "::error::Could not locate the generated game module."
            exit 1
          fi
          resources="$game_dir/src/main/resources"
          # Preserve Eagler-specific skeleton resources (especially pack.png).
          # create-dev can place the Eagler pack image outside the Gradle
          # resource directory, so locate it before overlaying Minecraft assets.
          mkdir -p "$resources"
          pack_png=""
          # The repository provides the Eaglercraft pack image explicitly.
          # Prefer it so the final deploy step always receives the required pack.png.
          if [ -f "$GITHUB_WORKSPACE/ViaBackport26.2-ClientSide/pack.png" ]; then
            pack_png="$GITHUB_WORKSPACE/ViaBackport26.2-ClientSide/pack.png"
          fi
          if [ -z "$pack_png" ]; then
            pack_png="$(find "$game_dir" -type f -name 'pack.png' -print -quit || true)"
          fi
          if [ -z "$pack_png" ]; then
            pack_png="$(find "$GITHUB_WORKSPACE/generated-client" -type f -path '*/src/main/resources/pack.png' -print -quit || true)"
          fi
          if [ -z "$pack_png" ] && [ -f "$GITHUB_WORKSPACE/generated-client/source/pack.png" ]; then
            pack_png="$GITHUB_WORKSPACE/generated-client/source/pack.png"
          fi
          if [ -z "$pack_png" ]; then
            pack_png="$(find "$EAGLER_PATCHER_ROOT" -type f -name 'pack.png' -print -quit || true)"
          fi
          if [ -z "$pack_png" ]; then
            echo "::error::Could not locate the Eaglercraft pack.png required by deploy_wasm_web.sh."
            echo "=== pack.png candidates under generated-client ==="
            find "$GITHUB_WORKSPACE/generated-client" -type f -name 'pack.png' -print | sort || true
            echo "=== pack.png candidates under U1 patcher ==="
            find "$EAGLER_PATCHER_ROOT" -type f -name 'pack.png' -print | sort || true
            exit 1
          fi
          pack_png="$(realpath "$pack_png")"
          cp -f "$pack_png" "$resources/pack.png"
          echo "Preserved Eagler skeleton pack.png from: $pack_png"
          temp_resources="$(mktemp -d)"
          trap 'rm -rf "$temp_resources"' EXIT
          unzip -q build-input/minecraft-26.2-client.jar -d "$temp_resources"
          for path in version.json assets; do
            if [ ! -e "$temp_resources/$path" ]; then
              echo "::error::Official client JAR is missing required runtime resource: $path"
              exit 1
            fi
          done
          if [ -e "$temp_resources/pack.mcmeta" ]; then
            echo "Official client JAR contains pack.mcmeta."
          else
            echo "Official client JAR has no pack.mcmeta; creating a minimal 26.2 header."
            printf '%s\n' '{' '  "pack": {' '    "description": "Minecraft 26.2",' '    "min_format": 88,' '    "max_format": 88' '  }' '}' > "$temp_resources/pack.mcmeta"
          fi
          echo "=== Restoring runtime resources ==="
          cp -a "$temp_resources/version.json" "$resources/"
          cp -a "$temp_resources/pack.mcmeta" "$resources/"
          # Add official Minecraft assets without overwriting any resources
          # supplied by the Eagler u1 skeleton. This is intentionally not
          # limited to a hard-coded shaders/ directory: u1 keeps some
          # Eagler/WebGL resources outside the vanilla Minecraft shader path.
          mkdir -p "$resources/assets"
          cp -an "$temp_resources/assets"/. "$resources/assets"/
          echo "=== Preserved existing Eagler resources while adding vanilla assets ==="
          if find "$resources" -type f \( -name '*.vsh' -o -name '*.fsh' -o -name '*.glsl' \) -print -quit | grep -q .; then
            echo "Eagler shader source files detected:"
            find "$resources" -type f \( -name '*.vsh' -o -name '*.fsh' -o -name '*.glsl' \) -print | sort | head -100
          else
            echo "WARNING: no Eagler shader source files were visible in the Gradle resources at this stage."
          fi
          if [ -e "$temp_resources/data" ]; then
            cp -a "$temp_resources/data" "$resources/"
          else
            echo "Official client JAR has no data/ directory; skipping it."
          fi
          echo "=== Restored runtime resources ==="
          printf 'game module: %s\nresources: %s\n' "$game_dir" "$resources"
          test -f "$resources/version.json"
          test -f "$resources/pack.mcmeta"
          test -f "$resources/assets/minecraft/lang/en_us.json"
          test -f "$resources/pack.png"
          echo "Preserved Eagler skeleton pack.png:"
          ls -lh "$resources/pack.png"
          du -sh "$resources"
          find "$resources" -type f | wc -l
      - name: Setup Java 25 for Eaglercraft build
        if: steps.repo_checkpoint.outputs.found != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache Gradle dependencies and build cache
        if: steps.repo_checkpoint.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: eagler-vbv-gradle-${{ runner.os }}-${{ hashFiles('generated-client/**/gradle-wrapper.properties', 'generated-client/**/build.gradle*', 'generated-client/**/gradle.properties') }}
          restore-keys: |
            eagler-vbv-gradle-${{ runner.os }}-
      - name: Build generated Eaglercraft client
        if: steps.repo_checkpoint.outputs.found != 'true'
        run: |
          set -euo pipefail
          build_root="$(find generated-client -type f -name 'gradlew' -print -quit | xargs -r dirname)"
          if [ -z "$build_root" ]; then
            echo "::error::No generated Gradle client root (gradlew) exists after create-dev."
            find generated-client -maxdepth 4 -type f \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print | sort
            exit 1
          fi
          cd "$build_root"
          chmod +x ./gradlew
          ./gradlew assemble --no-daemon
      - name: Inject Minecraft runtime resources into game JAR
        if: steps.repo_checkpoint.outputs.found != 'true'
        run: |
          set -euo pipefail
          build_root="$(find generated-client -type f -name 'gradlew' -print -quit | xargs -r dirname)"
          if [ -z "$build_root" ]; then
            echo "::error::Could not locate the generated Eaglercraft build root (gradlew)."
            exit 1
          fi
          game_libs="$build_root/game/build/libs"
          if [ ! -d "$game_libs" ]; then
            echo "::error::Game build output directory does not exist: $game_libs"
            find "$build_root" -maxdepth 5 -type d -path '*/game/build/*' -print | sort || true
            exit 1
          fi
          game_jar="$(find "$game_libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          if [ -z "$game_jar" ]; then
            echo "::error::Could not locate the assembled game JAR in: $game_libs"
            find "$game_libs" -maxdepth 1 -type f -print | sort || true
            exit 1
          fi
          temp_resources="$(mktemp -d)"
          trap 'rm -rf "$temp_resources"' EXIT
          unzip -q build-input/minecraft-26.2-client.jar -d "$temp_resources"
          for path in version.json assets; do
            if [ ! -e "$temp_resources/$path" ]; then
              echo "::error::Official client JAR is missing required runtime resource: $path"
              exit 1
            fi
          done
          if [ -e "$temp_resources/pack.mcmeta" ]; then
            echo "Official client JAR contains pack.mcmeta."
          else
            echo "Official client JAR has no pack.mcmeta; recreating the same minimal 26.2 header used for game resources."
            printf '%s\n' '{' '  "pack": {' '    "description": "Minecraft 26.2",' '    "min_format": 88,' '    "max_format": 88' '  }' '}' > "$temp_resources/pack.mcmeta"
          fi
          echo "Injecting runtime resources into: $game_jar"
          jar --update --file "$game_jar" \
            -C "$temp_resources" version.json \
            -C "$temp_resources" pack.mcmeta
          # IMPORTANT: do not inject the raw vanilla assets/ tree into game.jar.
          # create-dev + Eagler u1 already provide the Eagler-compatible shader
          # resources. Replacing them with the Mojang client assets causes the
          # WebGL renderer to request vanilla pipeline resources that have no
          # Eagler-compatible shader source, producing black-screen/no-source
          # shader failures.
          if [ -e "$temp_resources/data" ]; then
            echo "Injecting official 26.2 data/ directory too."
            jar --update --file "$game_jar" -C "$temp_resources" data
          else
            echo "No data/ directory in client JAR; skipping it."
          fi
          echo "=== Required resources in game.jar ==="
          jar_contents="$temp_resources/game-jar-contents.txt"
          jar --list --file "$game_jar" > "$jar_contents"
          grep -E '^(version.json|pack.mcmeta|assets/minecraft/lang/en_us.json|assets/)' "$jar_contents" | head -30 || true
          grep -qx 'version.json' "$jar_contents"
          grep -qx 'pack.mcmeta' "$jar_contents"
          grep -qx 'assets/minecraft/lang/en_us.json' "$jar_contents"
          echo "=== game.jar size ==="
          ls -lh "$game_jar"
      - name: Setup Node.js for single-HTML packaging
        if: steps.repo_checkpoint.outputs.found != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Prepare ModdedClientSource
        if: steps.repo_checkpoint.outputs.found != 'true'
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/ModdedClientSource"
          build_root="$(find "$GITHUB_WORKSPACE/generated-client" -type f -name 'gradlew' -print -quit | xargs -r dirname)"
          if [ -z "$build_root" ]; then
            echo "::error::Could not locate the generated Eaglercraft Gradle root."
            find "$GITHUB_WORKSPACE/generated-client" -maxdepth 6 -type f \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print | sort || true
            exit 1
          fi
          build_root="$(realpath "$build_root")"
          mkdir -p "$GITHUB_WORKSPACE/ModdedClientSource"
          cp -a "$build_root"/. "$GITHUB_WORKSPACE/ModdedClientSource/"
          modded_root="$GITHUB_WORKSPACE/ModdedClientSource"
          game_dir="$(find "$modded_root" -type f \( -path "*/game/build.gradle" -o -path "*/game/build.gradle.kts" \) -print -quit | xargs -r dirname)"
          if [ -z "$game_dir" ]; then
            echo "::error::Could not locate the copied Gradle game module."
            find "$modded_root" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print | sort | head -300
            exit 1
          fi
          game_dir="$(realpath "$game_dir")"
          resources="$game_dir/src/main/resources"
          echo "=== Generated client paths ==="
          echo "Gradle root: $build_root"
          echo "Copied root: $modded_root"
          echo "Game module: $game_dir"
          echo "Resources:   $resources"
          # Preserve Eagler-specific skeleton resources, especially pack.png.
          # Only overlay the official Minecraft runtime resources.
          mkdir -p "$resources"
          temp_resources="$(mktemp -d)"
          trap 'rm -rf "$temp_resources"' EXIT
          unzip -q "$GITHUB_WORKSPACE/build-input/minecraft-26.2-client.jar" -d "$temp_resources"
          test -f "$temp_resources/version.json"
          test -f "$temp_resources/assets/minecraft/lang/en_us.json"
          if [ -e "$temp_resources/pack.mcmeta" ]; then
            cp -a "$temp_resources/pack.mcmeta" "$resources/"
          else
            printf '%s\n' '{' '  "pack": {' '    "description": "Minecraft 26.2",' '    "min_format": 88,' '    "max_format": 88' '  }' '}' > "$resources/pack.mcmeta"
          fi
          cp -a "$temp_resources/version.json" "$resources/"
          # Add official assets without overwriting Eagler/u1 resources.
          # The source project is the authoritative owner of Eagler-specific
          # WebGL resources, while vanilla files are added only when absent.
          mkdir -p "$resources/assets"
          cp -an "$temp_resources/assets"/. "$resources/assets"/
          echo "=== Preserved Eagler resources in packaging source ==="
          if find "$resources" -type f \( -name '*.vsh' -o -name '*.fsh' -o -name '*.glsl' \) -print -quit | grep -q .; then
            echo "Eagler shader source files detected:"
            find "$resources" -type f \( -name '*.vsh' -o -name '*.fsh' -o -name '*.glsl' \) -print | sort | head -100
          else
            echo "WARNING: no Eagler shader source files are visible in packaging resources."
          fi
          if [ -e "$temp_resources/data" ]; then
            cp -a "$temp_resources/data" "$resources/"
          fi
          test -f "$resources/version.json"
          test -f "$resources/pack.mcmeta"
          test -f "$resources/assets/minecraft/lang/en_us.json"
          test -f "$resources/pack.png"
          game_classes="$game_dir/build/classes/java/main"
          mkdir -p "$game_classes"
          cp -a "$resources"/. "$game_classes"/
          test -f "$game_classes/version.json"
          test -f "$game_classes/pack.mcmeta"
          test -f "$game_classes/assets/minecraft/lang/en_us.json"
          test -f "$game_classes/pack.png"
          echo "=== TeaVM resource classpath verified ==="
          ls -lh "$game_classes/version.json" "$game_classes/pack.png"
          single_html_script="$modded_root/wasm-toolchain/build-single-html.js"
          if [ ! -f "$single_html_script" ]; then
            echo "::error::The generated client does not contain wasm-toolchain/build-single-html.js."
            find "$modded_root" -path '*/wasm-toolchain/*' -type f -print | sort || true
            exit 1
          fi
          echo "Found single-HTML builder: $single_html_script"
          # Copy built-in client-mod metadata and pack.png icons into the
          # generated resource classpath. Resource-pack-backed features are
          # presented as mods in the native Mods screen.
          builtin_mods="$GITHUB_WORKSPACE/ViaBackport26.2-ClientSide/src/main/resources/vbvclient/mods"
          if [ -d "$builtin_mods" ]; then
            mkdir -p "$resources/vbvclient/mods"
            cp -a "$builtin_mods"/. "$resources/vbvclient/mods/"
            for mod_dir in "$resources"/vbvclient/mods/*; do
              [ -d "$mod_dir" ] || continue
              if [ ! -f "$mod_dir/pack.png" ]; then
                cp -f "$GITHUB_WORKSPACE/ViaBackport26.2-ClientSide/pack.png" "$mod_dir/pack.png"
              fi
            done
            mkdir -p "$game_classes/vbvclient/mods"
            cp -a "$resources"/vbvclient/mods/. "$game_classes/vbvclient/mods/"
          fi
          node --version
      - name: Prepare pre-single-file browser test client
        if: success()
        run: |
          set -euo pipefail

          build_root="$GITHUB_WORKSPACE/ModdedClientSource"
          dev_dir="$GITHUB_WORKSPACE/dev-web-client"
          rm -rf "$dev_dir"
          mkdir -p "$dev_dir"
          cd "$build_root"

          echo "=== Preparing supported Eagler u1 JavaScript browser client ==="
          echo "WASM-GC is intentionally not used here: the u1 incremental TeaVM task"
          echo "currently follows Minecraft's desktop/server Netty connection path and"
          echo "fails dependency analysis on KQueue/Epoll. The JavaScript TeaVM target"
          echo "is the supported browser target and is also what the single-file packager consumes."

          echo "=== Available browser build tasks ==="
          ./gradlew :target_teavm:tasks --all --console=plain --no-daemon 2>&1 |             grep -E 'buildEaglerJS|generateJavaScript|stageClient|packageClient' || true

          echo "=== Building the Eagler JavaScript client ==="
          if ./gradlew :target_teavm:tasks --all --console=plain --no-daemon 2>/dev/null | grep -qE '^buildEaglerJS([[:space:]]|$)'; then
            ./gradlew :target_teavm:buildEaglerJS               --no-daemon               --max-workers=1               -Dorg.gradle.parallel=false               -Dorg.gradle.jvmargs=-Xmx10g
          else
            echo "Friendly buildEaglerJS task is unavailable; using generateJavaScript."
            ./gradlew :target_teavm:generateJavaScript               --no-daemon               --max-workers=1               -Dorg.gradle.parallel=false               -Dorg.gradle.jvmargs=-Xmx10g
          fi

          echo "=== Locating generated JavaScript browser output ==="
          web_dir="$build_root/target_teavm/build/web"
          js_dir="$build_root/target_teavm/javascript"

          if [ -f "$web_dir/index.html" ] && [ -s "$web_dir/classes.js" ]; then
            echo "Complete target_teavm/build/web output found."
          elif [ -f "$js_dir/classes.js" ]; then
            echo "TeaVM generated classes.js; staging the standard Eagler web resources."
            mkdir -p "$web_dir"
            cp -f "$js_dir/classes.js" "$web_dir/classes.js"
            if [ -f "$js_dir/classes.js.map" ]; then
              cp -f "$js_dir/classes.js.map" "$web_dir/classes.js.map"
            fi
            index="$(find "$build_root/src" -type f -path '*/teavm*/resources/index.html' -print -quit 2>/dev/null || true)"
            if [ -n "$index" ]; then
              cp -f "$index" "$web_dir/index.html"
            fi
            for item in "$build_root/target_teavm/build/web" "$build_root/target_teavm_javascript/build/web"; do
              [ -d "$item" ] || continue
              find "$item" -maxdepth 1 -type f ! -name 'classes.js' ! -name 'classes.js.map' -exec cp -n {} "$web_dir/" \; 2>/dev/null || true
            done
          else
            echo "::error::The supported Eagler JavaScript target produced neither target_teavm/build/web/classes.js nor target_teavm/javascript/classes.js."
            find "$build_root/target_teavm" -maxdepth 4 -type f \( -name '*.js' -o -name '*.html' \) -printf '%s %p\n' 2>/dev/null | sort -nr | head -200 || true
            exit 1
          fi

          if [ ! -f "$web_dir/index.html" ] || [ ! -s "$web_dir/classes.js" ]; then
            echo "::error::JavaScript browser output is incomplete."
            find "$web_dir" -maxdepth 2 -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -200 || true
            exit 1
          fi

          cp -a "$web_dir"/. "$dev_dir"/
          printf '%s\n'             'Pre-single-file Eaglercraft 26.2 VBV browser client'             ''             'This is the supported Eagler u1 JavaScript browser build before build-single-html.js.'             ''             'Use HTTP/HTTPS rather than file:// if the browser blocks local module loading.'             > "$dev_dir/README-DEV-CLIENT.txt"

          echo "=== Pre-single-file browser client ==="
          find "$dev_dir" -maxdepth 3 -type f -printf '%s %p\n' | sort -nr | head -100
          echo "File count: $(find "$dev_dir" -type f | wc -l)"
          du -sh "$dev_dir"

      - name: Upload pre-single-file browser client
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Dev-Web
          path: dev-web-client
          retention-days: 7
          compression-level: 1
          if-no-files-found: error

      - name: Save root checkpoint
        if: steps.repo_checkpoint.outputs.found != 'true'
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/checkpoint"
          cp -a "$GITHUB_WORKSPACE/ModdedClientSource" "$GITHUB_WORKSPACE/checkpoint"
          test -f "$GITHUB_WORKSPACE/checkpoint/wasm-toolchain/build-single-html.js"
          test -f "$GITHUB_WORKSPACE/checkpoint/game/build/libs/game.jar"
          test -f "$GITHUB_WORKSPACE/checkpoint/game/src/main/resources/pack.png"
          echo "Root checkpoint created:"
          du -sh "$GITHUB_WORKSPACE/checkpoint"
      # This is the expensive-build checkpoint. If the packaging job fails,
      # GitHub can rerun only that failed job instead of rebuilding TeaVM.
      - name: Upload packaging checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: vbv-single-html-input
          path: ModdedClientSource
          retention-days: 7
          compression-level: 1
          if-no-files-found: error

  package:
    name: Package single-file HTML
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository for packaging inputs
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify repository sounds.epk
        run: |
          set -euo pipefail
          test -s "$GITHUB_WORKSPACE/sounds.epk"
          echo "Repository sounds.epk is present:"
          ls -lh "$GITHUB_WORKSPACE/sounds.epk"
      - name: Initialize packaging warnings
        run: |
          set -euo pipefail
          : > "$GITHUB_WORKSPACE/packaging-warnings.txt"
      - name: Download packaging checkpoint
        uses: actions/download-artifact@v5
        with:
          name: vbv-single-html-input
          path: checkpoint

      - name: Normalize packaging checkpoint
        run: |
          set -euo pipefail
          rm -rf ModdedClientSource
          echo "=== Artifact layout ==="
          layout_file="$(mktemp)"
          find checkpoint -maxdepth 5 -type f -print | sort > "$layout_file"
          head -300 "$layout_file"
          rm -f "$layout_file"
          builder="$(find checkpoint -type f -path '*/wasm-toolchain/build-single-html.js' -print -quit || true)"
          if [ -z "$builder" ]; then
            echo "::error::Packaging artifact does not contain wasm-toolchain/build-single-html.js."
            exit 1
          fi
          # build-single-html.js is directly inside wasm-toolchain, so its
          # parent is the actual project root in this checkpoint.
          artifact_root="$(dirname "$(dirname "$builder")")"
          # The artifact is downloaded under checkpoint/, with the project
          # files preserved at checkpoint/<project-root>. In the current
          # artifact layout that project root is checkpoint itself.
          mkdir -p ModdedClientSource
          cp -a "$artifact_root"/. ModdedClientSource/
          echo "=== Normalized checkpoint ==="
          echo "Artifact root: $artifact_root"
          test -f ModdedClientSource/wasm-toolchain/build-single-html.js
          test -f ModdedClientSource/game/src/main/resources/pack.png
          test -f ModdedClientSource/game/build/classes/java/main/pack.png
          echo "Packaging checkpoint restored successfully."
          du -sh ModdedClientSource
      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Prepare Gradle wrapper for packaging
        working-directory: ModdedClientSource
        run: |
          set -euo pipefail
          if [ ! -f ./gradlew ]; then
            echo "::error::Packaging checkpoint is missing gradlew."
            exit 1
          fi
          chmod +x ./gradlew
          test -x ./gradlew
          echo "Gradle wrapper is executable."
          java -version
          ./gradlew --version --no-daemon
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-eagler-vbv-node24-${{ runner.os }}-${{ hashFiles('ModdedClientSource/package.json') }}
          restore-keys: |
            npm-eagler-vbv-node24-${{ runner.os }}-
      - name: Install single-HTML packaging dependencies
        working-directory: ModdedClientSource
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Prepare sounds.epk for single-HTML packaging
        working-directory: ModdedClientSource
        run: |
          set -euo pipefail
          echo "=== Looking for sounds EPK Gradle task ==="
          tasks="$(./gradlew :target_lwjgl_desktop:tasks --all --console=plain --no-daemon 2>/dev/null || true)"
          printf '%s\n' "$tasks" | grep -i 'sound.*epk\|epk.*sound' || true
          if printf '%s\n' "$tasks" | grep -Eq '^.*buildSoundsEPK[[:space:]]'; then
            echo "Running :target_lwjgl_desktop:buildSoundsEPK"
            ./gradlew :target_lwjgl_desktop:buildSoundsEPK --console=plain --no-daemon --max-workers=1 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx4096m
          else
            echo "No buildSoundsEPK task exposed; checking the repository root for sounds.epk."
          fi
          web_dir="$PWD/target_teavm_wasm_gc/build/web"
          mkdir -p "$web_dir"
          # music.epk belongs to the regular TeaVM web-assets build. It is
          # not required as a user-supplied input for this custom client.
          # If the regular asset is unavailable, create an empty placeholder
          # so the single-HTML packager can continue without music data.
          music="$PWD/target_teavm/build/web/music.epk"
          if [ -s "$music" ]; then
            echo "Using existing regular TeaVM music.epk: $music"
          else
            echo "WARNING: regular TeaVM music.epk is missing; continuing without music data."
            echo "WARNING: music.epk is missing; music data was omitted from this build." >> "$GITHUB_WORKSPACE/packaging-warnings.txt"
            mkdir -p "$(dirname "$music")"
            : > "$music"
          fi
          sounds="$(find . -type f -name 'sounds.epk' -print -quit || true)"
          if [ -n "$sounds" ]; then
            echo "Using generated sounds.epk from: $sounds"
            cp -Lf "$sounds" "$web_dir/sounds.epk"
          elif [ -f "$GITHUB_WORKSPACE/sounds.epk" ]; then
            echo "Using repository-root sounds.epk"
            cp -Lf "$GITHUB_WORKSPACE/sounds.epk" "$web_dir/sounds.epk"
          else
            echo "::error::No sounds.epk found. Add sounds.epk to the repository root."
            echo "Expected: $GITHUB_WORKSPACE/sounds.epk"
            exit 1
          fi
          test -s "$web_dir/sounds.epk"
          echo "Installed sounds.epk:"
          ls -lh "$web_dir/sounds.epk"
      - name: Show packaging warnings
        if: always()
        run: |
          set -euo pipefail
          echo "=== Packaging warnings ==="
          if [ -s "$GITHUB_WORKSPACE/packaging-warnings.txt" ]; then
            cat "$GITHUB_WORKSPACE/packaging-warnings.txt"
          else
            echo "None."
          fi
      - name: Build single-file HTML client
        working-directory: ModdedClientSource
        run: |
          set -euo pipefail
          echo "=== Running single-HTML builder ==="
          set +e
          node wasm-toolchain/build-single-html.js
          builder_status=$?
          set -e
          echo "=== Generated HTML files ==="
          find . -type f -name '*.html' -printf '%s %p\\n' | sort -nr | head -50
          html_count="$(find . -type f -name '*.html' | wc -l)"
          if [ "$html_count" -eq 0 ]; then
            echo "::error::build-single-html.js failed and produced no HTML file (exit code $builder_status)."
            exit "$builder_status"
          fi
          # The Eagler single-HTML builder writes the client HTML before its
          # optional music-pack export. A missing/invalid music EPK therefore
          # must not discard an otherwise successfully generated client.
          if [ "$builder_status" -ne 0 ]; then
            echo "WARNING: single-HTML builder exited with code $builder_status, but it produced the client HTML."
            echo "WARNING: optional post-build asset export failed; continuing with the generated HTML." >> "$GITHUB_WORKSPACE/packaging-warnings.txt"
          fi
      - name: Select final single HTML
        run: |
          set -euo pipefail
          mkdir -p final-client
          candidate="$(find ModdedClientSource -type f -name '*.html' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -z "$candidate" ]; then
            echo "::error::No HTML output was found."
            exit 1
          fi
          cp "$candidate" final-client/Eaglercraft-26.2-VBV-Modded.html
          echo "Final single HTML:"
          ls -lh final-client/Eaglercraft-26.2-VBV-Modded.html
      - name: Report build size changes
        if: always()
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/build-size-report.txt"
          {
            echo "Eaglercraft 26.2 VBV build size report"
            echo "Commit: $GITHUB_SHA"
            echo "Generated: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "=== Final single HTML ==="
            if [ -f "$GITHUB_WORKSPACE/final-client/Eaglercraft-26.2-VBV-Modded.html" ]; then
              stat -c 'bytes=%s' "$GITHUB_WORKSPACE/final-client/Eaglercraft-26.2-VBV-Modded.html"
              ls -lh "$GITHUB_WORKSPACE/final-client/Eaglercraft-26.2-VBV-Modded.html"
            else
              echo "Not produced."
            fi
            echo
            echo "=== Packaging checkpoint ==="
            if [ -d "$GITHUB_WORKSPACE/ModdedClientSource" ]; then
              du -sh "$GITHUB_WORKSPACE/ModdedClientSource"
              game_jar="$(find "$GITHUB_WORKSPACE/ModdedClientSource/game/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit 2>/dev/null || true)"
              if [ -n "$game_jar" ]; then
                stat -c 'game.jar bytes=%s' "$game_jar"
                ls -lh "$game_jar"
              fi
            else
              echo "Not available in package job."
            fi
            echo
            echo "=== Resource tree ==="
            resources="$(find "$GITHUB_WORKSPACE/ModdedClientSource" -type f -path '*/game/src/main/resources' -print -quit 2>/dev/null || true)"
            if [ -n "$resources" ]; then
              du -sh "$(dirname "$resources")" 2>/dev/null || true
            fi
            if [ -d "$GITHUB_WORKSPACE/ModdedClientSource/game/src/main/resources" ]; then
              find "$GITHUB_WORKSPACE/ModdedClientSource/game/src/main/resources" -type f | wc -l | awk '{print "resource files=" $1}'
              du -sh "$GITHUB_WORKSPACE/ModdedClientSource/game/src/main/resources"
            fi
          } | tee "$report"
          echo
          echo "=== Build size report ==="
          cat "$report"
      - name: Upload build size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-size-report
          path: build-size-report.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Final packaging warning summary
        if: always()
        run: |
          set -euo pipefail
          echo "========================================"
          echo "FINAL BUILD WARNING SUMMARY"
          echo "========================================"
          if [ -s "$GITHUB_WORKSPACE/packaging-warnings.txt" ]; then
            cat "$GITHUB_WORKSPACE/packaging-warnings.txt"
          else
            echo "No packaging warnings."
          fi
      - name: Upload final client
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackport26.2-ClientSide
          path: final-client
          retention-days: 7
          if-no-files-found: error
