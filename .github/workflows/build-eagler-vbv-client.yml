name: Build Eaglercraft 26.2 u1 VBV Client

on:
  push:
    paths:
      - "ViaBackport26.2-ClientSide/**"
      - "eaglercraft-26.2-patcher-main.tar.gz"
      - ".github/workflows/build-eagler-vbv-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract patcher archive
        run: |
          set -euo pipefail
          rm -rf Eaglercraft-26.2-u1
          mkdir -p Eaglercraft-26.2-u1
          tar -xzf eaglercraft-26.2-patcher-main.tar.gz -C Eaglercraft-26.2-u1

      - name: Locate actual patcher root
        run: |
          set -euo pipefail
          root=$(find Eaglercraft-26.2-u1 -type f -name 'eagler-patcher' -print -quit | xargs -r dirname)
          if [ -z "$root" ]; then
            root=$(find Eaglercraft-26.2-u1 -type f -name 'GUIDE.md' -print -quit | xargs -r dirname)
          fi
          if [ -z "$root" ]; then
            echo "::error::Could not locate the extracted Eaglercraft patcher root."
            find Eaglercraft-26.2-u1 -maxdepth 4 -type f | sort
            exit 1
          fi
          echo "EAGLER_PATCHER_ROOT=$root" >> "$GITHUB_ENV"
          echo "Patcher root: $root"

      - name: Inspect patcher instructions and CLI
        run: |
          set -euo pipefail
          cd "$EAGLER_PATCHER_ROOT"
          echo "=== GUIDE.md ==="
          if [ -f GUIDE.md ]; then cat GUIDE.md; fi
          echo "=== README.md ==="
          if [ -f README.md ]; then cat README.md; fi
          echo "=== Patcher CLI ==="
          if [ -f ./eagler-patcher ]; then
            chmod +x ./eagler-patcher
            ./eagler-patcher --help || true
          fi
          echo "=== Source/project inputs ==="
          find . -maxdepth 4 -type f | sort | head -1000

      - name: Generate/decompile Eaglercraft source with patcher
        run: |
          set -euo pipefail
          cd "$EAGLER_PATCHER_ROOT"

          # Do not pretend this distribution is a Gradle project. The archive
          # is the patcher source/distribution, so source generation must be
          # performed by its own documented CLI before the VBV Java patch is
          # applied.
          if [ -f ./eagler-patcher ]; then
            chmod +x ./eagler-patcher
            if ./eagler-patcher --help 2>&1 | grep -Eqi 'uncompile|decompile'; then
              echo "::notice::The patcher exposes an uncompile/decompile command; see the previous step for its exact syntax."
            else
              echo "::notice::No uncompile/decompile command was detected in --help."
            fi
          fi

          # Locate an already-generated source tree if the patcher archive
          # itself supplies one.
          generated=$(find . -type f \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit || true)
          if [ -n "$generated" ]; then
            echo "Generated build tree found at $generated"
            exit 0
          fi

          echo "::error::This archive is a patcher distribution, not a Gradle source tree."
          echo "::error::The exact source-generation command from GUIDE.md/README.md must be invoked here before compiling."
          exit 1

      - name: Apply native VBV patch
        run: |
          set -euo pipefail
          python3 ViaBackport26.2-ClientSide/patch/apply_vbv_patch.py "$GITHUB_WORKSPACE"

      - name: Build generated client
        run: |
          set -euo pipefail
          build_root=$(find "$EAGLER_PATCHER_ROOT" -type f \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit | xargs -r dirname)
          if [ -z "$build_root" ]; then
            echo "::error::No generated Gradle client exists yet."
            exit 1
          fi
          cd "$build_root"
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload built client
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackport26.2-ClientSide
          path: Eaglercraft-26.2-u1
