name: Build Eagler Wasm-GC client

on:
  workflow_dispatch:
  push:
    paths:
      - 'ModdedClientSource/**'
      - '.github/workflows/build-eagler-wasm.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ModdedClientSource
    env:
      # TeaVM Wasm-GC builds of a full game need a big heap.
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Discover TeaVM / EPK task names
        id: discover
        run: |
          set -euo pipefail

          # Print every task name in a project that matches a regex (exact task names only).
          find_tasks() {
            local project="$1" regex="$2"
            ./gradlew --no-daemon -q ":${project}:tasks" --all 2>/dev/null \
              | awk '/^[A-Za-z][A-Za-z0-9_-]* - /{print $1}' \
              | grep -E "$regex" || true
          }

          WASM_CLIENT=$(find_tasks target_teavm_wasm_gc        '^generateWasmGC$')
          WASM_MESH=$(find_tasks   target_teavm_wasm_gc_mesh   '^generateWasmGC$')
          WASM_SERVER=$(find_tasks target_teavm_wasm_gc_server '^generateWasmGC$')
          JS_GEN=$(find_tasks      target_teavm                '^generateJavaScript$')
          EPK_TASKS=$(./gradlew --no-daemon -q :target_teavm:tasks --all 2>/dev/null \
              | awk '/^[A-Za-z][A-Za-z0-9_-]* - /{print $1}' | grep -iE 'epk' || true)

          echo "wasm client : ${WASM_CLIENT:-<none>}"
          echo "wasm mesh   : ${WASM_MESH:-<none>}"
          echo "wasm server : ${WASM_SERVER:-<none>}"
          echo "js          : ${JS_GEN:-<none>}"
          echo "epk tasks   : ${EPK_TASKS:-<none>}"

          [ -n "$WASM_CLIENT" ] || { echo "::error::No generateWasmGC task in :target_teavm_wasm_gc"; exit 1; }

          {
            echo "wasm_client=$WASM_CLIENT"
            echo "wasm_mesh=$WASM_MESH"
            echo "wasm_server=$WASM_SERVER"
            echo "js_gen=$JS_GEN"
            echo "epk_tasks=$(echo $EPK_TASKS)"
          } >> "$GITHUB_OUTPUT"

      - name: Build JS target (produces assets.epk / sounds.epk)
        run: |
          set -euo pipefail
          ARGS=()
          [ -n "${{ steps.discover.outputs.js_gen }}" ] && ARGS+=(":target_teavm:generateJavaScript")
          for t in ${{ steps.discover.outputs.epk_tasks }}; do ARGS+=(":target_teavm:$t"); done
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "No JS/EPK tasks found, falling back to :target_teavm:assemble"
            ARGS=(":target_teavm:assemble")
          fi
          ./gradlew --no-daemon --stacktrace "${ARGS[@]}"

      - name: Build Wasm-GC client, mesh worker and server worker
        run: |
          set -euo pipefail
          ARGS=(":target_teavm_wasm_gc:generateWasmGC")
          [ -n "${{ steps.discover.outputs.wasm_mesh }}" ]   && ARGS+=(":target_teavm_wasm_gc_mesh:generateWasmGC")
          [ -n "${{ steps.discover.outputs.wasm_server }}" ] && ARGS+=(":target_teavm_wasm_gc_server:generateWasmGC")
          ARGS+=(":target_teavm_wasm_gc:copyWasmGCRuntime")
          ./gradlew --no-daemon --stacktrace "${ARGS[@]}"

      - name: Verify every artifact deploy_wasm_web.sh needs
        run: |
          set -euo pipefail
          missing=0
          for f in \
            target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm \
            target_teavm_wasm_gc/build/generated/teavm/wasm-gc/classes.wasm-runtime.js \
            target_teavm_wasm_gc_mesh/build/generated/teavm/wasm-gc/mesh-worker.wasm \
            target_teavm_wasm_gc_server/build/generated/teavm/wasm-gc/server-worker.wasm \
            target_teavm/build/web/assets.epk \
            target_teavm/build/web/sounds.epk
          do
            if [ -s "$f" ]; then echo "OK      $f"; else echo "MISSING $f"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::Some artifacts were not generated. Check the discover step output for task names that were <none>."
            echo "Contents of generated dirs:"
            find . -path '*/build/generated/teavm*' -maxdepth 8 -type f | head -50
            find target_teavm/build -maxdepth 3 -type f 2>/dev/null | head -50
            exit 1
          fi

      - name: Deploy (assemble web folder)
        run: bash wasm-toolchain/deploy_wasm_web.sh

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: eagler-wasm-web
          path: ModdedClientSource/target_teavm_wasm_gc/build/web
          if-no-files-found: error
