name: Build Eaglercraft 26.2 u1 VBV Client

on:
  push:
    paths:
      - "ViaBackport26.2-ClientSide/**"
      - "eaglercraft-26.2-patcher-main.tar.gz"
      - ".github/workflows/build-eagler-vbv-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract repository patcher
        run: |
          set -euo pipefail
          rm -rf Eaglercraft-26.2-u1
          mkdir -p Eaglercraft-26.2-u1
          tar -xzf eaglercraft-26.2-patcher-main.tar.gz -C Eaglercraft-26.2-u1

      - name: Inspect patcher and source inputs
        run: |
          set -euo pipefail
          cd Eaglercraft-26.2-u1
          echo "=== START-HERE.md ==="
          find . -type f -iname 'START-HERE.md' -print -exec sed -n '1,300p' {} \;
          echo "=== Patcher help ==="
          for p in $(find . -type f -name 'eagler-patcher' -print); do
            chmod +x "$p" || true
            echo "--- $p --help"
            "$p" --help || true
          done
          echo "=== Build/source files ==="
          find . -type f \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print | sort
          echo "=== Bundled source/project archives ==="
          find . -type f \( -name '*.zip' -o -name '*.jar' \) -print | sort

      - name: Apply native VBV patch
        run: |
          set -euo pipefail
          python3 ViaBackport26.2-ClientSide/patch/apply_vbv_patch.py "$GITHUB_WORKSPACE"

      - name: Build patched client
        run: |
          set -euo pipefail
          cd Eaglercraft-26.2-u1

          # The archive is the real Eaglercraft patcher distribution. If it
          # contains a generated Gradle workspace, build that workspace.
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
            exit 0
          fi

          gradle_root=$(find . -type f \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' \) -print -quit | xargs -r dirname)
          if [ -n "$gradle_root" ]; then
            cd "$gradle_root"
            if [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew build --no-daemon; else gradle build --no-daemon; fi
            exit 0
          fi

          echo "::error::The patcher archive was extracted successfully, but it did not contain a generated Gradle source tree."
          echo "::error::The patcher must first generate/uncompile the Eaglercraft source from its bundled skeleton/source-patch inputs."
          echo "=== Workspace files ==="
          find . -maxdepth 3 -type f | sort | head -500
          exit 1

      - name: Upload built client
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackport26.2-ClientSide
          path: Eaglercraft-26.2-u1
