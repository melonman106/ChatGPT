name: Build Eaglercraft 26.2 u1 VBV Client

on:
  push:
    paths:
      - "ViaBackport26.2-ClientSide/**"
      - ".github/workflows/build-eagler-vbv-client.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download pinned Eaglercraft 26.2 u1 Setup JAR
        run: |
          set -euo pipefail
          mkdir -p build-input
          curl -fL --retry 3 "https://github.com/melonman106/ChatGPT/releases/download/Modded/Eaglercraft-26.2-u1-Setup.jar" -o build-input/Eaglercraft-26.2-u1-Setup.jar
          echo "57bfcacdf24310d48f462a9a508fe2a59acad8487a8de34bb40963c46183c1bd  build-input/Eaglercraft-26.2-u1-Setup.jar" | sha256sum -c -

      - name: Generate Eaglercraft source
        run: |
          set -euo pipefail
          rm -rf Eaglercraft-26.2-u1
          # The pinned Eaglercraft setup JAR is a patcher/installer. It does not
          # accept the old "create-dev" command; it expects --install-dir.
          java -jar build-input/Eaglercraft-26.2-u1-Setup.jar --install-dir Eaglercraft-26.2-u1
          test -d Eaglercraft-26.2-u1

      - name: Apply native VBV patch
        run: |
          set -euo pipefail
          python3 ViaBackport26.2-ClientSide/patch/apply_vbv_patch.py "$GITHUB_WORKSPACE"

      - name: Compile patched client
        run: |
          set -euo pipefail
          cd Eaglercraft-26.2-u1
          # The 26.2 u1 workspace may use Gradle Kotlin DSL and may not
          # preserve the executable bit on gradlew after extraction.
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build --no-daemon
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            gradle build --no-daemon
          else
            echo "::error::No Gradle build files found in Eaglercraft-26.2-u1"
            echo "Top-level files:"
            find . -maxdepth 2 -type f | sort | head -200
            echo "Gradle files anywhere in workspace:"
            find . -type f \( -name 'gradlew' -o -name 'build.gradle' -o -name 'build.gradle.kts' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | sort | head -200
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackport26.2-ClientSide
          path: Eaglercraft-26.2-u1
