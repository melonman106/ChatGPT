name: Build Eaglercraft 26.2 u1 — real client injector

on:
  workflow_dispatch:
  push:
    paths:
      - "ViaBackport26.2-ClientSide/**"
      - ".github/workflows/02-compile-eagler-vbv.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify immutable base HTML
        run: |
          set -euo pipefail
          url="https://github.com/melonman106/ChatGPT/releases/download/1/eaglercraft-26.2-modded-2026-10-05-1523.html"
          sha="778f89bb91cbd3cd3b97341c7a63df5895fab70e1b8461017bffd2efd2f4fbbe"
          curl -fL --retry 3 "$url" -o base.html
          echo "$sha  base.html" | sha256sum -c -
          test "$(wc -c < base.html)" -eq 94088990

      - name: Install the EaglerFabricInjector
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/eaglerfabric/EaglerFabric.git injector
          cd injector
          npm ci --ignore-scripts
          node cli.js /help

      - name: Inject the real EaglerForge runtime into the existing client
        run: |
          set -euo pipefail
          node injector/cli.js base.html Eaglercraft-26.2-VBV-Modded.html /eaglerforge /verbose
          test -s Eaglercraft-26.2-VBV-Modded.html
          test "$(wc -c < Eaglercraft-26.2-VBV-Modded.html)" -ne 94088990
          if cmp -s base.html Eaglercraft-26.2-VBV-Modded.html; then
            echo "::error::Injector produced an unchanged HTML file"
            exit 1
          fi
          grep -q "EaglerForge" Eaglercraft-26.2-VBV-Modded.html
          echo "REAL INJECTION: OK"
          echo "Base bytes:    $(wc -c < base.html)"
          echo "Modded bytes:  $(wc -c < Eaglercraft-26.2-VBV-Modded.html)"
          echo "Base SHA:      $(sha256sum base.html | cut -d' ' -f1)"
          echo "Modded SHA:    $(sha256sum Eaglercraft-26.2-VBV-Modded.html | cut -d' ' -f1)"

      - name: Verify the original Minecraft payloads were not rebuilt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          base = Path("base.html").read_text(encoding="utf-8")
          out = Path("Eaglercraft-26.2-VBV-Modded.html").read_text(encoding="utf-8")
          ids = [
              "eag-inline-decoder",
              "eag-inline-wasm-br",
              "eag-inline-mesh-wasm-br",
              "eag-inline-server-wasm-br",
              "eag-inline-assets",
              "eag-inline-sounds",
          ]
          for ident in ids:
              pat = re.compile(r'<script[^>]*id=["\']'+re.escape(ident)+r'["\'][^>]*>(.*?)</script>', re.S | re.I)
              a = pat.search(base)
              b = pat.search(out)
              if not a or not b:
                  raise SystemExit(f"missing payload: {ident}")
              if a.group(1) != b.group(1):
                  raise SystemExit(f"Minecraft payload changed: {ident}")
              print(ident, "BYTE-PRESERVED")
          print("All six original Eagler payloads are unchanged.")
          PY

      - name: Upload the actually injected client
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-RealInjector-${{ github.run_id }}
          path: Eaglercraft-26.2-VBV-Modded.html
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
