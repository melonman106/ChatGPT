name: Build Eaglercraft 26.2 u1 — client mod integration

on:
  workflow_dispatch:
  push:
    paths:
      - "ViaBackport26.2-ClientSide/**"
      - ".github/workflows/02-compile-eagler-vbv.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify immutable base HTML
        run: |
          set -euo pipefail
          url="https://github.com/melonman106/ChatGPT/releases/download/1/eaglercraft-26.2-modded-2026-10-05-1523.html"
          sha="778f89bb91cbd3cd3b97341c7a63df5895fab70e1b8461017bffd2efd2f4fbbe"
          curl -fL --retry 3 "$url" -o base.html
          echo "$sha  base.html" | sha256sum -c -
          test "$(wc -c < base.html)" -eq 94088990

      - name: Inspect the existing compiled client for its built-in mod runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,re
          from pathlib import Path
          html=Path("base.html").read_text(encoding="utf-8")
          m=re.search(r"""<script[^>]*id=["']eag-inline-wasm-br["'][^>]*>(.*?)</script>""",html,re.S|re.I)
          if not m: raise SystemExit("client.wasm.br payload not found")
          Path("client.wasm.br").write_bytes(base64.b64decode(re.sub(r'\\s+','',m.group(1))))
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq brotli
          brotli -d -f client.wasm.br -o client.wasm
          python3 - <<'PY'
          import re
          from pathlib import Path
          d=Path("client.wasm").read_bytes()
          needles=re.compile(rb'litematica|malilib|modmenu|fabric|resource.?pack|shader|armor.?hud|cloth.?config',re.I)
          hits=[]
          for m in re.finditer(rb'[ -~]{4,}',d):
              if needles.search(m.group()): hits.append((m.start(),m.group().decode('ascii','replace')))
          Path("existing-mod-symbols.txt").write_text('\\n'.join(f"0x{o:08x} {s}" for o,s in hits),encoding='utf-8')
          print("Existing compiled mod/runtime strings:",len(hits))
          for o,s in hits[:1000]: print(f"0x{o:08x} {s}")
          PY

      - name: Prepare browser-side client UI modules
        run: |
          set -euo pipefail
          mkdir -p injected-mods
          cp ViaBackport26.2-ClientSide/webmods/vbv-mod-loader.js injected-mods/vbv-mod-loader.js
          cp ViaBackport26.2-ClientSide/webmods/resource-packs.js injected-mods/resource-packs.js
          cp ViaBackport26.2-ClientSide/webmods/uku-armor-hud.js injected-mods/uku-armor-hud.js
          cp ViaBackport26.2-ClientSide/webmods/vbv-mod-menu-bridge.js injected-mods/vbv-mod-menu-bridge.js

      - name: Inject UI modules without touching the game launch configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import html

          base = Path("base.html").read_text(encoding="utf-8")
          names = [
              "vbv-mod-loader.js",
              "resource-packs.js",
              "uku-armor-hud.js",
              "vbv-mod-menu-bridge.js",
          ]
          tags = []
          for name in names:
              data = Path("injected-mods/" + name).read_text(encoding="utf-8")
              # Append after the complete immutable document. This deliberately
              # avoids eaglercraftXOpts and cannot shift the Minecraft canvas.
              tags.append('<script data-vbv-browser-mod="' + html.escape(name, quote=True) + '">\\n' + data + '\\n</script>')
          marker = "\\n<!-- VBV browser client modules: no launch-config/WASM modification -->\\n" + "\\n".join(tags) + "\\n"
          out = base + marker
          Path("Eaglercraft-26.2-VBV-Modded.html").write_text(out, encoding="utf-8")
          print("Appended browser modules after the immutable HTML document.")
          print("Output bytes:", len(out.encode("utf-8")))
          PY

      - name: Verify browser modules and preserve all Minecraft payloads

        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          base = Path("base.html").read_text(encoding="utf-8")
          out = Path("Eaglercraft-26.2-VBV-Modded.html").read_text(encoding="utf-8")

          required = ["VBVClientMods", "Resource Packs", "uku's Armor HUD", "data-vbv-browser-mod"]
          for marker in required:
              if marker not in out:
                  raise SystemExit("Required browser module marker missing: " + marker)
          if "eaglercraftXOpts.Mods" in out or "data-vbv-native-mod-bootstrap" in out:
              raise SystemExit("Forbidden launch-config mod injection detected")

          ids = [
              "eag-inline-decoder",
              "eag-inline-wasm-br",
              "eag-inline-mesh-wasm-br",
              "eag-inline-server-wasm-br",
              "eag-inline-assets",
              "eag-inline-sounds",
          ]
          for ident in ids:
              pat = re.compile(r'''<script[^>]*id=["']''' + re.escape(ident) + r'''["'][^>]*>(.*?)</script>''', re.S | re.I)
              a = pat.search(base)
              b = pat.search(out)
              if not a or not b:
                  raise SystemExit(f"missing payload: {ident}")
              if a.group(1) != b.group(1):
                  raise SystemExit(f"Minecraft payload changed: {ident}")
              print(ident, "BYTE-PRESERVED")

          if 'data-vbv-native-mod-bootstrap' not in out:
              raise SystemExit("Native mod bootstrap missing")

          print("All six original Eagler payloads are unchanged.")
          print("No EaglerForge or launch-config/WASM modification was added.")
          PY

      - name: Verify the original Minecraft payloads were not rebuilt
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          base = Path("base.html").read_text(encoding="utf-8")
          out = Path("Eaglercraft-26.2-VBV-Modded.html").read_text(encoding="utf-8")
          ids = [
              "eag-inline-decoder",
              "eag-inline-wasm-br",
              "eag-inline-mesh-wasm-br",
              "eag-inline-server-wasm-br",
              "eag-inline-assets",
              "eag-inline-sounds",
          ]
          for ident in ids:
              pat = re.compile(r'''<script[^>]*id=["']''' + re.escape(ident) + r'''["'][^>]*>(.*?)</script>''', re.S | re.I)
              a = pat.search(base)
              b = pat.search(out)
              if not a or not b:
                  raise SystemExit(f"missing payload: {ident}")
              if a.group(1) != b.group(1):
                  raise SystemExit(f"Minecraft payload changed: {ident}")
              print(ident, "BYTE-PRESERVED")
          print("All six original Eagler payloads are unchanged.")
          PY

      - name: Upload the actually injected client
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-RealInjector-${{ github.run_id }}
          path: Eaglercraft-26.2-VBV-Modded.html
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
