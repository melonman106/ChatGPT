name: Inject Eaglercraft 26.2 u1 Mods (No Rebuild)

on:
  workflow_dispatch:
    inputs:
      reverse_run_id:
        description: "Successful reverse-map workflow run containing the recovered modded WASM"
        required: false
        default: "37531655199"
      reverse_artifact_id:
        description: "Recovered WASM artifact ID"
        required: false
        default: "11445140777"
  push:
    paths:
      - "ViaBackport26.2-ClientSide/patch/inject_recovered_wasm_into_html.js"
      - ".github/workflows/02-compile-eagler-vbv.yml"

permissions:
  contents: read
  actions: read

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download recovered modded client WASM
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.reverse_run_id || '37531655199' }}
          artifact-ids: ${{ inputs.reverse_artifact_id || '11445140777' }}
          github-token: ${{ github.token }}
          path: recovered-wasm

      - name: Validate recovered mod payload
        run: |
          set -euo pipefail
          client_wasm="$(find recovered-wasm -type f -name 'client.wasm' -size +0c -print -quit)"
          mod_map="$(find recovered-wasm -type f -name 'mod-map.md' -size +0c -print -quit)"
          test -n "$client_wasm"
          test -n "$mod_map"
          mkdir -p recovered-wasm/extracted
          cp -f "$client_wasm" recovered-wasm/extracted/client.wasm
          cp -f "$mod_map" recovered-wasm/extracted/mod-map.md
          test -s recovered-wasm/extracted/client.wasm
          test -s recovered-wasm/extracted/mod-map.md
          for section in Litematica MaLiLib "Mod Menu"; do
            grep -q "^## $section" recovered-wasm/extracted/mod-map.md
          done
          echo "Recovered WASM: $(stat -c%s recovered-wasm/extracted/client.wasm) bytes"
          sha256sum recovered-wasm/extracted/client.wasm

      - name: Download the known-good working Eagler client
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors \
            "https://github.com/melonman106/ChatGPT/releases/download/1/eaglercraft-26.2-modded-2026-10-05-1523.html" \
            -o base-eaglercraft-26.2.html
          test -s base-eaglercraft-26.2.html
          echo "Base HTML: $(stat -c%s base-eaglercraft-26.2.html) bytes"
          echo "778f89bb91cbd3cd3b97341c7a63df5895fab70e1b8461017bffd2efd2f4fbbe  base-eaglercraft-26.2.html" | sha256sum -c -

      - name: Inject only the recovered mod WASM
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("base-eaglercraft-26.2.html")
          text = p.read_text("utf-8", errors="strict")
          required = [
              'id="eag-inline-decoder"',
              'id="eag-inline-wasm-br"',
              'id="eag-inline-mesh-wasm-br"',
              'id="eag-inline-server-wasm-br"',
              'id="eag-inline-assets"',
              'id="eag-inline-sounds"',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f"Missing required base payload: {marker}")
          print("Base payloads verified; only eag-inline-wasm-br will be replaced.")
          PY

          node ViaBackport26.2-ClientSide/patch/inject_recovered_wasm_into_html.js \
            base-eaglercraft-26.2.html \
            recovered-wasm/extracted/client.wasm \
            eaglercraft-26.2-VBV-injected.html

          test -s eaglercraft-26.2-VBV-injected.html
          grep -q 'id="eag-inline-decoder"' eaglercraft-26.2-VBV-injected.html
          grep -q 'id="eag-inline-wasm-br"' eaglercraft-26.2-VBV-injected.html
          grep -q 'id="eag-inline-mesh-wasm-br"' eaglercraft-26.2-VBV-injected.html
          grep -q 'id="eag-inline-server-wasm-br"' eaglercraft-26.2-VBV-injected.html
          grep -q 'id="eag-inline-assets"' eaglercraft-26.2-VBV-injected.html
          grep -q 'id="eag-inline-sounds"' eaglercraft-26.2-VBV-injected.html

          echo "=== Final injected client ==="
          stat -c '%n %s bytes' eaglercraft-26.2-VBV-injected.html
          sha256sum eaglercraft-26.2-VBV-injected.html

      - name: Save injected client and recovered mod map
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Injected-${{ github.run_id }}
          path: |
            eaglercraft-26.2-VBV-injected.html
            recovered-wasm/extracted/mod-map.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
