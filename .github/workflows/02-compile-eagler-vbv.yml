name: Build Eaglercraft 26.2 u1 — immutable HTML + client mods

on:
  workflow_dispatch:
  push:
    paths:
      - "ViaBackport26.2-ClientSide/webmods/**"
      - ".github/workflows/02-compile-eagler-vbv.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify immutable base HTML
        run: |
          set -euo pipefail
          url="https://github.com/melonman106/ChatGPT/releases/download/1/eaglercraft-26.2-modded-2026-10-05-1523.html"
          sha="778f89bb91cbd3cd3b97341c7a63df5895fab70e1b8461017bffd2efd2f4fbbe"
          curl -fL --retry 3 "$url" -o base.html
          echo "$sha  base.html" | sha256sum -c -
          test "$(wc -c < base.html)" -eq 94088990

      - name: Inject client-side mod layer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base = Path("base.html").read_text(encoding="utf-8")
          parts = [
              Path("ViaBackport26.2-ClientSide/webmods/vbv-mod-loader.js").read_text(encoding="utf-8"),
              Path("ViaBackport26.2-ClientSide/webmods/resource-packs.js").read_text(encoding="utf-8"),
              Path("ViaBackport26.2-ClientSide/webmods/uku-armor-hud.js").read_text(encoding="utf-8"),
              Path("ViaBackport26.2-ClientSide/webmods/vbv-mod-menu-bridge.js").read_text(encoding="utf-8"),
          ]
          payload = "\n\n".join(parts)
          marker = '<script id="vbv-client-mods">'
          if marker in base:
              raise SystemExit("Base HTML already contains vbv-client-mods; refusing to double-inject")
          injection = f'\n{marker}\n(()=>{{\n{payload}\n}})();\n</script>\n'
          pos = base.lower().rfind("</body>")
          if pos < 0:
              pos = len(base)
          out = base[:pos] + injection + base[pos:]
          Path("Eaglercraft-26.2-VBV-Modded.html").write_text(out, encoding="utf-8")
          print("Base bytes:", len(base.encode("utf-8")))
          print("Final bytes:", len(out.encode("utf-8")))
          print("Added bytes:", len(out.encode("utf-8")) - len(base.encode("utf-8")))
          PY

      - name: Verify immutable payloads survived injection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, hashlib
          from pathlib import Path
          a=Path("base.html").read_text(encoding="utf-8")
          b=Path("Eaglercraft-26.2-VBV-Modded.html").read_text(encoding="utf-8")
          ids=["eag-inline-decoder","eag-inline-wasm-br","eag-inline-mesh-wasm-br","eag-inline-server-wasm-br","eag-inline-assets","eag-inline-sounds"]
          for ident in ids:
              pat=re.compile(r'<script[^>]*id=["\']'+re.escape(ident)+r'["\'][^>]*>(.*?)</script>', re.S|re.I)
              ma=pat.search(a); mb=pat.search(b)
              if not ma or not mb:
                  raise SystemExit(f"missing payload {ident}")
              if ma.group(1) != mb.group(1):
                  raise SystemExit(f"payload changed: {ident}")
              print(ident, "OK", len(ma.group(1)))
          print("Base SHA-256:", hashlib.sha256(a.encode()).hexdigest())
          print("Final SHA-256:", hashlib.sha256(b.encode()).hexdigest())
          PY

      - name: Package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Modded-${{ github.run_id }}
          path: Eaglercraft-26.2-VBV-Modded.html
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
