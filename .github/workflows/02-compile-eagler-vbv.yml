name: Build Eaglercraft 26.2 u1 VBV Client

on:
  workflow_dispatch:
  push:
    paths:
      - "ViaBackport26.2-ClientSide/**"
      - ".github/workflows/02-compile-eagler-vbv.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Eaglercraft 26.2 u1 build kit
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/melonman106/ChatGPT/releases/download/Modded/Eaglercraft-26.2-u1-Setup.jar" -o Eaglercraft-26.2-u1-Setup.jar
          echo "57bfcacdf24310d48f462a9a508fe2a59acad8487a8de34bb40963c46183c1bd  Eaglercraft-26.2-u1-Setup.jar" | sha256sum -c -
          rm -rf Eaglercraft-26.2-u1
          java -jar Eaglercraft-26.2-u1-Setup.jar --install-dir Eaglercraft-26.2-u1
          test -d Eaglercraft-26.2-u1

      - name: Build native VBV client
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/Eaglercraft-26.2-u1"
          patcher="$(find "$root" -maxdepth 5 -type f \( -name 'U1-Patcher' -o -name 'eagler-patcher' \) -print -quit || true)"
          if [ -z "$patcher" ]; then echo "::error::U1-Patcher not found"; find "$root" -maxdepth 6 -type f | sort | head -1000; exit 1; fi
          chmod +x "$patcher" || true
          "$patcher" --help 2>&1 | head -200 || true
          # The Setup JAR contains the patcher inputs, but the official Minecraft
          # client JAR is intentionally NOT bundled. Download the pinned 26.2 client.
          jar="$GITHUB_WORKSPACE/minecraft-26.2-client.jar"
          curl -fL --retry 3 \
            "https://piston-data.mojang.com/v1/objects/2dc72797acbc1b63fc16a11c4ac393605f453754/client.jar" \
            -o "$jar"
          echo "40896ee9f1e2bec3c934daac7e93d41e9e3d9c2f8ae0ca366d52ffbfd1afa290  $jar" | sha256sum -c -
          test "$(stat -c%s "$jar")" -eq 39193383
          vineflower="$(find "$root" -type f -iname 'vineflower-1.12.0.jar' -print -quit || true)"
          bundle="$(find "$root" -type f -iname '*source-patch-bundle*.zip' -print -quit || true)"
          skeleton="$(find "$root" -type f \( -iname 'project-skeleton-u1-nettyfix.zip' -o -iname '*project*skeleton*.zip' \) -print -quit || true)"
          overlay="$(find "$root" -type f -iname 'resource-overlay-normal.zip' -print -quit || true)"
          external_root="$(find "$root" -type d -path '*/inputs/resources' -print -quit || true)"
          sounds="$(find "$root" -type f -name sounds.epk -print -quit || true)"
          music="$(find "$root" -type f -name music.epk -print -quit || true)"
          for v in jar vineflower bundle skeleton overlay external_root sounds music; do eval "x=\"\${$v:-}\""; echo "$v=$x"; [ -n "$x" ] || { echo "::error::Missing $v"; exit 1; }; done
          bs="$(sha256sum "$bundle" | cut -d' ' -f1)"
          ss="$(sha256sum "$skeleton" | cut -d' ' -f1)"
          test "$ss" = "3656a83ed8187e2d859612c566f3aa73e242bf1e4633990c5bb4929e0a846c94" || { echo "::error::Unexpected project skeleton SHA-256: $ss"; exit 1; }
          os="$(sha256sum "$overlay" | cut -d' ' -f1)"
          rm -rf vbv-build
          mkdir -p vbv-build
          "$patcher" create-dev --jar "$jar" --output "$GITHUB_WORKSPACE/vbv-build/project" --vineflower "$vineflower" --java17 "${JAVA_HOME_17_X64}/bin/java" --patch-bundle "$bundle" --expected-bundle-sha256 "$bs" --project-skeleton "$skeleton" --expected-skeleton-sha256 "$ss" --resource-overlay "$overlay" --expected-resource-overlay-sha256 "$os" --external-resource-root "$external_root"
          python3 ViaBackport26.2-ClientSide/patch/apply_vbv_patch.py "$GITHUB_WORKSPACE/vbv-build/project"
          test -f vbv-build/project/game/src/main/java/com/melonman106/vbvclient/VBVArmorHud.java
          grep -RIl 'VBVArmorHud.render' vbv-build/project/game/src/main/java/net/minecraft/client | head -5
          cd vbv-build/project
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/vbv-artifact"
          find target_teavm_wasm_gc/build/web -maxdepth 1 -type f -exec cp -f {} "$GITHUB_WORKSPACE/vbv-artifact/" \;
          test -s "$GITHUB_WORKSPACE/vbv-artifact/classes.wasm"

      - name: Verify native Armor HUD is compiled
        run: |
          set -euo pipefail
          grep -RIl 'class VBVArmorHud' vbv-build/project/game/src/main/java | head -5
          grep -RIl 'VBVArmorHud.render' vbv-build/project/game/src/main/java/net/minecraft/client | head -5
          test -s vbv-artifact/classes.wasm

      - name: Upload compiled native client
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-WASM-GC-${{ github.run_id }}
          path: vbv-artifact
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
