name: Build and inspect Herz for Eagler compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-herz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout client project
        uses: actions/checkout@v4
        with:
          path: client

      - name: Checkout Herz Core
        uses: actions/checkout@v4
        with:
          repository: Admanatine/Herz-Core
          path: .herz/Herz-Core

      - name: Checkout Herz Compile
        uses: actions/checkout@v4
        with:
          repository: Admanatine/Herz-Compile
          path: .herz/Herz-Compile

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Herz Core and its Eagler platform package
        shell: bash
        run: |
          set -euo pipefail
          cd .herz/Herz-Core
          chmod +x gradlew
          java -version
          ./gradlew build --no-daemon --stacktrace
          ./gradlew -p eagler/1_8_8 compileHPCKG --no-daemon --stacktrace
          echo "=== Herz Core outputs ==="
          find build eagler/1_8_8/build -type f \( -name '*.jar' -o -name '*.hpckg' \) -print 2>/dev/null | sort || true

      - name: Build Herz Compile tool
        shell: bash
        run: |
          set -euo pipefail
          cd .herz/Herz-Compile
          chmod +x gradlew
          java -version
          ./gradlew :compositer:shadowJar --no-daemon --stacktrace
          echo "=== Herz Compile outputs ==="
          find . -type f -path '*/build/libs/*.jar' -print | sort

      - name: Check target compatibility before client integration
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Herz target metadata ==="
          grep -RniE '1_8_8|u53|26\.2|u1|platformTarget|platformTargetVersion' \
            .herz/Herz-Core .herz/Herz-Compile/manifest \
            --include='*.json' --include='*.gradle.kts' --include='*.java' \
            | head -200 || true
          echo "::warning::The checked-in Herz platform currently targets Eaglercraft 1.8.8 u53, not Eaglercraft 26.2 u1. Successful compilation does not make its packages compatible with the 26.2 client; do not inject these outputs into the production client yet."

      - name: Upload actual Herz build outputs
        uses: actions/upload-artifact@v4
        with:
          name: Herz-build-outputs-${{ github.run_id }}
          path: |
            .herz/Herz-Core/build/**/*.jar
            .herz/Herz-Core/eagler/1_8_8/build/**/*.jar
            .herz/Herz-Core/eagler/1_8_8/build/**/*.hpckg
            .herz/Herz-Compile/compositer/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
