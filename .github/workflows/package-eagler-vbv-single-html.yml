name: Package Eaglercraft 26.2 VBV Client as Single HTML

on:
  workflow_dispatch:
    inputs:
      checkpoint_artifact_url:
        description: "GitHub Actions artifact URL for a successful vbv-wasm-build-checkpoint"
        required: true
        type: string
        default: "https://github.com/melonman106/ChatGPT/actions/runs/37157760490/artifacts/11286903940"
      with_music:
        description: "Embed optional music into the single HTML (makes the file larger)"
        required: false
        type: boolean
        default: false
      fast_package:
        description: "Use faster Brotli packaging (larger HTML, but quicker)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  package-single-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "ViaBackport26.2-ClientSide/../package-lock.json"

      - name: Download successful WASM-GC checkpoint artifact
        run: |
          set -euo pipefail

          url="${{ inputs.checkpoint_artifact_url }}"
          archive="$GITHUB_WORKSPACE/checkpoint.zip"
          work="$GITHUB_WORKSPACE/checkpoint-import"

          rm -rf "$work" "$GITHUB_WORKSPACE/ModdedClientSource"
          mkdir -p "$work"

          download_url="$url"
          curl_auth_args=()

          if [[ "$url" =~ ^https://github\.com/([^/]+/[^/]+)/actions/runs/[0-9]+/artifacts/([0-9]+)/?$ ]]; then
            repo_from_url="${BASH_REMATCH[1]}"
            artifact_id="${BASH_REMATCH[2]}"
            download_url="https://api.github.com/repos/${repo_from_url}/actions/artifacts/${artifact_id}/zip"
            curl_auth_args=(
              -H "Authorization: Bearer $GITHUB_TOKEN"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28"
            )
            echo "Detected GitHub artifact URL."
            echo "Artifact ID: $artifact_id"
          elif [[ "$url" =~ ^https://api\.github\.com/repos/[^/]+/[^/]+/actions/artifacts/[0-9]+/zip/?$ ]]; then
            curl_auth_args=(
              -H "Authorization: Bearer $GITHUB_TOKEN"
              -H "Accept: application/vnd.github+json"
              -H "X-GitHub-Api-Version: 2022-11-28"
            )
            echo "Detected GitHub artifact API URL."
          else
            echo "::error::Unsupported checkpoint URL. Use a GitHub Actions artifact browser URL or artifact API URL."
            exit 1
          fi

          curl -fL --retry 3 --retry-delay 2 --location "${curl_auth_args[@]}" "$download_url" -o "$archive"
          test -s "$archive"
          echo "Checkpoint ZIP: $(du -h "$archive" | cut -f1)"

          unzip -q "$archive" -d "$work"

          source="$(find "$work" -type f -path '*/ModdedClientSource/game/build/libs/game.jar' -print -quit || true)"
          if [ -z "$source" ]; then
            echo "::error::Checkpoint artifact does not contain ModdedClientSource/game/build/libs/game.jar."
            find "$work" -maxdepth 6 -type f | sort | head -300
            exit 1
          fi

          checkpoint_root="$(dirname "$(dirname "$(dirname "$(dirname "$(dirname "$source")")")")")"
          test -f "$checkpoint_root/wasm-toolchain/build-single-html.js"
          test -f "$checkpoint_root/target_teavm_wasm_gc/build/web/index.html"

          cp -a "$checkpoint_root" "$GITHUB_WORKSPACE/ModdedClientSource"

          echo "=== Imported checkpoint ==="
          du -sh "$GITHUB_WORKSPACE/ModdedClientSource"
          find "$GITHUB_WORKSPACE/ModdedClientSource/target_teavm_wasm_gc/build/web" -maxdepth 1 -type f \
            \( -name '*.wasm' -o -name '*.epk' -o -name '*.html' \) -printf '%s %p\\n' | sort -nr

      - name: Install single-file packaging dependency
        working-directory: ModdedClientSource
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock brotli-dec-wasm

      - name: Verify single-file inputs
        working-directory: ModdedClientSource
        run: |
          set -euo pipefail
          test -s wasm-toolchain/build-single-html.js
          test -s target_teavm_wasm_gc/build/web/index.html
          test -s target_teavm_wasm_gc/build/web/classes.wasm
          test -s target_teavm_wasm_gc/build/web/mesh-worker.wasm
          test -s target_teavm_wasm_gc/build/web/server-worker.wasm
          test -s target_teavm_wasm_gc/build/web/assets.epk
          test -s target_teavm_wasm_gc/build/web/sounds.epk
          test -s target_teavm/build/web/music.epk
          echo "All single-file packaging inputs are present."

      - name: Package standalone single HTML
        working-directory: ModdedClientSource
        env:
          EAGLER_BUILD_CAP_MIB: "12288"
          EAGLER_BUILD_XMX_MIB: "10240"
        run: |
          set -euo pipefail

          args=(--skip-build --output "$GITHUB_WORKSPACE/eaglercraft-26.2-VBV-single.html")
          if [ "${{ inputs.with_music }}" = "true" ]; then
            args+=(--with-music)
          fi
          if [ "${{ inputs.fast_package }}" = "true" ]; then
            args+=(--fast-package)
          fi

          node wasm-toolchain/build-single-html.js "${args[@]}"

          test -s "$GITHUB_WORKSPACE/eaglercraft-26.2-VBV-single.html"
          echo "=== Single HTML ==="
          ls -lh "$GITHUB_WORKSPACE/eaglercraft-26.2-VBV-single.html"

      - name: Export optional music pack
        if: inputs.with_music == false
        working-directory: ModdedClientSource
        run: |
          set -euo pipefail
          node wasm-toolchain/export-music-resource-pack.js \
            target_teavm/build/web/music.epk \
            "$GITHUB_WORKSPACE/eaglercraft-26.2-VBV-optional-music.zip"
          test -s "$GITHUB_WORKSPACE/eaglercraft-26.2-VBV-optional-music.zip"
          ls -lh "$GITHUB_WORKSPACE/eaglercraft-26.2-VBV-optional-music.zip"

      - name: Verify final HTML
        run: |
          set -euo pipefail
          file "$GITHUB_WORKSPACE/eaglercraft-26.2-VBV-single.html"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("eaglercraft-26.2-VBV-single.html")
          b = p.stat().st_size
          print(f"Single HTML size: {b:,} bytes ({b / 1_000_000:.2f} MB)")
          text = p.read_text("utf-8", errors="ignore")
          required = [
              'id="eag-inline-wasm-br"',
              'id="eag-inline-mesh-wasm-br"',
              'id="eag-inline-server-wasm-br"',
              'id="eag-inline-assets"',
              'id="eag-inline-sounds"',
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit("Missing inline payloads: " + ", ".join(missing))
          print("All required inline payloads are embedded.")
          PY

      - name: Upload single HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Single-HTML
          path: |
            eaglercraft-26.2-VBV-single.html
            eaglercraft-26.2-VBV-optional-music.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish artifact link
        if: always()
        run: |
          {
            echo "## Eaglercraft 26.2 VBV — Single HTML"
            echo
            echo "The single-file HTML artifact is uploaded above."
            echo
            echo "[Open the GitHub Actions artifact for this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)"
            echo
            echo "Artifact name: `Eaglercraft-26.2-VBV-Single-HTML`"
          } >> "$GITHUB_STEP_SUMMARY"
