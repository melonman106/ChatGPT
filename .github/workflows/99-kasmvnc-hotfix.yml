name: KasmVNC socket hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Patch KasmVNC into an isolated network namespace
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.github/workflows/08-eagler-visual-desktop.yml';
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: 'main'
            });
            const text = Buffer.from(file.content, 'base64').toString('utf8');
            const replacements = [
              [
                'proxy_pass https://127.0.0.1:8444/;',
                'proxy_pass https://10.200.0.2:8444/;'
              ],
              [
                'interface: 127.0.0.1\n            websocket_port: 8444',
                'interface: 10.200.0.2\n            websocket_port: 8444\n            use_ipv4: true\n            use_ipv6: false'
              ],
              [
                '          vncserver -kill :1 >/dev/null 2>&1 || true\n          vncserver -kill :2 >/dev/null 2>&1 || true\n          rm -f /tmp/.X2-lock /tmp/.X11-unix/X2 "$HOME/.vnc/"*":2.pid" "$HOME/.vnc/"*":2.pid.lock"\n          sudo fuser -k 5902/tcp 8444/tcp >/dev/null 2>&1 || true\n          echo "Existing listeners before KasmVNC:"\n          ss -ltnp 2>/dev/null | grep -E ':(5902|8444)\\b' || true\n          echo "Starting KasmVNC with raw RFB TCP disabled; WebSocket remains on 8444."\n          sg ssl-cert -c \'vncserver :2 -geometry 1280x720 -depth 24 -localhost yes -rfbport -1 -websocketPort 8444 -httpd /usr/share/kasmvnc/www -sslOnly -interface 127.0.0.1 -select-de manual\'\n          for i in $(seq 1 45); do\n            if curl --insecure --silent --output /dev/null https://127.0.0.1:8444/; then break; fi',
                '          sudo ip netns del eagler-kasm >/dev/null 2>&1 || true\n          sudo ip netns add eagler-kasm\n          sudo ip link add eagler-kasm-host type veth peer name eagler-kasm-peer\n          sudo ip link set eagler-kasm-peer netns eagler-kasm\n          sudo ip addr add 10.200.0.1/24 dev eagler-kasm-host\n          sudo ip link set eagler-kasm-host up\n          sudo ip netns exec eagler-kasm ip link set lo up\n          sudo ip netns exec eagler-kasm ip addr add 10.200.0.2/24 dev eagler-kasm-peer\n          sudo ip netns exec eagler-kasm ip link set eagler-kasm-peer up\n          rm -f /tmp/.X2-lock /tmp/.X11-unix/X2 "$HOME/.vnc/"*":2.pid" "$HOME/.vnc/"*":2.pid.lock"\n          echo "Starting KasmVNC inside isolated network namespace eagler-kasm."\n          sg ssl-cert -c \'ip netns exec eagler-kasm vncserver :2 -geometry 1280x720 -depth 24 -localhost no -rfbport -1 -websocketPort 8444 -httpd /usr/share/kasmvnc/www -sslOnly -interface 10.200.0.2 -select-de manual\'\n          for i in $(seq 1 45); do\n            if curl --insecure --silent --output /dev/null https://10.200.0.2:8444/; then break; fi'
              ],
              [
                'https://127.0.0.1:8444/',
                'https://10.200.0.2:8444/'
              ]
            ];
            let next = text;
            for (const [from, to] of replacements) {
              if (!next.includes(from)) throw new Error(`Hotfix pattern not found: ${from.slice(0, 100)}`);
              next = next.replace(from, to);
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Fix KasmVNC abstract socket collision with network namespace',
              content: Buffer.from(next).toString('base64'),
              sha: file.sha,
              branch: 'main'
            });
            core.info('Patched 08-eagler-visual-desktop.yml');

      - name: Remove one-shot hotfix workflow
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.github/workflows/99-kasmvnc-hotfix.yml';
            try {
              const { data: file } = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main' });
              await github.rest.repos.deleteFile({ owner: context.repo.owner, repo: context.repo.repo, path, message: 'Remove one-shot KasmVNC hotfix workflow', sha: file.sha, branch: 'main' });
            } catch (e) {
              core.info(`Cleanup skipped: ${e.message}`);
            }
