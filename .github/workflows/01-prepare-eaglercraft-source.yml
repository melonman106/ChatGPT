name: "01 - Prepare Eaglercraft 26.2 u1 Source Project"

on:
  workflow_dispatch:
    inputs:
      client_jar_url:
        description: "Optional override URL for the Minecraft client JAR; defaults to the Mojang URL pinned in this workflow"
        required: false
        type: string
      client_jar_sha256:
        description: "Optional SHA-256 override; otherwise verifies the SHA-1 hash embedded in the Mojang URL"
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare-source-project:
    name: "Prepare verified 26.2 u1 source + Gradle project"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout client repository
        uses: actions/checkout@v4

      - name: Locate the patcher inputs already stored in the repository
        id: inputs
        shell: bash
        env:
          CLIENT_JAR_URL: ${{ inputs.client_jar_url || 'https://piston-data.mojang.com/v1/objects/2dc72797acbc1b63fc16a11c4ac393605f453754/client.jar' }}
          CLIENT_JAR_SHA256: ${{ inputs.client_jar_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p build-inputs/portable build-inputs/downloads
          # The source checkout intentionally omits the large authenticated inputs.
          # The complete Setup JAR embeds the release kit containing them.
          setup_jar="build-inputs/downloads/Eaglercraft-26.2-u1-Setup.jar"
          setup_url="https://github.com/melonman106/Eagler-26.2-Client/releases/download/Modded/Eaglercraft-26.2-u1-Setup.jar"
          expected_setup_sha256="57bfcacdf24310d48f462a9a508fe2a59acad8487a8de34bb40963c46183c1bd"
          curl --fail --location --retry 3 "$setup_url" -o "$setup_jar"
          echo "$expected_setup_sha256  $setup_jar" | sha256sum --check

          embedded_kit="build-inputs/downloads/portable-kit.zip"
          embedded_sum="build-inputs/downloads/portable-kit.sha256"
          unzip -p "$setup_jar" portable-kit.zip > "$embedded_kit"
          unzip -p "$setup_jar" portable-kit.sha256 > "$embedded_sum"
          test -s "$embedded_kit" || { echo "::error::Setup JAR does not contain portable-kit.zip"; exit 1; }
          test -s "$embedded_sum" || { echo "::error::Setup JAR does not contain portable-kit.sha256"; exit 1; }
          expected_kit="$(tr -d '[:space:]' < "$embedded_sum")"
          [[ "$expected_kit" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Invalid embedded portable-kit checksum"; exit 1; }
          echo "$expected_kit  $embedded_kit" | sha256sum --check

          unzip -q "$embedded_kit" -d build-inputs/portable
          echo "Authenticated Setup kit extracted; listing required input archives:"
          find build-inputs/portable -type f \( -iname '*skeleton*' -o -iname '*patch-bundle*' -o -iname '*resource-overlay*' \) -print | sort || true

          find_file() {
            local pattern="$1"
            find build-inputs/portable u1-1-source U1-Patcher -type f -iname "$pattern" -print -quit 2>/dev/null || true
          }

          jar="$(find . -type f \( -iname 'minecraft-26.2-client.jar' -o -iname 'eaglercraft-26.2-client.jar' \) -not -path './.git/*' -print -quit)"
          if [ -z "$jar" ]; then
            [[ "$CLIENT_JAR_URL" == https://* ]] || { echo "::error::Client JAR URL must use HTTPS"; exit 1; }
            curl --fail --location --retry 3 "$CLIENT_JAR_URL" -o build-inputs/downloads/minecraft-26.2-client.jar
            if [ -n "$CLIENT_JAR_SHA256" ]; then
              [[ "$CLIENT_JAR_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Client JAR SHA-256 must be 64 hexadecimal characters"; exit 1; }
              echo "$CLIENT_JAR_SHA256  build-inputs/downloads/minecraft-26.2-client.jar" | sha256sum --check
            else
              # Mojang's object URL contains the expected SHA-1 digest.
              expected_sha1="$(echo "$CLIENT_JAR_URL" | sed -nE 's#https://piston-data\.mojang\.com/v1/objects/([a-fA-F0-9]{40})/client\.jar#\1#p')"
              if [ -z "$expected_sha1" ]; then
                echo "::error::For a non-Mojang URL, provide client_jar_sha256 so the download can be verified."
                exit 1
              fi
              echo "$expected_sha1  build-inputs/downloads/minecraft-26.2-client.jar" | sha1sum --check
            fi
            jar="$PWD/build-inputs/downloads/minecraft-26.2-client.jar"
          else
            jar="$(realpath "$jar")"
            echo "Found client JAR in repository: $jar"
          fi

          vineflower="$(find_file 'vineflower-1.12.0.jar')"
          bundle="$(find_file 'source-patch-bundle.zip')"
          skeleton="$(find_file 'project-skeleton-u1-nettyfix.zip')"
          overlay="$(find_file 'resource-overlay-normal.zip')"
          external_root="$(find build-inputs/portable -type d -path '*/inputs/resources' -print -quit 2>/dev/null || true)"

          # Some portable-kit exports rename local inputs. Identify authenticated
          # archives by their pinned SHA-256, not only by their filename.
          find_archive_by_sha256() {
            local expected="$1"
            find build-inputs/portable u1-1-source U1-Patcher -type f -iname '*.zip' -not -path '*/.git/*' -print0 2>/dev/null |
              while IFS= read -r -d '' candidate; do
                actual="$(sha256sum "$candidate" | cut -d ' ' -f1)"
                if [ "$actual" = "$expected" ]; then
                  printf '%s\n' "$candidate"
                  break
                fi
              done
          }
          [ -n "$bundle" ] || bundle="$(find_archive_by_sha256 fd944e9cabbebbf4bddce8a39e1b233b3c7d0cd4f860f9cae37550a3fcfa8b02)"
          [ -n "$skeleton" ] || skeleton="$(find_archive_by_sha256 a9172bdd903ea65afd4c87cdb29b500c237c823fdd94789c2e90561b1b049469)"
          [ -n "$overlay" ] || overlay="$(find_archive_by_sha256 2ba7e3376891c64f8bf57f3687e05b8dbe1971a75475b6825449e5e5f96d71f3)"

          # Accept the known local source-layout variants as well as the portable-kit layout.
          [ -n "$vineflower" ] || vineflower="$(find . -type f -iname 'vineflower-1.12.0.jar' -not -path './.git/*' -print -quit)"
          [ -n "$bundle" ] || bundle="$(find . -type f -iname 'source-patch-bundle.zip' -not -path './.git/*' -print -quit)"
          [ -n "$skeleton" ] || skeleton="$(find . -type f -iname 'project-skeleton-u1-nettyfix.zip' -not -path './.git/*' -print -quit)"
          [ -n "$overlay" ] || overlay="$(find . -type f -iname 'resource-overlay-normal.zip' -not -path './.git/*' -print -quit)"
          [ -n "$external_root" ] || external_root="$(find . -type d -name external-resource-root -not -path './.git/*' -print -quit)"

          for pair in "Vineflower:$vineflower" "source patch bundle:$bundle" "project skeleton:$skeleton" "resource overlay:$overlay" "external resources:$external_root"; do
            label="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::Could not locate $label in U1-Patcher/portable-kit.zip or the checked-out repository."
              if [ "$label" = "project skeleton" ]; then
                echo "::error::The project-skeleton exporter exists at u1-1-source/patcher/project-skeleton/export_skeleton.py, but the exporter requires the actual Gradle project root (settings.gradle.kts, build.gradle.kts, gradlew, platform/ and target_teavm_wasm_gc/). Those inputs are not generated by the source-reconstruction step."
                echo "::error::Expected authenticated skeleton SHA-256: a9172bdd903ea65afd4c87cdb29b500c237c823fdd94789c2e90561b1b049469."
                echo "::error::Portable-kit skeleton-related files were listed above; no matching archive was found."
              fi
              echo "Add the missing authenticated input to the repository or to U1-Patcher/portable-kit.zip, then rerun workflow 01."
              exit 1
            fi
          done

          echo "client_jar=$jar" >> "$GITHUB_OUTPUT"
          echo "vineflower=$(realpath "$vineflower")" >> "$GITHUB_OUTPUT"
          echo "bundle=$(realpath "$bundle")" >> "$GITHUB_OUTPUT"
          echo "skeleton=$(realpath "$skeleton")" >> "$GITHUB_OUTPUT"
          echo "overlay=$(realpath "$overlay")" >> "$GITHUB_OUTPUT"
          echo "external_root=$(realpath "$external_root")" >> "$GITHUB_OUTPUT"

          echo "All required local patcher inputs located."
          sha256sum "$vineflower" "$bundle" "$skeleton" "$overlay"

      - name: Set up Java 17 for source reconstruction
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the repository's patcher CLI
        run: |
          set -euo pipefail
          chmod +x u1-1-source/patcher/java-cli/build.sh u1-1-source/patcher/java-cli/run.sh
          u1-1-source/patcher/java-cli/build.sh

      - name: Reconstruct source and seed the Gradle project
        env:
          CLIENT_JAR: ${{ steps.inputs.outputs.client_jar }}
          VINEFLOWER: ${{ steps.inputs.outputs.vineflower }}
          PATCH_BUNDLE: ${{ steps.inputs.outputs.bundle }}
          SKELETON: ${{ steps.inputs.outputs.skeleton }}
          RESOURCE_OVERLAY: ${{ steps.inputs.outputs.overlay }}
          EXTERNAL_ROOT: ${{ steps.inputs.outputs.external_root }}
        run: |
          set -euo pipefail
          u1-1-source/patcher/java-cli/run.sh create-dev \
            --jar "$CLIENT_JAR" \
            --output "$PWD/prepared-eaglercraft-26.2-u1" \
            --vineflower "$VINEFLOWER" \
            --java17 "$(command -v java)" \
            --patch-bundle "$PATCH_BUNDLE" \
            --expected-bundle-sha256 fd944e9cabbebbf4bddce8a39e1b233b3c7d0cd4f860f9cae37550a3fcfa8b02 \
            --project-skeleton "$SKELETON" \
            --expected-skeleton-sha256 a9172bdd903ea65afd4c87cdb29b500c237c823fdd94789c2e90561b1b049469 \
            --resource-overlay "$RESOURCE_OVERLAY" \
            --expected-resource-overlay-sha256 2ba7e3376891c64f8bf57f3687e05b8dbe1971a75475b6825449e5e5f96d71f3 \
            --external-resource-root "$EXTERNAL_ROOT"

          test -x prepared-eaglercraft-26.2-u1/gradlew
          test -d prepared-eaglercraft-26.2-u1/game/src/main/java
          test -d prepared-eaglercraft-26.2-u1/target_teavm_wasm_gc
          echo "Prepared source project layout verified."

      - name: Upload source project for workflow 02
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-u1-Source-Project-${{ github.run_id }}
          path: prepared-eaglercraft-26.2-u1/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
