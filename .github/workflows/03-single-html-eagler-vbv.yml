name: Package Eaglercraft 26.2 VBV + Herz Client as Single HTML

on:
  workflow_dispatch:
    inputs:
      compile_run_id:
        description: "Successful 02-compile-eagler-vbv.yml run ID"
        required: true
        type: string
      with_music:
        description: "Embed optional music into the single HTML"
        required: false
        type: boolean
        default: false
      fast_package:
        description: "Use faster Brotli packaging"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  package-single-html:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download compiled VBV + Herz browser output
        env:
          RUN_ID: ${{ inputs.compile_run_id }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == ("Eaglercraft-26.2-VBV-Herz-WASM-GC-" + env.RUN_ID)) | .id' | head -n1)"
          if [ -z "$artifact_id" ]; then
            echo "::error::No Eaglercraft-26.2-VBV-Herz-WASM-GC artifact found in run $RUN_ID."
            exit 1
          fi
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name "Eaglercraft-26.2-VBV-Herz-WASM-GC-$RUN_ID" --dir compiled-web
          test -f compiled-web/classes.wasm
          test -f compiled-web/mesh-worker.wasm
          test -f compiled-web/server-worker.wasm
          test -f compiled-web/assets.epk

      - name: Package compiled client into one HTML
        run: |
          set -euo pipefail
          args=(--skip-build --output eaglercraft-26.2-vbv-herz.html)
          if [ "${{ inputs.fast_package }}" = "true" ]; then
            args+=(--fast-package)
          fi
          node u1-1-source/wasm-toolchain/build-single-html.js "${args[@]}" --web-root "$PWD/compiled-web"
          test -s eaglercraft-26.2-vbv-herz.html
          grep -q 'eag-inline-wasm-br' eaglercraft-26.2-vbv-herz.html
          grep -q 'eag-inline-mesh-wasm-br' eaglercraft-26.2-vbv-herz.html
          grep -q 'eag-inline-server-wasm-br' eaglercraft-26.2-vbv-herz.html
          grep -q 'eag-inline-assets' eaglercraft-26.2-vbv-herz.html
          echo "Built: $(stat -c%s eaglercraft-26.2-vbv-herz.html) bytes"

      - name: Upload single HTML client
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Herz-Single-HTML-${{ github.run_id }}
          path: eaglercraft-26.2-vbv-herz.html
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
