name: "03 - Package Eaglercraft 26.2 (Single HTML)"

run-name: "03 - Package single HTML (manual)"

on:
  workflow_dispatch:
    inputs:
      compile_run_id:
        description: "Run ID from successful workflow 02 - Compile Eaglercraft 26.2 u1 (VBV + Herz)"
        required: false
        type: string
        default: ""
      with_music:
        description: "Embed optional music into the single HTML"
        required: false
        type: boolean
        default: false
      fast_package:
        description: "Use faster Brotli packaging"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  package-single-html:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve compile workflow run
        id: compile
        env:
          REQUESTED_RUN_ID: ${{ inputs.compile_run_id }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id="$REQUESTED_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id="$(gh api "repos/${{ github.repository }}/actions/workflows/02-compile-eagler-vbv.yml/runs?status=success&per_page=20" --jq '.workflow_runs | map(select(.conclusion == "success")) | .[0].id // empty')"
          fi
          if [ -z "$run_id" ]; then
            echo "::error::No successful workflow 02 run found. Run workflow 02 first."
            exit 1
          fi
          artifact_name="Eaglercraft-26.2-VBV-Herz-WASM-GC-$run_id"
          artifact_id="$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts?per_page=100" --jq --arg name "$artifact_name" '.artifacts[] | select(.name == $name and .expired == false) | .id' | head -n1)"
          if [ -z "$artifact_id" ]; then
            echo "::error::No unexpired $artifact_name artifact found in workflow run $run_id."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "Using workflow 02 run $run_id, artifact $artifact_name ($artifact_id)."

      - name: Download compiled VBV + Herz browser output
        env:
          RUN_ID: ${{ steps.compile.outputs.run_id }}
          ARTIFACT_NAME: ${{ steps.compile.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name "$ARTIFACT_NAME" --dir compiled-web
          test -f compiled-web/classes.wasm
          test -f compiled-web/mesh-worker.wasm
          test -f compiled-web/server-worker.wasm
          test -f compiled-web/assets.epk

      - name: Package compiled client into one HTML
        run: |
          set -euo pipefail
          args=(--skip-build --output eaglercraft-26.2-vbv-herz.html)
          if [ "${{ inputs.fast_package }}" = "true" ]; then
            args+=(--fast-package)
          fi
          node u1-1-source/wasm-toolchain/build-single-html.js "${args[@]}" --web-root "$PWD/compiled-web"
          test -s eaglercraft-26.2-vbv-herz.html
          grep -q 'eag-inline-wasm-br' eaglercraft-26.2-vbv-herz.html
          grep -q 'eag-inline-mesh-wasm-br' eaglercraft-26.2-vbv-herz.html
          grep -q 'eag-inline-server-wasm-br' eaglercraft-26.2-vbv-herz.html
          grep -q 'eag-inline-assets' eaglercraft-26.2-vbv-herz.html
          echo "Built: $(stat -c%s eaglercraft-26.2-vbv-herz.html) bytes"

      - name: Upload single HTML client
        uses: actions/upload-artifact@v4
        with:
          name: Eaglercraft-26.2-VBV-Herz-Single-HTML-${{ github.run_id }}
          path: eaglercraft-26.2-vbv-herz.html
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
