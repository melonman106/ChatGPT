name: Run VBV Fix Scripts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify fix scripts
        shell: bash
        run: |
          set -euo pipefail
          test -f apply_fixes.py || { echo "::error::apply_fixes.py is missing"; exit 1; }
          test -f apply_fixes_2.py || { echo "::error::apply_fixes_2.py is missing"; exit 1; }

      - name: Run apply_fixes.py
        shell: bash
        run: |
          set -euo pipefail
          python3 apply_fixes.py

      - name: Run apply_fixes_2.py
        shell: bash
        run: |
          set -euo pipefail
          python3 apply_fixes_2.py

      - name: Show changes
        shell: bash
        run: |
          git status --short
          git diff --stat

      - name: Commit and push fixes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes were made by the fix scripts."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # GitHub's Actions token is intentionally not granted the special
          # "workflows" permission. Do not try to push workflow edits from
          # this automation: GitHub rejects that push even when contents:write
          # is enabled. Commit only source/resource changes.
          git add -A -- ':!.github/workflows/**'
          if git diff --cached --quiet; then
            echo "Only workflow files changed; leaving them uncommitted."
            git diff -- .github/workflows || true
            exit 0
          fi
          git commit -m "Run VBV fix scripts"
          git push
