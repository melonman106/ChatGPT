name: KasmVNC interface name fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fix Linux interface names
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.github/workflows/08-eagler-visual-desktop.yml';
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: 'main'
            });
            let text = Buffer.from(file.content, 'base64').toString('utf8');
            text = text.replaceAll('eagler-kasm-host', 'ekasm-host');
            text = text.replaceAll('eagler-kasm-peer', 'ekasm-peer');
            if (text === Buffer.from(file.content, 'base64').toString('utf8')) {
              throw new Error('No interface-name replacement was made');
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Fix KasmVNC veth interface names',
              content: Buffer.from(text).toString('base64'),
              sha: file.sha,
              branch: 'main'
            });
            core.info('Changed veth names to ekasm-host and ekasm-peer (15-char-safe).');

      - name: Remove one-shot fix workflow
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.github/workflows/99-kasmvnc-ifname-fix.yml';
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: 'main'
            });
            await github.rest.repos.deleteFile({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Remove one-shot KasmVNC interface fix',
              sha: file.sha,
              branch: 'main'
            });
