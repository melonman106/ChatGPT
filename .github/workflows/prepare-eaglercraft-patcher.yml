name: Prepare Eaglercraft 26.2 Patcher Workspace

on:
  workflow_dispatch:
  push:
    paths:
      - "eaglercraft-26.2-patcher-main.tar.gz"
      - ".github/workflows/prepare-eaglercraft-patcher.yml"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract patcher archive
        run: |
          set -euo pipefail
          rm -rf eaglercraft-patcher-workspace
          mkdir -p eaglercraft-patcher-workspace
          tar -xzf eaglercraft-26.2-patcher-main.tar.gz -C eaglercraft-patcher-workspace

      - name: Locate and inspect patcher
        run: |
          set -euo pipefail
          cd eaglercraft-patcher-workspace
          echo "=== Workspace ==="
          find . -maxdepth 3 -type f | sort | head -500
          echo "=== Documentation ==="
          find . -maxdepth 3 -type f \( -iname 'START-HERE.md' -o -iname 'README.md' -o -iname 'PORTABLE.md' -o -iname 'GUI.md' \) -print -exec sh -c 'echo "--- $1"; sed -n "1,260p" "$1"' _ {} \;
          echo "=== Patcher entrypoints ==="
          find . -type f \( -name 'eagler-patcher' -o -name 'eagler-patcher.cmd' -o -name '*.jar' \) -print | sort
          for p in $(find . -type f -name 'eagler-patcher' -print); do
            echo "=== $p ==="
            file "$p" || true
            chmod +x "$p" || true
            "$p" --help || true
          done

      - name: Create workspace manifest
        run: |
          set -euo pipefail
          cd eaglercraft-patcher-workspace
          {
            echo "Eaglercraft 26.2 patcher workspace"
            echo
            echo "This artifact is extracted from eaglercraft-26.2-patcher-main.tar.gz."
            echo "The compile workflow consumes the same archive directly."
            echo
            echo "Entrypoints:"
            find . -type f \( -name 'eagler-patcher' -o -name 'eagler-patcher.cmd' -o -name '*.jar' \) -print | sort
          } > WORKSPACE-MANIFEST.txt

      - name: Upload extracted patcher workspace
        uses: actions/upload-artifact@v4
        with:
          name: eaglercraft-26.2-patcher-workspace
          path: eaglercraft-patcher-workspace
