name: Build ViaBackportVisuals

on:
  workflow_dispatch:
  push:
    paths:
      - 'server-mods/ViaBackportVisuals/**'
      - 'resourcepacks/ViaBackportVisuals-26.2-Eagler-Overlay/**'
      - 'resourcepacks/ViaBackportVisuals-26.2-VBPlus-26.3-Companion/**'
      - '.github/workflows/build-via-backport-visuals.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build Fabric 26.3 mod
        working-directory: server-mods/ViaBackportVisuals
        run: gradle build --no-daemon
      - name: Upload server mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackportVisuals-Fabric-26.3
          path: server-mods/ViaBackportVisuals/build/libs/*.jar
          if-no-files-found: error

  build-eagler-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Eagler 26.2 server-only visual pack
        run: |
          python3 resourcepacks/ViaBackportVisuals-26.2-Eagler-Overlay/generate_pack.py build/vbv-eagler-pack
          cd build/vbv-eagler-pack
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path(".")
          assert (root / "pack.mcmeta").is_file(), "pack.mcmeta missing"
          for p in [root / "assets/minecraft/blockstates"]:
              assert p.is_dir(), "blockstates directory missing"
          # Stairs: vanilla 26.2 blockstates must resolve straight/base + inner + outer.
          for name in ["waxed_cut_copper_stairs", "smooth_quartz_stairs"]:
              for suffix in ["", "_inner", "_outer"]:
                  assert (root / f"assets/minecraft/models/block/{name}{suffix}.json").is_file(), f"missing stair model {name}{suffix}"
              assert not (root / f"assets/minecraft/blockstates/{name}.json").exists(), f"stair blockstate was unexpectedly generated: {name}"
          # Slabs: the reserved placeholder blockstate must select the dedicated double model.
          for name in ["waxed_cut_copper_slab", "smooth_quartz_slab"]:
              state = json.loads((root / f"assets/minecraft/blockstates/{name}.json").read_text())
              assert state["variants"]["type=double"]["model"] == f"minecraft:block/{name}_double"
              assert (root / f"assets/minecraft/models/block/{name}_double.json").is_file()
          print("Eagler pack structure validation passed.")
          PY
          zip -qr ../../ViaBackportVisuals-26.2-Eagler-Overlay.zip .
      - name: Upload Eagler visual pack
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackportVisuals-26.2-Eagler-Overlay
          path: ViaBackportVisuals-26.2-Eagler-Overlay.zip
          if-no-files-found: error

# Eagler path: ordinary 26.2 placeholder block models; no client mod or display entities.
