name: Build ViaBackportVisuals

on:
  workflow_dispatch:
  push:
    paths:
      - 'server-mods/ViaBackportVisuals/**'
      - '.github/workflows/build-via-backport-visuals.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compile plugin
        working-directory: server-mods/ViaBackportVisuals
        run: gradle build --no-daemon

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackportVisuals
          path: server-mods/ViaBackportVisuals/build/libs/*.jar
          if-no-files-found: error
