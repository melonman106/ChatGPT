name: Build ViaBackportVisuals

on:
  workflow_dispatch:
  push:
    paths:
      - 'server-mods/ViaBackportVisuals/**'
      - 'resourcepacks/ViaBackportVisuals-26.2-Eagler-Overlay/**'
      - 'resourcepacks/ViaBackportVisuals-26.2-VBPlus-26.3-Companion/**'
      - '.github/workflows/build-via-backport-visuals.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build Fabric 26.3 mod
        working-directory: server-mods/ViaBackportVisuals
        run: gradle build --no-daemon
      - name: Upload server mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackportVisuals-Fabric-26.3
          path: server-mods/ViaBackportVisuals/build/libs/*.jar
          if-no-files-found: error

  build-eagler-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Eagler 26.2 server-only visual pack
        run: |
          python3 resourcepacks/ViaBackportVisuals-26.2-Eagler-Overlay/generate_pack.py build/vbv-eagler-pack
          cd build/vbv-eagler-pack
          zip -qr ../../ViaBackportVisuals-26.2-Eagler-Overlay.zip .
      - name: Upload Eagler visual pack
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackportVisuals-26.2-Eagler-Overlay
          path: ViaBackportVisuals-26.2-Eagler-Overlay.zip
          if-no-files-found: error

# Eagler path: server-side display entities + item_model resource-pack assets.
# No Fabric client companion is built or required.
