name: Build ViaBackportVisuals

on:
  workflow_dispatch:
  push:
    paths:
      - 'server-mods/ViaBackportVisuals/**'
      - 'client-mods/ViaBackportVisualsClient-26.2/**'
      - 'resourcepacks/ViaBackportVisuals-26.2-VBPlus-26.3-Companion/**'
      - '.github/workflows/build-via-backport-visuals.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build Fabric 26.3 mod
        working-directory: server-mods/ViaBackportVisuals
        run: gradle build --no-daemon --refresh-dependencies
      - name: Upload server mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackportVisuals-Fabric-26.3
          path: server-mods/ViaBackportVisuals/build/libs/*.jar
          if-no-files-found: error

  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build Fabric 26.2 client companion
        working-directory: client-mods/ViaBackportVisualsClient-26.2
        run: gradle build --no-daemon --refresh-dependencies
      - name: Generate isolated companion resource pack
        run: |
          rm -rf build/vbv-pack
          python3 resourcepacks/ViaBackportVisuals-26.2-VBPlus-26.3-Companion/generate_models.py build/vbv-pack
          cp resourcepacks/ViaBackportVisuals-26.2-VBPlus-26.3-Companion/pack.mcmeta build/vbv-pack/
          cp resourcepacks/ViaBackportVisuals-26.2-VBPlus-26.3-Companion/README.txt build/vbv-pack/
          cd build/vbv-pack
          zip -qr ../../ViaBackportVisuals-26.2-Isolated-Companion.zip .
      - name: Upload isolated companion resource pack
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackportVisuals-26.2-Isolated-Companion
          path: ViaBackportVisuals-26.2-Isolated-Companion.zip
          if-no-files-found: error

      - name: Upload client mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ViaBackportVisuals-Client-Fabric-26.2
          path: client-mods/ViaBackportVisualsClient-26.2/build/libs/*.jar
          if-no-files-found: error

# Build server and client after ViaBackportVisuals state-aware fixes.
