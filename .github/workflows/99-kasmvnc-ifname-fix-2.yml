name: Fix KasmVNC interface names

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const path = '.github/workflows/08-eagler-visual-desktop.yml';
            const { data } = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
            const oldText = Buffer.from(data.content, 'base64').toString('utf8');
            const newText = oldText
              .replaceAll('eagler-kasm-host', 'ekasm-host')
              .replaceAll('eagler-kasm-peer', 'ekasm-peer');
            if (newText === oldText) {
              core.info('No long KasmVNC interface names remain.');
            } else {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                message: 'Fix KasmVNC veth interface names',
                content: Buffer.from(newText).toString('base64'),
                sha: data.sha,
                branch: 'main'
              });
              core.info('Patched KasmVNC interface names.');
            }
            const fixPath = '.github/workflows/99-kasmvnc-ifname-fix-2.yml';
            const { data: fixFile } = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path: fixPath, ref: 'main'});
            await github.rest.repos.deleteFile({owner: context.repo.owner, repo: context.repo.repo, path: fixPath, message: 'Remove temporary KasmVNC interface fix workflow', sha: fixFile.sha, branch: 'main'});