name: Extract U1 Patcher

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout ChatGPT repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pinned U1 Setup JAR
        run: |
          set -euo pipefail
          mkdir -p download U1-Patcher

          curl -fL --retry 3 \
            "https://github.com/melonman106/ChatGPT/releases/download/Modded/Eaglercraft-26.2-u1-Setup.jar" \
            -o download/Eaglercraft-26.2-u1-Setup.jar

          expected="57bfcacdf24310d48f462a9a508fe2a59acad8487a8de34bb40963c46183c1bd"
          actual="$(sha256sum download/Eaglercraft-26.2-u1-Setup.jar | awk '{print $1}')"

          echo "Expected SHA-256: $expected"
          echo "Actual SHA-256:   $actual"

          if [ "$actual" != "$expected" ]; then
            echo "::error::Setup JAR SHA-256 does not match the pinned value."
            exit 1
          fi

          echo "SHA-256 verified."

      - name: Extract Setup JAR to U1-Patcher
        run: |
          set -euo pipefail
          rm -rf U1-Patcher
          mkdir -p U1-Patcher

          unzip -q download/Eaglercraft-26.2-u1-Setup.jar -d U1-Patcher

          echo "Extracted U1-Patcher:"
          find U1-Patcher -maxdepth 3 -type f | sort | head -300

      - name: Commit U1-Patcher into repository
        run: |
          set -euo pipefail

          rm -rf download

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A U1-Patcher

          if git diff --cached --quiet; then
            echo "U1-Patcher is already up to date."
            exit 0
          fi

          git commit -m "Add extracted Eaglercraft 26.2 u1 patcher"
          git push origin HEAD:main
