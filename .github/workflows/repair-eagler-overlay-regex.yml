name: One-shot Eagler overlay regex repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fix overlay member regex and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/02-compile-eagler-vbv.yml')
          text = path.read_text(encoding='utf-8')
          old = "resource-overlay-normal\\\\.zip"
          new = "resource-overlay-normal\\.zip"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one broken overlay regex, found {count}")
          path.write_text(text.replace(old, new), encoding='utf-8')
          print('Fixed shader overlay ZIP member regex: \\\\. -> \\.')
          PY

          git diff --check
          git diff -- .github/workflows/02-compile-eagler-vbv.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/02-compile-eagler-vbv.yml
          git commit -m 'Fix Eagler shader overlay ZIP member regex'
          git push origin HEAD:main

          git rm .github/workflows/repair-eagler-overlay-regex.yml
          git commit -m 'Remove one-shot Eagler overlay repair workflow'
          git push origin HEAD:main
