name: Wispcraft Inject HTML

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: HTML file in the repository to inject
        required: true
        default: wispcraft/input.html
        type: string

permissions:
  contents: read

jobs:
  inject:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download DhyeyBG Wispcraft injector bundle
        run: |
          set -euo pipefail
          mkdir -p .wispcraft
          curl -fL --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/DhyeyBG/wispcraft-injector/main/index.js \
            -o .wispcraft/index.js
          test -s .wispcraft/index.js
          echo "Downloaded Wispcraft injector: $(wc -c < .wispcraft/index.js) bytes"

      - name: Inject HTML
        env:
          INPUT_FILE: ${{ inputs.input_file }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          input_file = Path(os.environ["INPUT_FILE"])
          bundle_file = Path(".wispcraft/index.js")
          output_file = Path("wispcraft-output") / ("wispcraft-" + input_file.name)

          if not input_file.is_file():
              raise SystemExit(f"Input HTML file not found: {input_file}")
          if input_file.suffix.lower() not in {".html", ".htm"}:
              raise SystemExit("Input file must be .html or .htm")

          html = input_file.read_text(encoding="utf-8")
          if "<head" not in html.lower():
              raise SystemExit("Input does not contain an HTML <head> element")

          bundle = bundle_file.read_text(encoding="utf-8")
          encoded = base64.b64encode(bundle.encode("utf-8")).decode("ascii")

          # This mirrors the injector's browser-side operation: add the
          # Wispcraft bundle as the first script in the client's <head>.
          script = f'<script type="text/javascript">eval(atob("{encoded}"));</script>'

          lower = html.lower()
          head_start = lower.find("<head")
          head_end = lower.find(">", head_start)
          if head_start < 0 or head_end < 0:
              raise SystemExit("Could not locate the opening <head> tag")

          injected = html[:head_end + 1] + script + html[head_end + 1:]
          output_file.parent.mkdir(parents=True, exist_ok=True)
          output_file.write_text(injected, encoding="utf-8")

          print(f"Input:  {input_file}")
          print(f"Output: {output_file}")
          print(f"Output size: {output_file.stat().st_size} bytes")
          PY

      - name: Upload injected HTML
        uses: actions/upload-artifact@v5
        with:
          name: wispcraft-injected-html
          path: wispcraft-output/
          if-no-files-found: error
          retention-days: 7
